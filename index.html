<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self' https: data: blob: 'unsafe-inline' 'unsafe-eval';">
    <title>Stock Transfer & Supply Chain Portal</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- SheetJS (xlsx) for Excel Export & Import -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <!-- jsPDF & AutoTable for PDF Export -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.31/jspdf.plugin.autotable.min.js"></script>
    <!-- Google Fonts: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #f1f5f9; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 9999px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

        .excel-grid th, .excel-grid td {
            border: 1px solid #cbd5e1;
        }
        .excel-cell-editable {
            cursor: cell;
            user-select: none;
            transition: background-color 0.12s ease;
        }
        .excel-cell-editable:hover {
            background-color: #eff6ff;
            outline: 1px solid #3b82f6;
            outline-offset: -1px;
        }
        .excel-cell-editing {
            padding: 0 !important;
            background-color: #ffffff !important;
            outline: 2px solid #2563eb !important;
            outline-offset: -2px;
        }

        .challan-sheet {
            break-after: page;
            page-break-after: always;
        }
        .challan-sheet:last-child {
            break-after: auto;
            page-break-after: auto;
        }

        @media print {
            body * { visibility: hidden !important; }
            #printable-challan, #printable-challan * { visibility: visible !important; }
            #printable-challan {
                position: static !important;
                left: 0 !important;
                top: 0 !important;
                width: 100% !important;
                margin: 0 !important;
                padding: 0 !important;
                box-shadow: none !important;
                border: none !important;
                background: white !important;
            }
            .challan-sheet {
                box-shadow: none !important;
                border: 1px solid #cbd5e1 !important;
                margin-bottom: 0 !important;
                padding: 20px !important;
                break-after: page !important;
                page-break-after: always !important;
            }
            .challan-sheet:last-child {
                break-after: auto !important;
                page-break-after: auto !important;
            }
            .no-print { display: none !important; }
        }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 antialiased selection:bg-blue-600 selection:text-white">

    <!-- Toast Notification Container -->
    <div id="toast-container" class="fixed bottom-5 right-5 z-50 flex flex-col gap-2 pointer-events-none"></div>

    <!-- Custom Modal Container -->

        <div class="bg-white rounded-2xl shadow-2xl max-w-lg w-full overflow-hidden border border-slate-200">

            <div id="modal-body" class="p-6 text-sm text-slate-600 max-h-[75vh] overflow-y-auto"></div>

    <!-- ==================== SECURE LOGIN SCREEN ==================== -->

    <!-- ==================== MAIN APPLICATION SHELL ==================== -->
    <div id="app-view" class="hidden min-h-screen flex flex-col lg:flex-row">
        
        <aside id="sidebar" class="no-print w-full lg:w-72 bg-slate-900 text-slate-300 flex flex-col shrink-0 transition-all">

    <!-- ==================== APPLICATION SCRIPT ==================== -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-app.js";
        import { getAnalytics } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-analytics.js";
        import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-auth.js";
        import {
            getFirestore,
            collection,
            doc,
            setDoc,
            getDocs,
            deleteDoc
        } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCw7brFS62KnSPy7m6Pfpj34A24NXA5qv8",
            authDomain: "kty-store-order-cf0ae.firebaseapp.com",
            projectId: "kty-store-order-cf0ae",
            storageBucket: "kty-store-order-cf0ae.firebasestorage.app",
            messagingSenderId: "567340585940",
            appId: "1:567340585940:web:cfd8de452dc562ec217c41",
            measurementId: "G-NH25J77GLR"
        };

        const firebaseApp = initializeApp(firebaseConfig);
        let analytics = null;
        try { analytics = getAnalytics(firebaseApp); } catch (e) {}
        const auth = getAuth(firebaseApp);
        const firestoreDb = getFirestore(firebaseApp);

        async function ensureFirebaseAuth() {
            try {
                await signInAnonymously(auth);
            } catch (e) {
                console.warn('Anonymous auth offline/unconfigured fallback active.');
            }
        }

        window.escapeHtml = function(str) {
            if (str === null || str === undefined) return '';
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        };

        async function hashPassword(plainText) {
            const encoder = new TextEncoder();
            const data = encoder.encode(plainText + '_KTY_SALT_2026');
            const hashBuffer = await crypto.subtle.digest('SHA-256', data);
            const hashArray = Array.from(new Uint8Array(hashBuffer));
            return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
        }

        const TODAY = new Date().toISOString().split('T')[0];
        const TOMORROW = new Date(Date.now() + 86400000).toISOString().split('T')[0];

        // Single source of truth for all menus & submenus; automatically discovered by User Role Permissions
        const SYSTEM_MENU_REGISTRY = [
            {
                id: 'order-transaction',
                label: 'Order Transaction',
                icon: 'arrow-left-right',
                children: [
                    { id: 'order-form', label: 'Stock Transfer Order Form', icon: 'clipboard-edit', defaultRoles: ['admin', 'branch'] },
                    { id: 'my-orders', label: 'Branch Order History', icon: 'history', defaultRoles: ['admin', 'branch', 'factory_warehouse'] },
                    { id: 'order-matrix', label: 'Consolidated Order Matrix', icon: 'table-2', defaultRoles: ['admin', 'factory_warehouse'] },
                    { id: 'delivery-challan', label: 'Delivery Challan & Print', icon: 'printer', defaultRoles: ['admin', 'factory_warehouse'] }
                ]
            },
            {
                id: 'app-settings',
                label: 'App Settings',
                icon: 'sliders-horizontal',
                children: [
                    { id: 'master-items', label: 'Categories & Item Master', icon: 'package', defaultRoles: ['admin'] },
                    { id: 'master-locations', label: 'Branches & Destinations', icon: 'building-2', defaultRoles: ['admin'] },
                    { id: 'master-users', label: 'User Accounts & Roles', icon: 'users', defaultRoles: ['admin'] },
                    { id: 'system-settings', label: 'Company & System Information', icon: 'settings', defaultRoles: ['admin'] }
                ]
            }
        ];

        function getAllScreenIds() {
            return SYSTEM_MENU_REGISTRY.flatMap(g => g.children.map(c => c.id));
        }

        function buildDefaultPermissionsForRole(role) {
            const perms = {};
            SYSTEM_MENU_REGISTRY.forEach(group => {
                group.children.forEach(sub => {
                    perms[sub.id] = role === 'admin' ? true : sub.defaultRoles.includes(role);
                });
            });
            return perms;
        }

        function resolveUserPermissions(user) {
            const allIds = getAllScreenIds();
            if (!user) return {};
            const base = buildDefaultPermissionsForRole(user.role);
            const custom = user.permissions && typeof user.permissions === 'object' ? user.permissions : {};
            const resolved = {};
            allIds.forEach(id => {
                resolved[id] = custom[id] !== undefined ? Boolean(custom[id]) : Boolean(base[id]);
            });
            return resolved;
        }

        const DEFAULT_SETTINGS = {
            id: 'MAIN_SETTINGS',
            softwareName: 'StockTransfer ERP',
            companyName: 'Enterprise Food & Supply Co.',
            tagline: 'Central Kitchen, Factory & Branch Inventory Transfer System',
            address: 'Head Office & Central Warehouse',
            phone: '',
            email: '',
            taxId: '',
            logoDataUrl: ''
        };

        const CLEAN_DEFAULT_DATA = {
            settings: { ...DEFAULT_SETTINGS },
            branches: [],
            destinations: [],
            categories: [],
            items: [],
            users: [],
            orders: []
        };

        const STORAGE_KEY = 'kty_store_order_secure_v11';
        let state = JSON.parse(JSON.stringify(CLEAN_DEFAULT_DATA));

        async function ensureDefaultAdmin() {
            if (!state.users || state.users.length === 0) {
                const defaultHash = await hashPassword('1234');
                const adminUser = {
                    id: 'USR-01',
                    username: 'admin',
                    passwordHash: defaultHash,
                    fullName: 'System Administrator',
                    role: 'admin',
                    branchId: '',
                    destinationId: '',
                    permissions: buildDefaultPermissionsForRole('admin')
                };
                state.users = [adminUser];
                saveToLocalStorage();
                try {
                    await setDoc(doc(firestoreDb, 'users', adminUser.id), adminUser);
                } catch (e) {}
            }
        }

        function loadFromLocalStorage() {
            const raw = localStorage.getItem(STORAGE_KEY);
            if (raw) {
                try {
                    const parsed = JSON.parse(raw);
                    state = {
                        settings: { ...DEFAULT_SETTINGS, ...(parsed.settings || {}) },
                        branches: parsed.branches || [],
                        destinations: parsed.destinations || [],
                        categories: parsed.categories || [],
                        items: (parsed.items || []).map(it => ({
                            status: 'Active',
                            conversionDirection: 'down',
                            conversionFactor: 1,
                            altUnit: '',
                            ...it
                        })),
                        users: parsed.users || [],
                        orders: parsed.orders || []
                    };
                } catch (e) {}
            }
        }

        function saveToLocalStorage() {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
        }

        async function initHybridDatabase() {
            await ensureFirebaseAuth();
            loadFromLocalStorage();
            const collections = ['branches', 'destinations', 'categories', 'items', 'users', 'orders'];
            try {
                const settingsSnap = await getDocs(collection(firestoreDb, 'settings'));
                if (!settingsSnap.empty) {
                    const sDoc = settingsSnap.docs[0].data();
                    state.settings = { ...DEFAULT_SETTINGS, ...sDoc };
                }
                for (const colName of collections) {
                    const colRef = collection(firestoreDb, colName);
                    const snap = await getDocs(colRef);
                    if (!snap.empty) {
                        state[colName] = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                    }
                }
                state.items = (state.items || []).map(it => ({
                    status: 'Active',
                    conversionDirection: 'down',
                    conversionFactor: 1,
                    altUnit: '',
                    ...it
                }));
                saveToLocalStorage();
            } catch (err) {
                console.warn('Firestore sync warning:', err.message);
            }
            await ensureDefaultAdmin();
            applyCompanyBranding();
            checkExistingSession();
        }

        window.dbSaveRecord = async function(colName, record) {
            const idx = state[colName].findIndex(r => r.id === record.id);
            if (idx >= 0) state[colName][idx] = record;
            else state[colName].push(record);
            saveToLocalStorage();
            try {
                await setDoc(doc(firestoreDb, colName, record.id), record);
            } catch (e) {}
        };

        window.dbDeleteRecord = async function(colName, id) {
            state[colName] = state[colName].filter(r => r.id !== id);
            saveToLocalStorage();
            try {
                await deleteDoc(doc(firestoreDb, colName, id));
            } catch (e) {}
        };

        window.applyCompanyBranding = function() {
            const s = state.settings || DEFAULT_SETTINGS;
            document.title = `${s.softwareName} | ${s.companyName}`;

            document.getElementById('login-company-name').textContent = s.companyName || 'Enterprise Stock Portal';
            document.getElementById('login-software-title').textContent = s.softwareName || 'Stock Transfer ERP';
            const infoParts = [s.tagline, s.address].filter(Boolean);
            document.getElementById('login-company-info').textContent = infoParts.join(' • ');
            const contactParts = [s.phone, s.email].filter(Boolean);
            document.getElementById('login-footer-contact').textContent = contactParts.length > 0 ? contactParts.join(' | ') : 'Authorized Personnel Only';

            const loginLogoBox = document.getElementById('login-logo-container');
            if (s.logoDataUrl) {
                loginLogoBox.className = 'w-24 h-24 bg-white border border-slate-200 rounded-2xl flex items-center justify-center mx-auto mb-4 overflow-hidden shadow-md p-1.5';
                loginLogoBox.innerHTML = `<img src="${s.logoDataUrl}" alt="Company Logo" class="max-w-full max-h-full object-contain">`;
            } else {
                loginLogoBox.className = 'w-20 h-20 bg-slate-100 border-2 border-dashed border-slate-300 text-slate-400 rounded-2xl flex items-center justify-center mx-auto mb-4 overflow-hidden shadow-sm';
                loginLogoBox.innerHTML = `<i data-lucide="building-2" class="w-9 h-9"></i>`;
            }

            document.getElementById('sidebar-software-name').textContent = s.softwareName || 'StockTransfer';
            document.getElementById('sidebar-company-name').textContent = s.companyName || 'Supply Chain ERP';
            const sidebarLogoBox = document.getElementById('sidebar-logo-box');
            if (s.logoDataUrl) {
                sidebarLogoBox.className = 'w-10 h-10 bg-white rounded-xl flex items-center justify-center shadow-md shrink-0 overflow-hidden p-1';
                sidebarLogoBox.innerHTML = `<img src="${s.logoDataUrl}" alt="Logo" class="max-w-full max-h-full object-contain">`;
            } else {
                sidebarLogoBox.className = 'w-10 h-10 bg-blue-600 text-white rounded-xl flex items-center justify-center shadow-md shrink-0 overflow-hidden';
                sidebarLogoBox.innerHTML = `<i data-lucide="boxes" class="w-5 h-5"></i>`;
            }
            lucide.createIcons();
        };

        window.clearCollection = async function(colName) {
            if (currentUser?.role !== 'admin') return showToast('Permission denied: Admin only.', 'error');
            openModal({
                title: `Clear All ${colName.toUpperCase()}`,
                bodyHtml: `<p>Are you sure you want to delete <strong>all</strong> records in <strong>${escapeHtml(colName)}</strong>? This cannot be undone.</p>`,
                confirmText: 'Clear All',
                onConfirm: async () => {
                    const ids = state[colName].map(r => r.id);
                    state[colName] = [];
                    saveToLocalStorage();
                    closeModal();
                    renderCurrentRoute();
                    showToast(`All ${colName} cleared!`, 'info');
                    for (const id of ids) {
                        try { await deleteDoc(doc(firestoreDb, colName, id)); } catch (e) {}
                    }
                }
            });
        };

        window.showToast = function(message, type = 'success') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            const styles = {
                success: 'bg-emerald-600 text-white',
                error: 'bg-rose-600 text-white',
                info: 'bg-slate-800 text-white',
                warning: 'bg-amber-600 text-white'
            };
            toast.className = `pointer-events-auto flex items-center gap-2 px-4 py-3 rounded-xl shadow-xl text-sm font-medium transition-all ${styles[type] || styles.info}`;
            toast.innerHTML = `<span>${escapeHtml(message)}</span>`;
            container.appendChild(toast);
            setTimeout(() => toast.remove(), 3500);
        };

        window.openModal = function({ title, bodyHtml, confirmText = 'Save', onConfirm = null }) {
            document.getElementById('modal-title').textContent = title;
            document.getElementById('modal-body').innerHTML = bodyHtml;
            document.getElementById('modal-footer').classList.remove('hidden');
            document.getElementById('modal-confirm-btn').textContent = confirmText;
            window.activeModalConfirm = onConfirm;
            document.getElementById('custom-modal').classList.remove('hidden');
            lucide.createIcons();
        };

        window.closeModal = function() {
            document.getElementById('custom-modal').classList.add('hidden');
            window.activeModalConfirm = null;
        };

        document.getElementById('modal-confirm-btn').addEventListener('click', async () => {
            if (window.activeModalConfirm) await window.activeModalConfirm();
        });

        let currentUser = null;
        let currentRoute = 'order-form';
        let failedAttempts = 0;
        let lockoutUntil = 0;
        let inactivityTimer = null;

        let expandedGroups = {
            'order-transaction': true,
            'app-settings': true
        };

        // 15 Minutes Inactivity Timeout
        const INACTIVITY_TIMEOUT_MS = 15 * 60 * 1000;

        function resetInactivityTimer() {
            if (!currentUser) return;
            const expiryTime = Date.now() + INACTIVITY_TIMEOUT_MS;
            sessionStorage.setItem('kty_session_expiry', expiryTime);

            clearTimeout(inactivityTimer);
            inactivityTimer = setTimeout(() => {
                logout();
                showToast('Session logged out due to 15 minutes of inactivity.', 'warning');
            }, INACTIVITY_TIMEOUT_MS);
        }

        ['click', 'keydown', 'mousemove', 'scroll', 'touchstart'].forEach(evt => {
            window.addEventListener(evt, resetInactivityTimer, { passive: true });
        });

        function pickInitialRouteForUser(user) {
            const perms = resolveUserPermissions(user);
            const preferred = user.role === 'factory_warehouse' ? 'order-matrix' : 'order-form';
            if (perms[preferred]) return preferred;
            const firstAllowed = getAllScreenIds().find(id => perms[id]);
            return firstAllowed || 'my-orders';
        }

        function checkExistingSession() {
            const savedUser = sessionStorage.getItem('kty_active_user');
            const expiry = sessionStorage.getItem('kty_session_expiry');

            if (savedUser && expiry) {
                if (Date.now() < parseInt(expiry)) {
                    try {
                        currentUser = JSON.parse(savedUser);
                        document.getElementById('login-view').classList.add('hidden');
                        document.getElementById('app-view').classList.remove('hidden');

                        document.getElementById('user-display-name').textContent = currentUser.fullName;
                        document.getElementById('user-display-role').textContent = currentUser.role.replace('_', ' ');
                        document.getElementById('header-role-label').textContent = `${currentUser.fullName} (${currentUser.role.toUpperCase()})`;

                        currentRoute = pickInitialRouteForUser(currentUser);

                        resetInactivityTimer();
                        renderSidebarMenu();
                        renderCurrentRoute();
                        return;
                    } catch (e) {}
                }
            }
            logout();
        }

        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const errBox = document.getElementById('login-error-box');
            const errMsg = document.getElementById('login-error-msg');
            errBox.classList.add('hidden');

            if (Date.now() < lockoutUntil) {
                const secs = Math.ceil((lockoutUntil - Date.now()) / 1000);
                errMsg.textContent = `Too many failed attempts. Try again in ${secs}s.`;
                errBox.classList.remove('hidden');
                return;
            }

            const uname = document.getElementById('login-username').value.trim().toLowerCase();
            const pwd = document.getElementById('login-password').value;

            if (!uname || !pwd) {
                errMsg.textContent = 'Please enter both username and password.';
                errBox.classList.remove('hidden');
                return;
            }

            const inputHash = await hashPassword(pwd);
            const matchedUser = state.users.find(u => {
                if (u.username.toLowerCase() !== uname) return false;
                if (u.passwordHash) return u.passwordHash === inputHash;
                return u.password === pwd;
            });

            if (!matchedUser) {
                failedAttempts++;
                if (failedAttempts >= 5) {
                    lockoutUntil = Date.now() + 60000;
                    failedAttempts = 0;
                    errMsg.textContent = 'Account temporarily locked for 60 seconds due to multiple failed logins.';
                } else {
                    errMsg.textContent = 'Invalid username or password. Access denied.';
                }
                errBox.classList.remove('hidden');
                document.getElementById('login-password').value = '';
                return;
            }

            failedAttempts = 0;
            currentUser = { ...matchedUser };

            sessionStorage.setItem('kty_active_user', JSON.stringify(currentUser));
            resetInactivityTimer();

            document.getElementById('login-username').value = '';
            document.getElementById('login-password').value = '';

            document.getElementById('login-view').classList.add('hidden');
            document.getElementById('app-view').classList.remove('hidden');

            document.getElementById('user-display-name').textContent = currentUser.fullName;
            document.getElementById('user-display-role').textContent = currentUser.role.replace('_', ' ');
            document.getElementById('header-role-label').textContent = `${currentUser.fullName} (${currentUser.role.toUpperCase()})`;

            currentRoute = pickInitialRouteForUser(currentUser);

            renderSidebarMenu();
            renderCurrentRoute();
            showToast(`Welcome, ${currentUser.fullName}!`, 'success');
        });

        window.logout = function() {
            currentUser = null;
            clearTimeout(inactivityTimer);
            sessionStorage.removeItem('kty_active_user');
            sessionStorage.removeItem('kty_session_expiry');

            document.getElementById('login-username').value = '';
            document.getElementById('login-password').value = '';
            document.getElementById('app-view').classList.add('hidden');
            document.getElementById('login-view').classList.remove('hidden');
        };

        function getMenuGroups() {
            if (!currentUser) return [];
            const perms = resolveUserPermissions(currentUser);

            return SYSTEM_MENU_REGISTRY
                .map(g => ({
                    ...g,
                    children: g.children.filter(c => Boolean(perms[c.id]))
                }))
                .filter(g => g.children.length > 0);
        }

        function getAllowedRoutes() {
            return getMenuGroups().flatMap(g => g.children);
        }

        window.toggleMenuGroup = function(groupId) {
            expandedGroups[groupId] = !expandedGroups[groupId];
            renderSidebarMenu();
        };

        function renderSidebarMenu() {
            const nav = document.getElementById('sidebar-nav');
            const groups = getMenuGroups();

            nav.innerHTML = groups.map(group => {
                const isOpen = expandedGroups[group.id] !== false;
                const hasActiveChild = group.children.some(c => c.id === currentRoute);

                return `
                    <div class="rounded-xl bg-slate-800/40 border border-slate-800 overflow-hidden">
                        <button onclick="toggleMenuGroup('${group.id}')" class="w-full flex items-center justify-between px-3.5 py-2.5 text-xs font-extrabold uppercase tracking-wider transition ${hasActiveChild ? 'text-blue-400 bg-slate-800/80' : 'text-slate-400 hover:text-white hover:bg-slate-800/60'}">
                            <span class="flex items-center gap-2.5">
                                <i data-lucide="${group.icon}" class="w-4 h-4 shrink-0"></i>
                                <span>${group.label}</span>
                            </span>
                            <i data-lucide="chevron-down" class="w-3.5 h-3.5 transition-transform duration-200 ${isOpen ? 'rotate-0' : '-rotate-90'}"></i>
                        </button>
                        <div class="${isOpen ? 'block' : 'hidden'} px-2 pb-2 pt-1 space-y-1">
                            ${group.children.map(item => `
                                <button onclick="navigateTo('${item.id}')" class="w-full flex items-center gap-2.5 px-3 py-2.5 rounded-lg text-xs font-semibold transition ${currentRoute === item.id ? 'bg-blue-600 text-white shadow-md shadow-blue-600/30' : 'text-slate-300 hover:bg-slate-800 hover:text-white'}">
                                    <i data-lucide="${item.icon}" class="w-4 h-4 shrink-0"></i>
                                    <span class="truncate">${item.label}</span>
                                </button>
                            `).join('')}
                        </div>
                    </div>
                `;
            }).join('');
            lucide.createIcons();
        }

        window.navigateTo = function(routeId) {
            const allowed = getAllowedRoutes().map(r => r.id);
            if (!allowed.includes(routeId)) {
                return showToast('Access Denied: You do not have permission for this module.', 'error');
            }
            currentRoute = routeId;
            renderSidebarMenu();
            renderCurrentRoute();
        };

        function renderCurrentRoute() {
            const container = document.getElementById('main-content');
            const titles = {
                'order-form': ['Stock Transfer Order Form', 'Order Transaction • Select items or whole categories to submit stock requests'],
                'my-orders': ['Branch Order History', 'Order Transaction • View and track submitted stock transfer requests'],
                'order-matrix': ['Consolidated Order Matrix', 'Order Transaction • Review selected & submitted items by date, edit inline, and execute challans'],
                'delivery-challan': ['Delivery Challan & Print', 'Order Transaction • Select branches to generate and print delivery challans sequentially'],
                'master-items': ['Categories & Item Master', 'App Settings • Manage categories, active/inactive status, multi-unit conversions, and items'],
                'master-locations': ['Branches & Destinations', 'App Settings • Configure restaurant branches and supply warehouses'],
                'master-users': ['User Accounts & Roles', 'App Settings • Dynamic menu/submenu permissions and user role management'],
                'system-settings': ['Company & System Information', 'App Settings • Configure software branding, company details, and logo']
            };
            const [t, sub] = titles[currentRoute] || ['Dashboard', ''];
            document.getElementById('page-title').textContent = t;
            document.getElementById('page-subtitle').textContent = sub;

            if (currentRoute === 'order-form') renderOrderFormView(container);
            else if (currentRoute === 'my-orders') renderBranchHistoryView(container);
            else if (currentRoute === 'order-matrix') renderOrderMatrixView(container);
            else if (currentRoute === 'delivery-challan') renderDeliveryChallanView(container);
            else if (currentRoute === 'master-items') renderMasterItemsView(container);
            else if (currentRoute === 'master-locations') renderMasterLocationsView(container);
            else if (currentRoute === 'master-users') renderMasterUsersView(container);
            else if (currentRoute === 'system-settings') renderSystemSettingsView(container);
            lucide.createIcons();
        }

        function formatUnitConversion(item) {
            const base = item.unit || 'UNIT';
            const alt = (item.altUnit || '').trim();
            const factor = Number(item.conversionFactor) || 0;
            if (!alt || factor <= 0) return '-';
            if (item.conversionDirection === 'up') {
                return `${factor} ${base} = 1 ${alt}`;
            }
            return `1 ${base} = ${factor} ${alt}`;
        }

        // ==================== 1. STOCK TRANSFER ORDER FORM ====================
        let orderFormState = {
            isActive: false,
            branchId: '',
            destinationId: '',
            requestDate: TODAY,
            deliveryDate: TOMORROW,
            catIdx: 0,
            searchQuery: '',
            quantities: {},
            selectedItems: {}
        };

        function isItemActive(item) {
            return (item.status || 'Active') === 'Active';
        }

        function renderOrderFormView(container) {
            if (currentUser?.role === 'branch' && currentUser.branchId) {
                orderFormState.branchId = currentUser.branchId;
            }
            const cats = state.categories;
            const activeCat = cats[orderFormState.catIdx] || cats[0];
            const catItems = activeCat
                ? state.items.filter(i => i.categoryId === activeCat.id && isItemActive(i))
                : [];

            const q = (orderFormState.searchQuery || '').trim().toLowerCase();
            const items = q
                ? catItems.filter(it =>
                    String(it.name || '').toLowerCase().includes(q) ||
                    String(it.code || '').toLowerCase().includes(q) ||
                    String(it.unit || '').toLowerCase().includes(q) ||
                    String(it.altUnit || '').toLowerCase().includes(q)
                )
                : catItems;

            const allVisibleChecked = items.length > 0 && items.every(it => Boolean(orderFormState.selectedItems[it.id]));

            container.innerHTML = `
                <div class="max-w-5xl mx-auto space-y-6">
                    <div class="bg-white rounded-2xl p-6 shadow-sm border border-slate-200">
                        <div class="flex flex-wrap items-center justify-between gap-3 pb-4 mb-6 border-b border-slate-100">
                            <span class="px-3 py-1 rounded-full text-xs font-bold ${orderFormState.isActive ? 'bg-emerald-50 text-emerald-700' : 'bg-slate-100 text-slate-600'}">
                                ${orderFormState.isActive ? '● Form Active (Ready)' : '○ Locked (Click Add)'}
                            </span>
                            <div class="flex flex-wrap gap-2">
                                <button onclick="activateOrderForm()" class="px-4 py-2 bg-emerald-600 hover:bg-emerald-700 text-white font-semibold rounded-xl text-sm flex items-center gap-1.5 shadow-sm transition">
                                    <i data-lucide="plus-circle" class="w-4 h-4"></i> Add
                                </button>
                                <button onclick="cancelOrderForm()" class="px-4 py-2 bg-slate-200 hover:bg-slate-300 text-slate-700 font-semibold rounded-xl text-sm flex items-center gap-1.5 transition">
                                    <i data-lucide="x-circle" class="w-4 h-4"></i> Cancel
                                </button>
                                <button onclick="saveOrderForm()" class="px-5 py-2 bg-blue-600 hover:bg-blue-700 text-white font-semibold rounded-xl text-sm shadow-md flex items-center gap-1.5 transition">
                                    <i data-lucide="send" class="w-4 h-4"></i> Save & Submit
                                </button>
                            </div>
                        </div>
                        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
                            <div>
                                <label class="block text-xs font-bold uppercase text-slate-500 mb-1">Branch</label>
                                <select id="f-branch" ${currentUser?.role === 'branch' && currentUser.branchId ? 'disabled' : ''} class="w-full px-3 py-2 bg-slate-50 border rounded-xl text-sm font-bold">
                                    <option value="">Select Branch...</option>
                                    ${state.branches.map(b => `<option value="${b.id}" ${b.id === orderFormState.branchId ? 'selected' : ''}>${escapeHtml(b.name)}</option>`).join('')}
                                </select>
                            </div>
                            <div>
                                <label class="block text-xs font-bold uppercase text-slate-500 mb-1">To Destination</label>
                                <select id="f-dest" class="w-full px-3 py-2 bg-slate-50 border rounded-xl text-sm font-bold">
                                    <option value="">Select Destination...</option>
                                    ${state.destinations.map(d => `<option value="${d.id}" ${d.id === orderFormState.destinationId ? 'selected' : ''}>${escapeHtml(d.name)}</option>`).join('')}
                                </select>
                            </div>
                            <div>
                                <label class="block text-xs font-bold uppercase text-slate-500 mb-1">Request Date</label>
                                <input type="date" id="f-req" value="${orderFormState.requestDate}" class="w-full px-3 py-2 bg-slate-50 border rounded-xl text-sm font-bold">
                            </div>
                            <div>
                                <label class="block text-xs font-bold uppercase text-slate-500 mb-1">Delivery Date</label>
                                <input type="date" id="f-del" value="${orderFormState.deliveryDate}" class="w-full px-3 py-2 bg-slate-50 border rounded-xl text-sm font-bold">
                            </div>
                        </div>
                    </div>

                    <div class="bg-white rounded-2xl p-6 shadow-sm border border-slate-200 space-y-4">
                        ${cats.length === 0 ? `
                            <div class="p-8 text-center text-slate-500 bg-slate-50 rounded-xl">
                                <p class="font-bold">No categories or items found.</p>
                                <p class="text-xs mt-1">Please add categories and items under App Settings &gt; Categories &amp; Item Master first.</p>
                            </div>
                        ` : `
                            <div class="flex flex-wrap items-center justify-between gap-3 bg-slate-50 p-3 rounded-xl">
                                <div class="flex flex-wrap items-center gap-3">
                                    <select id="f-cat" class="px-4 py-2 bg-white border rounded-xl text-sm font-bold">
                                        ${cats.map((c, i) => `<option value="${i}" ${i === orderFormState.catIdx ? 'selected' : ''}>${escapeHtml(c.name)}</option>`).join('')}
                                    </select>
                                    <label class="inline-flex items-center gap-2 px-3 py-1.5 bg-white border border-slate-200 rounded-xl text-xs font-bold text-slate-700 cursor-pointer select-none">
                                        <input type="checkbox" id="f-cat-select-all" ${!orderFormState.isActive ? 'disabled' : ''} ${allVisibleChecked ? 'checked' : ''} onchange="toggleCategoryOrderSelection(this.checked)" class="rounded text-blue-600 w-4 h-4">
                                        <span>Select Whole Category</span>
                                    </label>
                                </div>
                                <div class="flex gap-2">
                                    <button onclick="changeCat(-1)" class="px-3 py-1.5 bg-white border hover:bg-slate-100 rounded-lg text-sm font-bold flex items-center gap-1 transition">
                                        <i data-lucide="chevron-left" class="w-4 h-4"></i> Previous
                                    </button>
                                    <button onclick="changeCat(1)" class="px-3 py-1.5 bg-white border hover:bg-slate-100 rounded-lg text-sm font-bold flex items-center gap-1 transition">
                                        Next <i data-lucide="chevron-right" class="w-4 h-4"></i>
                                    </button>
                                </div>
                            </div>

                            <div class="relative">
                                <i data-lucide="search" class="w-4 h-4 text-slate-400 absolute left-3.5 top-3"></i>
                                <input type="text" id="f-item-search" value="${escapeHtml(orderFormState.searchQuery)}" placeholder="Search active items by name, code, unit, or conversion..." class="w-full pl-10 pr-24 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm font-medium focus:ring-2 focus:ring-blue-600 focus:bg-white outline-none transition">
                                ${orderFormState.searchQuery ? `
                                    <button type="button" onclick="clearOrderSearch()" class="absolute right-2.5 top-2 px-2.5 py-1 text-xs font-bold text-slate-500 hover:text-slate-800 bg-slate-200/70 hover:bg-slate-200 rounded-lg transition">
                                        Clear
                                    </button>
                                ` : ''}
                            </div>

                            <div class="overflow-x-auto border rounded-xl">
                                <table class="w-full text-left">
                                    <thead class="bg-slate-100 text-xs font-bold text-slate-600 uppercase">
                                        <tr>
                                            <th class="py-3 px-3 text-center w-12">
                                                <input type="checkbox" ${!orderFormState.isActive ? 'disabled' : ''} ${allVisibleChecked ? 'checked' : ''} onchange="toggleCategoryOrderSelection(this.checked)" class="rounded text-blue-600 w-4 h-4" title="Select all items in view">
                                            </th>
                                            <th class="py-3 px-3">Sr</th>
                                            <th class="py-3 px-3">Code</th>
                                            <th class="py-3 px-4">Item Name</th>
                                            <th class="py-3 px-3">Unit</th>
                                            <th class="py-3 px-3">Conversion</th>
                                            <th class="py-3 px-4 text-right">Quantity</th>
                                        </tr>
                                    </thead>
                                    <tbody class="divide-y text-sm">
                                        ${items.length === 0 ? `
                                            <tr><td colspan="7" class="p-8 text-center text-slate-400 font-medium">No active items found${q ? ` for "<strong>${escapeHtml(orderFormState.searchQuery)}</strong>"` : ''}.</td></tr>
                                        ` : items.map((it, idx) => {
                                            const checked = Boolean(orderFormState.selectedItems[it.id]);
                                            const convText = formatUnitConversion(it);
                                            return `
                                                <tr class="${checked ? 'bg-blue-50/40' : ''}">
                                                    <td class="py-3 px-3 text-center">
                                                        <input type="checkbox" ${!orderFormState.isActive ? 'disabled' : ''} ${checked ? 'checked' : ''} onchange="toggleOrderItemCheck('${it.id}', this.checked)" class="rounded text-blue-600 w-4 h-4">
                                                    </td>
                                                    <td class="py-3 px-3 text-slate-500 font-mono">${idx + 1}</td>
                                                    <td class="py-3 px-3 font-mono font-bold">${escapeHtml(it.code)}</td>
                                                    <td class="py-3 px-4 font-semibold">${escapeHtml(it.name)}</td>
                                                    <td class="py-3 px-3"><span class="px-2 py-0.5 bg-slate-100 text-xs font-bold rounded">${escapeHtml(it.unit)}</span></td>
                                                    <td class="py-3 px-3 text-xs font-medium text-indigo-700">${escapeHtml(convText)}</td>
                                                    <td class="py-3 px-4 text-right">
                                                        <input type="number" min="0" step="any" data-item="${it.id}" ${!orderFormState.isActive ? 'disabled' : ''} value="${orderFormState.quantities[it.id] || ''}" oninput="updateQty('${it.id}', this.value)" class="w-28 px-3 py-1.5 text-right border rounded-xl font-bold">
                                                    </td>
                                                </tr>
                                            `;
                                        }).join('')}
                                    </tbody>
                                </table>
                            </div>
                        `}
                    </div>
                </div>
            `;

            if (document.getElementById('f-branch')) document.getElementById('f-branch').onchange = e => orderFormState.branchId = e.target.value;
            if (document.getElementById('f-dest')) document.getElementById('f-dest').onchange = e => orderFormState.destinationId = e.target.value;
            if (document.getElementById('f-req')) document.getElementById('f-req').onchange = e => orderFormState.requestDate = e.target.value;
            if (document.getElementById('f-del')) document.getElementById('f-del').onchange = e => orderFormState.deliveryDate = e.target.value;
            if (document.getElementById('f-cat')) document.getElementById('f-cat').onchange = e => {
                orderFormState.catIdx = parseInt(e.target.value);
                renderOrderFormView(container);
            };
            const searchInput = document.getElementById('f-item-search');
            if (searchInput) {
                searchInput.addEventListener('input', e => {
                    orderFormState.searchQuery = e.target.value;
                    renderOrderFormView(container);
                    const nextSearch = document.getElementById('f-item-search');
                    if (nextSearch) {
                        nextSearch.focus();
                        const len = nextSearch.value.length;
                        nextSearch.setSelectionRange(len, len);
                    }
                });
            }
        }

        window.toggleOrderItemCheck = function(itemId, checked) {
            if (checked) orderFormState.selectedItems[itemId] = true;
            else delete orderFormState.selectedItems[itemId];
            renderOrderFormView(document.getElementById('main-content'));
        };

        window.toggleCategoryOrderSelection = function(checked) {
            const cats = state.categories;
            const activeCat = cats[orderFormState.catIdx] || cats[0];
            if (!activeCat) return;
            const catItems = state.items.filter(i => i.categoryId === activeCat.id && isItemActive(i));
            const q = (orderFormState.searchQuery || '').trim().toLowerCase();
            const targetItems = q
                ? catItems.filter(it =>
                    String(it.name || '').toLowerCase().includes(q) ||
                    String(it.code || '').toLowerCase().includes(q) ||
                    String(it.unit || '').toLowerCase().includes(q)
                )
                : catItems;

            targetItems.forEach(it => {
                if (checked) orderFormState.selectedItems[it.id] = true;
                else delete orderFormState.selectedItems[it.id];
            });
            renderOrderFormView(document.getElementById('main-content'));
        };

        window.clearOrderSearch = function() {
            orderFormState.searchQuery = '';
            renderOrderFormView(document.getElementById('main-content'));
        };

        window.activateOrderForm = function() {
            orderFormState.isActive = true;
            renderOrderFormView(document.getElementById('main-content'));
            showToast('Form activated for new entry!', 'success');
        };

        window.cancelOrderForm = function() {
            orderFormState.isActive = false;
            orderFormState.quantities = {};
            orderFormState.selectedItems = {};
            orderFormState.searchQuery = '';
            renderOrderFormView(document.getElementById('main-content'));
            showToast('Order entry cancelled and locked.', 'info');
        };

        window.updateQty = function(itemId, val) {
            const num = parseFloat(val);
            if (num > 0) {
                orderFormState.quantities[itemId] = num;
                orderFormState.selectedItems[itemId] = true;
            } else {
                delete orderFormState.quantities[itemId];
            }
        };

        window.changeCat = function(dir) {
            orderFormState.catIdx = Math.max(0, Math.min(state.categories.length - 1, orderFormState.catIdx + dir));
            renderOrderFormView(document.getElementById('main-content'));
        };

        window.saveOrderForm = async function() {
            if (!orderFormState.branchId) return showToast('Please select a branch!', 'error');
            if (!orderFormState.destinationId) return showToast('Please select a destination!', 'error');

            // Only submit checked items that have a positive quantity
            const submittedQuantities = {};
            const submittedItemIds = [];
            Object.entries(orderFormState.quantities || {}).forEach(([itemId, qty]) => {
                const it = state.items.find(x => x.id === itemId);
                if (orderFormState.selectedItems[itemId] && Number(qty) > 0 && it && isItemActive(it)) {
                    submittedQuantities[itemId] = Number(qty);
                    submittedItemIds.push(itemId);
                }
            });

            if (submittedItemIds.length === 0) {
                return showToast('Please check item(s) and enter quantities greater than 0 to submit!', 'error');
            }

            const branch = state.branches.find(b => b.id === orderFormState.branchId);
            const dest = state.destinations.find(d => d.id === orderFormState.destinationId);

            let existingOrder = state.orders.find(o => o.branchId === orderFormState.branchId && o.deliveryDate === orderFormState.deliveryDate && o.destinationId === orderFormState.destinationId);

            if (existingOrder) {
                existingOrder.quantities = { ...(existingOrder.quantities || {}), ...submittedQuantities };
                existingOrder.selectedItemIds = Array.from(new Set([...(existingOrder.selectedItemIds || []), ...submittedItemIds]));
                existingOrder.updatedAt = new Date().toISOString();
                existingOrder.status = 'Submitted';
                await dbSaveRecord('orders', existingOrder);
            } else {
                const record = {
                    id: 'ORD-' + Date.now(),
                    branchId: orderFormState.branchId,
                    branchName: branch ? branch.name : 'Branch',
                    destinationId: orderFormState.destinationId,
                    destinationName: dest ? dest.name : 'Destination',
                    requestDate: orderFormState.requestDate,
                    deliveryDate: orderFormState.deliveryDate,
                    status: 'Submitted',
                    quantities: submittedQuantities,
                    selectedItemIds: submittedItemIds,

        window.startMatrixCellEdit = function(td) {
            if (td.classList.contains('excel-cell-editing')) return;

            const currentVal = parseFloat(td.textContent.trim()) || 0;
            const itemId = td.dataset.itemId;
            const branchId = td.dataset.branchId;
            const rowIdx = parseInt(td.dataset.row);
            const colIdx = parseInt(td.dataset.col);

            td.classList.add('excel-cell-editing');
            td.innerHTML = `<input type="number" min="0" step="any" value="${currentVal}" class="w-full h-full py-2 px-2 text-center font-bold text-blue-700 bg-white outline-none" />`;

            const input = td.querySelector('input');
            input.focus();
            input.select();

            let committed = false;

            const commitChange = async (moveNext = false, reverse = false) => {
                if (committed) return;
                committed = true;

                const newVal = Math.max(0, parseFloat(input.value) || 0);
                td.classList.remove('excel-cell-editing');
                td.textContent = newVal;
                if (newVal > 0) {
                    td.classList.remove('text-slate-400');
                    td.classList.add('text-slate-900', 'bg-emerald-50/40');
                } else {
                    td.classList.remove('text-slate-900', 'bg-emerald-50/40');
                    td.classList.add('text-slate-400');
                }

                if (newVal !== currentVal) {
                    await updateBranchOrderFromMatrix(branchId, itemId, newVal);
                }

                const rowCells = document.querySelectorAll(`td[data-item-id="${itemId}"]`);
                let sum = 0;
                rowCells.forEach(c => sum += (parseFloat(c.textContent.trim()) || 0));
                const totalCell = document.getElementById(`matrix-row-total-${itemId}`);
                if (totalCell) totalCell.textContent = sum;

                if (moveNext) {
                    const totalCols = document.querySelectorAll(`th[data-matrix-branch="true"]`).length || 1;
                    let nextRow = rowIdx;
                    let nextCol = reverse ? colIdx - 1 : colIdx + 1;

                    if (nextCol >= totalCols) {
                        nextCol = 0;
                        nextRow = rowIdx + 1;
                    } else if (nextCol < 0) {
                        nextCol = totalCols - 1;
                        nextRow = rowIdx - 1;
                    }

                    const nextCell = document.querySelector(`td[data-row="${nextRow}"][data-col="${nextCol}"]`);
                    if (nextCell) {
                        startMatrixCellEdit(nextCell);
                    }
                }
            };

            input.addEventListener('keydown', async (e) => {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    await commitChange(false);
                } else if (e.key === 'Tab') {
                    e.preventDefault();
                    await commitChange(true, e.shiftKey);
                } else if (e.key === 'Escape') {
                    committed = true;
                    td.classList.remove('excel-cell-editing');
                    td.textContent = currentVal;
                }
            });

            input.addEventListener('blur', async () => {
                await commitChange(false);
            });
        };

        async function updateBranchOrderFromMatrix(branchId, itemId, newQty) {
            const targetDate = matrixFilterDate || TODAY;
            const branch = state.branches.find(b => b.id === branchId);
            const destId = (currentUser?.role === 'factory_warehouse' && currentUser.destinationId)
                ? currentUser.destinationId
                : (state.destinations[0]?.id || 'DST-01');
            const dest = state.destinations.find(d => d.id === destId);

            const matchingOrders = state.orders.filter(o => o.branchId === branchId && o.deliveryDate === targetDate);

            if (matchingOrders.length > 0) {
                const primaryOrder = matchingOrders[0];
                if (!primaryOrder.quantities) primaryOrder.quantities = {};
                if (!Array.isArray(primaryOrder.selectedItemIds)) primaryOrder.selectedItemIds = [];

                if (newQty > 0) {
                    primaryOrder.quantities[itemId] = newQty;
                    if (!primaryOrder.selectedItemIds.includes(itemId)) primaryOrder.selectedItemIds.push(itemId);
                } else {
                    delete primaryOrder.quantities[itemId];
                    primaryOrder.selectedItemIds = primaryOrder.selectedItemIds.filter(id => id !== itemId);
                }
                primaryOrder.updatedAt = new Date().toISOString();
                await dbSaveRecord('orders', primaryOrder);

                for (let i = 1; i < matchingOrders.length; i++) {
                    if (matchingOrders[i].quantities && matchingOrders[i].quantities[itemId] !== undefined) {
                        delete matchingOrders[i].quantities[itemId];
                        await dbSaveRecord('orders', matchingOrders[i]);
                    }
                }
            } else if (newQty > 0) {
                const newOrder = {
                    id: 'ORD-' + Date.now(),
                    branchId: branchId,
                    branchName: branch ? branch.name : 'Branch',
                    destinationId: destId,
                    destinationName: dest ? dest.name : 'Central Supply',
                    requestDate: TODAY,
                    deliveryDate: targetDate,
                    status: 'Submitted',
                    quantities: { [itemId]: newQty },
                    selectedItemIds: [itemId],
                    updatedAt: new Date().toISOString()
                };
                await dbSaveRecord('orders', newOrder);
            }

            showToast(`Updated ${branch?.name || 'Branch'} quantity to ${newQty} & synced order.`, 'success');
        }

        window.deleteSelectedBranches = async function() {
            const checked = document.querySelectorAll('.branch-checkbox:checked');
            if (checked.length === 0) return showToast('Please select at least one branch!', 'warning');
            const ids = Array.from(checked).map(cb => cb.value);

            openModal({
                title: 'Confirm Bulk Deletion',
                bodyHtml: `<p>Delete <strong>${ids.length}</strong> selected branch(es)?</p>`,
                confirmText: 'Delete Selected',
                onConfirm: async () => {
                    for (const id of ids) {
                        state.branches = state.branches.filter(b => b.id !== id);
                        try { await deleteDoc(doc(firestoreDb, 'branches', id)); } catch (e) {}
                    }
                    saveToLocalStorage();
                    closeModal();
                    renderCurrentRoute();
                    showToast(`Deleted ${ids.length} branch(es) successfully!`, 'success');
                }
            });
        };

                return `

            const file = event.target.files[0];
            if (!file) return;
            if (file.size > 800 * 1024) {
                return showToast('Logo file is too large (max 800KB). Please compress it first.', 'error');
            }
            const reader = new FileReader();
            reader.onload = function(e) {
                state.settings.logoDataUrl = e.target.result;
                renderSystemSettingsView(document.getElementById('main-content'));
                lucide.createIcons();
                showToast('Logo loaded! Click "Save Settings" to apply.', 'info');
            };
            reader.readAsDataURL(file);
        };

        window.removeCompanyLogo = function() {
            state.settings.logoDataUrl = '';
            renderSystemSettingsView(document.getElementById('main-content'));
            lucide.createIcons();
        };

        window.saveSystemSettings = async function() {
            if (currentUser?.role !== 'admin') {
                return showToast('Permission denied: Administrator access required.', 'error');
            }

            state.settings = {
                id: 'MAIN_SETTINGS',
                softwareName: document.getElementById('set-software-name').value.trim() || 'StockTransfer ERP',
                companyName: document.getElementById('set-company-name').value.trim() || 'Company Name',
                tagline: document.getElementById('set-tagline').value.trim(),
                address: document.getElementById('set-address').value.trim(),
                phone: document.getElementById('set-phone').value.trim(),
                email: document.getElementById('set-email').value.trim(),
                taxId: document.getElementById('set-tax').value.trim(),
                logoDataUrl: state.settings.logoDataUrl || ''
            };
            saveToLocalStorage();
            try {
                await setDoc(doc(firestoreDb, 'settings', 'MAIN_SETTINGS'), state.settings);
            } catch (e) {}
            applyCompanyBranding();
            showToast('Company & software information saved successfully!', 'success');
        };

        window.deleteRecord = async function(colName, id) {
            openModal({
                title: 'Confirm Deletion',
                bodyHtml: '<p>Are you sure you want to delete this record?</p>',
                confirmText: 'Delete',
                onConfirm: async () => {
                    await dbDeleteRecord(colName, id);
                    closeModal();
                    renderCurrentRoute();
                    showToast('Record deleted successfully.', 'info');
                }
            });
        };

        // ==================== SMART EXCEL IMPORT ====================
        function isHeaderRow(cells) {
            const joined = cells.map(c => String(c || '').trim().toLowerCase()).join('|');
            return (
                joined.includes('item name') ||
                joined.includes('item code') ||
                joined.includes('category name') ||
                joined.includes('branch name') ||
                joined.includes('destination name') ||
                /^(sr|s\.no|sl|no|id|#)\|/.test(joined) ||
                /\|(code|name|unit|category|address|type)(\||$)/.test(joined)
            );
        }

        function isSerialNumber(val) {
            if (typeof val === 'number') return true;
            const str = String(val || '').trim();
            return /^\d+$/.test(str);
        }

        window.importExcelData = async function(event, colName) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = async function(e) {
                try {
                    const data = new Uint8Array(e.target.result);
                    const workbook = XLSX.read(data, { type: 'array' });
                    const firstSheet = workbook.Sheets[workbook.SheetNames[0]];
                    const rows = XLSX.utils.sheet_to_json(firstSheet, { header: 1, defval: '' });

                    let count = 0;
                    const batchId = Date.now();

                    for (let i = 0; i < rows.length; i++) {
                        const rawRow = rows[i];
                        if (!rawRow || rawRow.every(cell => String(cell).trim() === '')) continue;
                        if (i === 0 && isHeaderRow(rawRow)) continue;

                        const cells = rawRow.map(c => String(c ?? '').trim());

                        if (colName === 'categories') {
                            const catName = (cells.length >= 2 && isSerialNumber(cells[0])) ? cells[1] : cells[0];
                            if (catName) {
                                const rec = { id: 'CAT-' + (batchId + i), name: catName };
                                await dbSaveRecord('categories', rec);
                                count++;
                            }
                        } else if (colName === 'items') {
                            if (!itemMasterFilterCatId) {
                                return showToast('Please select a Target Category first!', 'error');
                            }
                            let offset = (cells.length >= 3 && isSerialNumber(cells[0])) ? 1 : 0;
                            const code = cells[offset] || '';
                            const name = cells[offset + 1] || '';
                            const unit = (cells[offset + 2] || 'PCS').toUpperCase();

                            if (!code && !name) continue;

                            const rec = {
                                id: 'ITM-' + (batchId + i),
                                code: code || ('ITM-' + (i + 1)),
                                name: name || code,
                                unit: unit || 'PCS',
                                altUnit: '',
                                conversionFactor: 1,
                                conversionDirection: 'down',
                                status: 'Active',
                                categoryId: itemMasterFilterCatId
                            };
                            await dbSaveRecord('items', rec);
                            count++;
                        } else if (colName === 'branches') {
                            let offset = (cells.length >= 2 && isSerialNumber(cells[0])) ? 1 : 0;
                            let code = '', name = '', address = '';
                            if (cells.length - offset >= 2) {
                                code = cells[offset];
                                name = cells[offset + 1];
                                address = cells[offset + 2] || '';
                            } else {
                                name = cells[offset];
                                code = name.substring(0, 3).toUpperCase();
                            }
                            if (name) {
                                const rec = {
                                    id: 'BR-' + (batchId + i),
                                    code: code || 'BR',
                                    name: name,
                                    address: address
                                };
                                await dbSaveRecord('branches', rec);
                                count++;
                            }
                        } else if (colName === 'destinations') {
                            let offset = (cells.length >= 2 && isSerialNumber(cells[0])) ? 1 : 0;
                            const name = cells[offset] || '';
                            const type = cells[offset + 1] || 'Warehouse';
                            if (name) {
                                const rec = {
                                    id: 'DST-' + (batchId + i),
                                    name: name,
                                    type: type
                                };
                                await dbSaveRecord('destinations', rec);
                                count++;
                            }
                        }
                    }

                    event.target.value = '';
                    if (count > 0) {
                        if (colName === 'items') {
                            importCompletedForCategory = true;
                        }
                        showToast(`Successfully imported ${count} records into the selected category!`, 'success');
                    } else {
                        showToast('No valid rows found in the Excel file.', 'warning');
                    }
                    renderCurrentRoute();
                } catch (err) {
                    console.error(err);
                    showToast('Failed to parse Excel file.', 'error');
                }
            };
            reader.readAsArrayBuffer(file);
        };

        window.addEventListener('DOMContentLoaded', () => {
            lucide.createIcons();
            initHybridDatabase();
        });
    </script>
</body>
</html>
