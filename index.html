<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restaurant & Warehouse Stock Transfer System</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- SheetJS (xlsx) for Excel Export & Import -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <!-- jsPDF & AutoTable for PDF Export -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.31/jspdf.plugin.autotable.min.js"></script>
    <!-- Google Fonts: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #f1f5f9; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 9999px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

        @media print {
            body * { visibility: hidden !important; }
            #printable-challan, #printable-challan * { visibility: visible !important; }
            #printable-challan {
                position: fixed !important;
                left: 0 !important;
                top: 0 !important;
                width: 100% !important;
                margin: 0 !important;
                padding: 16px !important;
                box-shadow: none !important;
                border: none !important;
                background: white !important;
            }
            .no-print { display: none !important; }
        }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 antialiased selection:bg-blue-600 selection:text-white">

    <!-- Toast Notification Container -->
    <div id="toast-container" class="fixed bottom-5 right-5 z-50 flex flex-col gap-2 pointer-events-none"></div>

    <!-- Custom Modal Container -->
    <div id="custom-modal" class="fixed inset-0 z-50 hidden bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl shadow-2xl max-w-lg w-full overflow-hidden border border-slate-200 animate-fade-in">
            <div class="px-6 py-4 bg-slate-50 border-b border-slate-200 flex items-center justify-between">
                <h3 id="modal-title" class="text-lg font-bold text-slate-900">Modal Title</h3>
                <button onclick="closeModal()" class="p-1.5 text-slate-400 hover:text-slate-700 rounded-lg transition">
                    <i data-lucide="x" class="w-5 h-5"></i>
                </button>
            </div>
            <div id="modal-body" class="p-6 text-sm text-slate-600 max-h-[75vh] overflow-y-auto"></div>
            <div id="modal-footer" class="px-6 py-4 bg-slate-50 border-t border-slate-200 flex justify-end gap-2">
                <button onclick="closeModal()" class="px-4 py-2 bg-white border border-slate-300 hover:bg-slate-100 text-slate-700 font-medium rounded-xl text-sm transition">Cancel</button>
                <button id="modal-confirm-btn" class="px-5 py-2 bg-blue-600 hover:bg-blue-700 text-white font-semibold rounded-xl text-sm shadow-md transition">Confirm</button>
            </div>
        </div>
    </div>

    <!-- ==================== LOGIN SCREEN ==================== -->
    <div id="login-view" class="min-h-screen flex items-center justify-center p-4 bg-gradient-to-br from-slate-900 via-slate-800 to-blue-950">
        <div class="bg-white rounded-3xl shadow-2xl max-w-md w-full p-8 border border-slate-100">
            <div class="text-center mb-8">
                <div class="w-16 h-16 bg-blue-600 text-white rounded-2xl flex items-center justify-center mx-auto mb-4 shadow-lg shadow-blue-600/30">
                    <i data-lucide="warehouse" class="w-8 h-8"></i>
                </div>
                <h1 class="text-2xl font-extrabold text-slate-900 tracking-tight">Stock Transfer Portal</h1>
                <p class="text-sm text-slate-500 mt-1">Restaurant to Factory & Warehouse Order System</p>
            </div>

            <form id="login-form" class="space-y-4">
                <div>
                    <label class="block text-xs font-bold uppercase tracking-wider text-slate-500 mb-1.5">Username</label>
                    <div class="relative">
                        <i data-lucide="user" class="w-4 h-4 text-slate-400 absolute left-3.5 top-3.5"></i>
                        <input type="text" id="login-username" value="admin" placeholder="Enter username" class="w-full pl-10 pr-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm font-medium focus:ring-2 focus:ring-blue-600 focus:bg-white outline-none transition">
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-bold uppercase tracking-wider text-slate-500 mb-1.5">Password</label>
                    <div class="relative">
                        <i data-lucide="lock" class="w-4 h-4 text-slate-400 absolute left-3.5 top-3.5"></i>
                        <input type="password" id="login-password" value="1234" placeholder="Enter password" class="w-full pl-10 pr-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm font-medium focus:ring-2 focus:ring-blue-600 focus:bg-white outline-none transition">
                    </div>
                </div>
                <button type="submit" class="w-full py-3 bg-blue-600 hover:bg-blue-700 text-white font-semibold rounded-xl shadow-lg shadow-blue-600/30 transition flex items-center justify-center gap-2">
                    <span>Sign In to Portal</span>
                    <i data-lucide="arrow-right" class="w-4 h-4"></i>
                </button>
            </form>

            <div class="mt-6 p-4 bg-slate-50 rounded-2xl border border-slate-200/80 text-xs text-slate-600 space-y-1.5">
                <div class="font-bold text-slate-800 flex items-center gap-1.5">
                    <i data-lucide="info" class="w-3.5 h-3.5 text-blue-600"></i> Universal Login Enabled
                </div>
                <div class="grid grid-cols-2 gap-1 pt-1">
                    <button type="button" onclick="quickFillLogin('admin')" class="text-left px-2 py-1 rounded hover:bg-blue-50 text-slate-700 font-medium">• <span class="font-mono text-blue-600">admin</span> (Full Access)</button>
                    <button type="button" onclick="quickFillLogin('branch1')" class="text-left px-2 py-1 rounded hover:bg-blue-50 text-slate-700 font-medium">• <span class="font-mono text-blue-600">branch1</span> (Branch)</button>
                </div>
            </div>
        </div>
    </div>

    <!-- ==================== MAIN APPLICATION SHELL ==================== -->
    <div id="app-view" class="hidden min-h-screen flex flex-col lg:flex-row">
        
        <!-- Sidebar Navigation -->
        <aside id="sidebar" class="no-print w-full lg:w-72 bg-slate-900 text-slate-300 flex flex-col shrink-0 transition-all">
            <div class="p-6 border-b border-slate-800 flex items-center justify-between">
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 bg-blue-600 text-white rounded-xl flex items-center justify-center shadow-md">
                        <i data-lucide="boxes" class="w-5 h-5"></i>
                    </div>
                    <div>
                        <div class="font-bold text-white text-base leading-tight">StockTransfer</div>
                        <div class="text-[11px] text-slate-400 font-medium">Supply Chain ERP</div>
                    </div>
                </div>
                <button id="mobile-menu-toggle" class="lg:hidden p-2 text-slate-400 hover:text-white rounded-lg">
                    <i data-lucide="menu" class="w-5 h-5"></i>
                </button>
            </div>

            <!-- Navigation Menu Items -->
            <nav id="sidebar-nav" class="flex-1 p-4 space-y-1.5 overflow-y-auto"></nav>

            <!-- Database Status & User Card -->
            <div class="p-4 border-t border-slate-800 space-y-3">
                <div id="db-status-btn" class="w-full flex items-center justify-between px-3 py-2 rounded-xl bg-slate-800/80 border border-slate-700/80 text-xs">
                    <span class="flex items-center gap-2 min-w-0">
                        <span id="db-status-dot" class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse shrink-0"></span>
                        <span id="db-status-text" class="font-medium text-slate-200 truncate">Firebase Connected</span>
                    </span>
                    <button onclick="resetDemoData()" title="Reset All Data" class="p-1 text-slate-400 hover:text-white rounded transition shrink-0">
                        <i data-lucide="refresh-cw" class="w-3.5 h-3.5"></i>
                    </button>
                </div>

                <div class="bg-slate-800/60 rounded-xl p-3 flex items-center justify-between">
                    <div class="min-w-0">
                        <div id="user-display-name" class="text-sm font-bold text-white truncate">Admin User</div>
                        <div id="user-display-role" class="text-[11px] text-blue-400 font-semibold uppercase tracking-wider truncate">ADMINISTRATOR</div>
                    </div>
                    <button onclick="logout()" title="Logout" class="p-2 text-slate-400 hover:text-rose-400 hover:bg-slate-700/50 rounded-lg transition">
                        <i data-lucide="log-out" class="w-4 h-4"></i>
                    </button>
                </div>
            </div>
        </aside>

        <!-- Main Workspace Content -->
        <main class="flex-1 flex flex-col min-w-0">
            <header class="no-print bg-white border-b border-slate-200 px-6 py-4 flex flex-wrap items-center justify-between gap-4 sticky top-0 z-20">
                <div>
                    <h2 id="page-title" class="text-xl font-bold text-slate-900">Dashboard</h2>
                    <p id="page-subtitle" class="text-xs text-slate-500">Manage stock transfer requests and warehouse dispatches</p>
                </div>
                <div class="flex items-center gap-3">
                    <span id="header-branch-pill" class="px-3 py-1.5 bg-blue-50 text-blue-700 border border-blue-200 rounded-full text-xs font-bold flex items-center gap-1.5">
                        <i data-lucide="store" class="w-3.5 h-3.5"></i>
                        <span>System Admin</span>
                    </span>
                </div>
            </header>

            <div id="main-content" class="flex-1 p-4 md:p-6 lg:p-8 max-w-full overflow-x-hidden"></div>
        </main>
    </div>

    <!-- ==================== APPLICATION SCRIPT ==================== -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-app.js";
        import { getAnalytics } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-analytics.js";
        import {
            getFirestore,
            collection,
            doc,
            setDoc,
            getDocs,
            deleteDoc
        } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCw7brFS62KnSPy7m6Pfpj34A24NXA5qv8",
            authDomain: "kty-store-order-cf0ae.firebaseapp.com",
            projectId: "kty-store-order-cf0ae",
            storageBucket: "kty-store-order-cf0ae.firebasestorage.app",
            messagingSenderId: "567340585940",
            appId: "1:567340585940:web:cfd8de452dc562ec217c41",
            measurementId: "G-NH25J77GLR"
        };

        const firebaseApp = initializeApp(firebaseConfig);
        let analytics = null;
        try { analytics = getAnalytics(firebaseApp); } catch (e) {}
        const firestoreDb = getFirestore(firebaseApp);

        const TODAY = new Date().toISOString().split('T')[0];
        const TOMORROW = new Date(Date.now() + 86400000).toISOString().split('T')[0];

        // Clean initial state (Old default demo items cleared as requested)
        const CLEAN_DEFAULT_DATA = {
            branches: [],
            destinations: [],
            categories: [],
            items: [],
            users: [
                { id: 'USR-01', username: 'admin', password: '1234', fullName: 'System Administrator', role: 'admin', branchId: '', destinationId: '' }
            ],
            orders: []
        };

        const STORAGE_KEY = 'kty_store_order_cache_v5';
        let state = JSON.parse(JSON.stringify(CLEAN_DEFAULT_DATA));

        function loadFromLocalStorage() {
            const raw = localStorage.getItem(STORAGE_KEY);
            if (raw) {
                try {
                    const parsed = JSON.parse(raw);
                    state = {
                        branches: parsed.branches || [],
                        destinations: parsed.destinations || [],
                        categories: parsed.categories || [],
                        items: parsed.items || [],
                        users: parsed.users || CLEAN_DEFAULT_DATA.users,
                        orders: parsed.orders || []
                    };
                } catch (e) {}
            }
        }

        function saveToLocalStorage() {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
        }

        async function initHybridDatabase() {
            loadFromLocalStorage();
            const collections = ['branches', 'destinations', 'categories', 'items', 'users', 'orders'];
            try {
                for (const colName of collections) {
                    const colRef = collection(firestoreDb, colName);
                    const snap = await getDocs(colRef);
                    if (!snap.empty) {
                        state[colName] = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                    }
                }
                saveToLocalStorage();
            } catch (err) {
                console.warn('Firestore offline fallback active.');
            }
        }

        window.dbSaveRecord = async function(colName, record) {
            const idx = state[colName].findIndex(r => r.id === record.id);
            if (idx >= 0) state[colName][idx] = record;
            else state[colName].push(record);
            saveToLocalStorage();
            try {
                await setDoc(doc(firestoreDb, colName, record.id), record);
            } catch (e) {}
        }

        window.dbDeleteRecord = async function(colName, id) {
            state[colName] = state[colName].filter(r => r.id !== id);
            saveToLocalStorage();
            try {
                await deleteDoc(doc(firestoreDb, colName, id));
            } catch (e) {}
        }

        window.resetDemoData = async function() {
            state = JSON.parse(JSON.stringify(CLEAN_DEFAULT_DATA));
            saveToLocalStorage();
            showToast('All data cleared/reset successfully!', 'info');
            renderCurrentRoute();
        };

        window.showToast = function(message, type = 'success') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            const styles = {
                success: 'bg-emerald-600 text-white',
                error: 'bg-rose-600 text-white',
                info: 'bg-slate-800 text-white',
                warning: 'bg-amber-600 text-white'
            };
            toast.className = `pointer-events-auto flex items-center gap-2 px-4 py-3 rounded-xl shadow-xl text-sm font-medium transition-all ${styles[type] || styles.info}`;
            toast.innerHTML = `<span>${message}</span>`;
            container.appendChild(toast);
            setTimeout(() => toast.remove(), 3000);
        };

        window.openModal = function({ title, bodyHtml, confirmText = 'Save', onConfirm = null }) {
            document.getElementById('modal-title').textContent = title;
            document.getElementById('modal-body').innerHTML = bodyHtml;
            document.getElementById('modal-footer').classList.remove('hidden');
            document.getElementById('modal-confirm-btn').textContent = confirmText;
            window.activeModalConfirm = onConfirm;
            document.getElementById('custom-modal').classList.remove('hidden');
            lucide.createIcons();
        };

        window.closeModal = function() {
            document.getElementById('custom-modal').classList.add('hidden');
            window.activeModalConfirm = null;
        };

        document.getElementById('modal-confirm-btn').addEventListener('click', async () => {
            if (window.activeModalConfirm) await window.activeModalConfirm();
        });

        let currentUser = null;
        let currentRoute = 'order-form';

        window.quickFillLogin = function(uname) {
            document.getElementById('login-username').value = uname;
            document.getElementById('login-password').value = '1234';
        };

        document.getElementById('login-form').addEventListener('submit', (e) => {
            e.preventDefault();
            const uname = document.getElementById('login-username').value.trim().toLowerCase();
            
            let user = state.users.find(u => u.username.toLowerCase() === uname);
            if (!user) {
                user = {
                    id: 'USR-' + Date.now(),
                    username: uname || 'admin',
                    password: '1234',
                    fullName: uname ? (uname.charAt(0).toUpperCase() + uname.slice(1) + ' User') : 'System Admin',
                    role: uname.includes('branch') ? 'branch' : 'admin',
                    branchId: '',
                    destinationId: ''
                };
            }

            currentUser = { ...user };
            document.getElementById('login-view').classList.add('hidden');
            document.getElementById('app-view').classList.remove('hidden');

            document.getElementById('user-display-name').textContent = currentUser.fullName;
            document.getElementById('user-display-role').textContent = currentUser.role.replace('_', ' ');

            renderSidebarMenu();
            renderCurrentRoute();
            showToast(`Logged in successfully as ${currentUser.fullName}!`, 'success');
        });

        window.logout = function() {
            currentUser = null;
            document.getElementById('app-view').classList.add('hidden');
            document.getElementById('login-view').classList.remove('hidden');
            showToast('Logged out safely.', 'info');
        };

        function renderSidebarMenu() {
            const nav = document.getElementById('sidebar-nav');
            const items = [
                { id: 'order-form', label: 'Stock Transfer Order Form', icon: 'clipboard-edit' },
                { id: 'my-orders', label: 'Branch Order History', icon: 'history' },
                { id: 'order-matrix', label: 'Consolidated Order Matrix', icon: 'table-2' },
                { id: 'delivery-challan', label: 'Delivery Challan & Print', icon: 'printer' },
                { id: 'master-items', label: 'Categories & Item Master', icon: 'package' },
                { id: 'master-locations', label: 'Branches & Destinations', icon: 'building-2' },
                { id: 'master-users', label: 'User Accounts & Roles', icon: 'users' }
            ];

            nav.innerHTML = items.map(item => `
                <button onclick="navigateTo('${item.id}')" class="w-full flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-medium transition ${currentRoute === item.id ? 'bg-blue-600 text-white shadow-lg shadow-blue-600/30' : 'text-slate-300 hover:bg-slate-800 hover:text-white'}">
                    <i data-lucide="${item.icon}" class="w-4 h-4 shrink-0"></i>
                    <span>${item.label}</span>
                </button>
            `).join('');
            lucide.createIcons();
        }

        window.navigateTo = function(routeId) {
            currentRoute = routeId;
            renderSidebarMenu();
            renderCurrentRoute();
        };

        function renderCurrentRoute() {
            const container = document.getElementById('main-content');
            if (currentRoute === 'order-form') renderOrderFormView(container);
            else if (currentRoute === 'my-orders') renderBranchHistoryView(container);
            else if (currentRoute === 'order-matrix') renderOrderMatrixView(container);
            else if (currentRoute === 'delivery-challan') renderDeliveryChallanView(container);
            else if (currentRoute === 'master-items') renderMasterItemsView(container);
            else if (currentRoute === 'master-locations') renderMasterLocationsView(container);
            else if (currentRoute === 'master-users') renderMasterUsersView(container);
            lucide.createIcons();
        }

        // ==================== 1. STOCK TRANSFER ORDER FORM ====================
        let orderFormState = {
            isActive: false,
            branchId: '',
            destinationId: '',
            requestDate: TODAY,
            deliveryDate: TOMORROW,
            catIdx: 0,
            quantities: {}
        };

        function renderOrderFormView(container) {
            const cats = state.categories;
            const activeCat = cats[orderFormState.catIdx] || cats[0];
            const items = activeCat ? state.items.filter(i => i.categoryId === activeCat.id) : [];

            container.innerHTML = `
                <div class="max-w-5xl mx-auto space-y-6">
                    <div class="bg-white rounded-2xl p-6 shadow-sm border border-slate-200">
                        <div class="flex items-center justify-between pb-4 mb-6 border-b border-slate-100">
                            <span class="px-3 py-1 rounded-full text-xs font-bold ${orderFormState.isActive ? 'bg-emerald-50 text-emerald-700' : 'bg-slate-100 text-slate-600'}">
                                ${orderFormState.isActive ? '● Form Active (Ready)' : '○ Locked (Click Add)'}
                            </span>
                            <div class="flex gap-2">
                                <button onclick="activateOrderForm()" class="px-4 py-2 bg-emerald-600 hover:bg-emerald-700 text-white font-semibold rounded-xl text-sm">Add</button>
                                <button onclick="cancelOrderForm()" class="px-4 py-2 bg-slate-200 hover:bg-slate-300 text-slate-700 font-semibold rounded-xl text-sm">Cancel</button>
                                <button onclick="saveOrderForm()" class="px-5 py-2 bg-blue-600 hover:bg-blue-700 text-white font-semibold rounded-xl text-sm shadow-md">Save & Submit</button>
                            </div>
                        </div>
                        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
                            <div>
                                <label class="block text-xs font-bold uppercase text-slate-500 mb-1">Branch</label>
                                <select id="f-branch" class="w-full px-3 py-2 bg-slate-50 border rounded-xl text-sm font-bold">
                                    <option value="">Select Branch...</option>
                                    ${state.branches.map(b => `<option value="${b.id}" ${b.id === orderFormState.branchId ? 'selected' : ''}>${b.name}</option>`).join('')}
                                </select>
                            </div>
                            <div>
                                <label class="block text-xs font-bold uppercase text-slate-500 mb-1">To Destination</label>
                                <select id="f-dest" class="w-full px-3 py-2 bg-slate-50 border rounded-xl text-sm font-bold">
                                    <option value="">Select Destination...</option>
                                    ${state.destinations.map(d => `<option value="${d.id}" ${d.id === orderFormState.destinationId ? 'selected' : ''}>${d.name}</option>`).join('')}
                                </select>
                            </div>
                            <div>
                                <label class="block text-xs font-bold uppercase text-slate-500 mb-1">Request Date</label>
                                <input type="date" id="f-req" value="${orderFormState.requestDate}" class="w-full px-3 py-2 bg-slate-50 border rounded-xl text-sm font-bold">
                            </div>
                            <div>
                                <label class="block text-xs font-bold uppercase text-slate-500 mb-1">Delivery Date</label>
                                <input type="date" id="f-del" value="${orderFormState.deliveryDate}" class="w-full px-3 py-2 bg-slate-50 border rounded-xl text-sm font-bold">
                            </div>
                        </div>
                    </div>

                    <div class="bg-white rounded-2xl p-6 shadow-sm border border-slate-200 space-y-4">
                        ${cats.length === 0 ? `
                            <div class="p-8 text-center text-slate-500 bg-slate-50 rounded-xl">
                                <p class="font-bold">No categories or items found.</p>
                                <p class="text-xs mt-1">Please add categories and items in the Master section or import via Excel first.</p>
                            </div>
                        ` : `
                            <div class="flex items-center justify-between bg-slate-50 p-3 rounded-xl">
                                <select id="f-cat" class="px-4 py-2 bg-white border rounded-xl text-sm font-bold">
                                    ${cats.map((c, i) => `<option value="${i}" ${i === orderFormState.catIdx ? 'selected' : ''}>${c.name}</option>`).join('')}
                                </select>
                                <div class="flex gap-2">
                                    <button onclick="changeCat(-1)" class="px-3 py-1.5 bg-white border rounded-lg text-sm font-bold">Previous</button>
                                    <button onclick="changeCat(1)" class="px-3 py-1.5 bg-white border rounded-lg text-sm font-bold">Next</button>
                                </div>
                            </div>

                            <div class="overflow-x-auto border rounded-xl">
                                <table class="w-full text-left">
                                    <thead class="bg-slate-100 text-xs font-bold text-slate-600 uppercase">
                                        <tr>
                                            <th class="py-3 px-4">Code</th>
                                            <th class="py-3 px-4">Item Name</th>
                                            <th class="py-3 px-4">Unit</th>
                                            <th class="py-3 px-4 text-right">Quantity</th>
                                        </tr>
                                    </thead>
                                    <tbody class="divide-y text-sm">
                                        ${items.map(it => `
                                            <tr>
                                                <td class="py-3 px-4 font-mono font-bold">${it.code}</td>
                                                <td class="py-3 px-4 font-semibold">${it.name}</td>
                                                <td class="py-3 px-4"><span class="px-2 py-0.5 bg-slate-100 text-xs font-bold rounded">${it.unit}</span></td>
                                                <td class="py-3 px-4 text-right">

                    <div class="flex items-center justify-between">
                        <h3 class="font-bold text-lg">User Accounts & Role Permissions</h3>
                        <button onclick="openUserModal()" class="px-4 py-2 bg-blue-600 text-white font-semibold rounded-xl text-sm">Add New User</button>
                    </div>
                    <table class="w-full text-left text-sm border">
                        <thead><tr class="bg-slate-100 font-bold text-xs"><th class="p-3 border">Username</th><th class="p-3 border">Full Name</th><th class="p-3 border">Role / Permission</th><th class="p-3 border text-right">Actions</th></tr></thead>
                        <tbody>
                            ${state.users.map(u => `
                                <tr>
                                    <td class="p-3 border font-mono font-bold">${u.username}</td>
                                    <td class="p-3 border font-semibold">${u.fullName}</td>
                                    <td class="p-3 border"><span class="px-2 py-0.5 bg-blue-50 text-blue-700 font-bold text-xs rounded">${u.role}</span></td>
                                    <td class="p-3 border text-right space-x-2">
                                        <button onclick="openUserModal('${u.id}')" class="text-blue-600 font-bold">Edit</button>
                                        ${u.username !== 'admin' ? `<button onclick="deleteRecord('users', '${u.id}')" class="text-rose-600 font-bold">Delete</button>` : ''}
                                    </td>
                                </tr>
                            `).join('')}
                        </tbody>
                    </table>
                </div>
            `;
        }

        window.openUserModal = function(id = null) {
            const u = id ? state.users.find(x => x.id === id) : { id: 'USR-' + Date.now(), username: '', password: '1234', fullName: '', role: 'branch' };
            openModal({
                title: id ? 'Edit User & Permissions' : 'Add User Account',
                bodyHtml: `
                    <div class="space-y-3">
                        <div><label class="block text-xs font-bold uppercase text-slate-500 mb-1">Username</label><input type="text" id="m-u-name" value="${u.username}" class="w-full px-3 py-2 border rounded-xl text-sm font-bold"></div>
                        <div><label class="block text-xs font-bold uppercase text-slate-500 mb-1">Password</label><input type="text" id="m-u-pass" value="${u.password}" class="w-full px-3 py-2 border rounded-xl text-sm font-bold"></div>
                        <div><label class="block text-xs font-bold uppercase text-slate-500 mb-1">Full Name</label><input type="text" id="m-u-full" value="${u.fullName}" class="w-full px-3 py-2 border rounded-xl text-sm font-bold"></div>
                        <div>
                            <label class="block text-xs font-bold uppercase text-slate-500 mb-1">Role / Permission</label>
                            <select id="m-u-role" class="w-full px-3 py-2 border rounded-xl text-sm font-bold">
                                <option value="admin" ${u.role === 'admin' ? 'selected' : ''}>Administrator (Full Access)</option>
                                <option value="branch" ${u.role === 'branch' ? 'selected' : ''}>Branch User (Order Submission)</option>
                                <option value="factory_warehouse" ${u.role === 'factory_warehouse' ? 'selected' : ''}>Factory & Warehouse (Fulfill & Challan)</option>
                            </select>
                        </div>
                    </div>
                `,
                onConfirm: async () => {
                    u.username = document.getElementById('m-u-name').value.trim();
                    u.password = document.getElementById('m-u-pass').value.trim();
                    u.fullName = document.getElementById('m-u-full').value.trim();
                    u.role = document.getElementById('m-u-role').value;
                    if(!u.username) return showToast('Username is required!', 'error');
                    await dbSaveRecord('users', u);
                    closeModal();
                    renderCurrentRoute();
                    showToast('User saved successfully!');
                }
            });
        };

        window.deleteRecord = async function(colName, id) {
            openModal({
                title: 'Confirm Deletion',
                bodyHtml: '<p>Are you sure you want to delete this record?</p>',
                confirmText: 'Delete',
                onConfirm: async () => {
                    await dbDeleteRecord(colName, id);
                    closeModal();
                    renderCurrentRoute();
                    showToast('Record deleted successfully.', 'info');
                }
            });
        };

        // Excel Import Utility
        window.importExcelData = function(event, colName) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = async function(e) {
                try {
                    const data = new Uint8Array(e.target.result);
                    const workbook = XLSX.read(data, { type: 'array' });
                    const firstSheet = workbook.Sheets[workbook.SheetNames[0]];
                    const json = XLSX.utils.sheet_to_json(firstSheet);
                    
                    let count = 0;
                    for (let row of json) {
                        if (colName === 'categories') {
                            const rec = { id: row.id || 'CAT-' + Date.now() + Math.random(), name: row.name || row.Name };
                            if (rec.name) { await dbSaveRecord('categories', rec); count++; }
                        } else if (colName === 'items') {
                            const rec = {
                                id: row.id || 'ITM-' + Date.now() + Math.random(),
                                code: row.code || row.Code || 'CODE',
                                name: row.name || row.Name || 'Item',
                                unit: row.unit || row.Unit || 'PCS',
                                categoryId: row.categoryId || state.categories[0]?.id || 'CAT-01'
                            };
                            if (rec.name) { await dbSaveRecord('items', rec); count++; }
                        } else if (colName === 'branches') {
                            const rec = {
                                id: row.id || 'BR-' + Date.now() + Math.random(),
                                code: row.code || row.Code || 'BR',
                                name: row.name || row.Name || 'Branch',
                                address: row.address || row.Address || ''
                            };
                            if (rec.name) { await dbSaveRecord('branches', rec); count++; }
                        }
                    }
                    showToast(`Successfully imported ${count} records from Excel!`, 'success');
                    renderCurrentRoute();
                } catch (err) {
                    showToast('Failed to parse Excel file.', 'error');
                }
            };
            reader.readAsArrayBuffer(file);
        };

        window.addEventListener('DOMContentLoaded', () => {
            lucide.createIcons();
            initHybridDatabase();
        });
    </script>
</body>
</html>
