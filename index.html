            if (!raw) {
                state = JSON.parse(JSON.stringify(DEFAULT_DATA));
                saveToLocalStorage();
            } else {
                try {
                    const parsed = JSON.parse(raw);
                    state = {
                        branches: parsed.branches || DEFAULT_DATA.branches,
                        destinations: parsed.destinations || DEFAULT_DATA.destinations,
                        categories: parsed.categories || DEFAULT_DATA.categories,
                        items: parsed.items || DEFAULT_DATA.items,
                        users: parsed.users || DEFAULT_DATA.users,
                        orders: parsed.orders || []
                    };

                    saveToLocalStorage();
                }
            }

        function saveToLocalStorage() {

                text.textContent = 'Offline Cache Mode';
            }
        }

        async function seedCollectionIfEmpty(colName) {
            const colRef = collection(firestoreDb, colName);
            const snap = await getDocs(colRef);
            if (snap.empty && DEFAULT_DATA[colName]?.length > 0) {
                const batch = writeBatch(firestoreDb);
                DEFAULT_DATA[colName].forEach(record => {
                    batch.set(doc(firestoreDb, colName, record.id), record);
                });
                await batch.commit();
            }
        }

        async function initHybridDatabase() {
            loadFromLocalStorage();

            const collections = ['branches', 'destinations', 'categories', 'items', 'users', 'orders'];
            try {
                // Ensure initial master data & demo users exist in Cloud Firestore
                await Promise.all(collections.map(colName => seedCollectionIfEmpty(colName)));

                // Attach real-time Firestore listeners to all collections
                collections.forEach(colName => {
                    const colRef = collection(firestoreDb, colName);
                    onSnapshot(colRef, (snapshot) => {
                        updateDbStatusBadge(true);
                        state[colName] = snapshot.docs.map(d => ({ id: d.id, ...d.data() }));
                        saveToLocalStorage();
                        if (currentUser) renderCurrentRoute();
                    }, (err) => {
                        console.error(`Firestore listener error (${colName}):`, err);
                        updateDbStatusBadge(false);
                    });
                });
            } catch (err) {
                console.warn('Cloud Firestore connection fallback (check Firestore Security Rules):', err);
                updateDbStatusBadge(false);
            }
        }

        async function dbSaveRecord(colName, record) {
            const idx = state[colName].findIndex(r => r.id === record.id);
            if (idx >= 0) state[colName][idx] = record;
            else state[colName].push(record);
            saveToLocalStorage();

            try {
                await setDoc(doc(firestoreDb, colName, record.id), record);
                updateDbStatusBadge(true);
            } catch (e) {
                console.error('Firestore save error:', e);
                showToast('Saved locally. Check Firestore rules if cloud sync is blocked.', 'warning');
            }
        }

        async function dbDeleteRecord(colName, id) {
            state[colName] = state[colName].filter(r => r.id !== id);
            saveToLocalStorage();

            try {
                await deleteDoc(doc(firestoreDb, colName, id));
                updateDbStatusBadge(true);
            } catch (e) {

        function saveToLocalStorage() {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(state));

                        onSnapshot(colRef, async (snapshot) => {
                            updateDbStatusBadge(true);
                            if (snapshot.empty) {
                                // Seed initial records to Firestore
                                for (const item of state[colName]) {
                                    await setDoc(doc(firestoreDb, 'artifacts', appId, 'public', 'data', colName, item.id), item);
                                }
                            } else {
                                state[colName] = snapshot.docs.map(d => ({ id: d.id, ...d.data() }));
                                saveToLocalStorage();
                                if (currentUser) renderCurrentRoute();
                            }
                        }, (err) => {
                            console.warn('Firestore listener fallback:', err);
                            updateDbStatusBadge(false);
                        });
                    });
                } catch (err) {
                    console.warn('Firebase init failed, using LocalStorage:', err);
                    updateDbStatusBadge(false);
                }
            } else {
                updateDbStatusBadge(false);
            }
        }

        async function dbSaveRecord(colName, record) {
            const idx = state[colName].findIndex(r => r.id === record.id);
            if (idx >= 0) state[colName][idx] = record;
            else state[colName].push(record);
            saveToLocalStorage();

            if (isCloudActive && firestoreDb) {
                try {
                    await setDoc(doc(firestoreDb, 'artifacts', appId, 'public', 'data', colName, record.id), record);
                } catch (e) {
                    console.error('Cloud write error:', e);
                }
            }
        }

        async function dbDeleteRecord(colName, id) {
            state[colName] = state[colName].filter(r => r.id !== id);
            saveToLocalStorage();

            if (isCloudActive && firestoreDb) {
                try {
                    await deleteDoc(doc(firestoreDb, 'artifacts', appId, 'public', 'data', colName, id));
                } catch (e) {
                    console.error('Cloud delete error:', e);
                }
            }
        }

            const styles = {

                error: 'bg-rose-600 text-white border-rose-500',
                info: 'bg-slate-800 text-white border-slate-700',
                warning: 'bg-amber-600 text-white border-amber-500'
            };
            const icons = {
                success: 'check-circle-2',
                error: 'alert-circle',
                info: 'info',
                warning: 'alert-triangle'
            };
            toast.className = `pointer-events-auto flex items-center gap-2.5 px-4 py-3 rounded-xl shadow-xl border text-sm font-medium transition-all duration-300 transform translate-y-2 opacity-0 ${styles[type] || styles.info}`;
            toast.innerHTML = `<i data-lucide="${icons[type] || 'info'}" class="w-4 h-4 shrink-0"></i><span>${message}</span>`;
            container.appendChild(toast);
            lucide.createIcons();

            requestAnimationFrame(() => {
                toast.classList.remove('translate-y-2', 'opacity-0');
            });

            setTimeout(() => {
                toast.classList.add('opacity-0', 'translate-y-2');
                setTimeout(() => toast.remove(), 300);
            }, 3200);
        };

                });
            });

            // Action Buttons
            document.getElementById('btn-order-add').addEventListener('click', () => {
                orderFormState.isActive = true;
                orderFormState.editingOrderId = null;
                orderFormState.statusLabel = 'New Order Entry';
                orderFormState.quantities = {};
                renderOrderFormView(container);
                showToast('Order form activated! Enter quantities across categories and click Save.', 'success');
            });

            document.getElementById('btn-order-modify').addEventListener('click', () => {
                // Find existing order for current Branch + Destination + DeliveryDate (or Suspended order)
                const matching = state.orders.filter(o =>
                    o.branchId === orderFormState.branchId &&
                    o.destinationId === orderFormState.destinationId &&
                    o.deliveryDate === orderFormState.deliveryDate
                );

                if (matching.length > 0) {
                    const target = matching[matching.length - 1];
                    orderFormState.isActive = true;
                    orderFormState.editingOrderId = target.id;
                    orderFormState.statusLabel = `Modifying (${target.status})`;
                    orderFormState.requestDate = target.requestDate;
                    orderFormState.deliveryDate = target.deliveryDate;
                    orderFormState.quantities = { ...(target.quantities || {}) };
                    renderOrderFormView(container);
                    showToast(`Loaded order ${target.id} for modification.`, 'info');
                } else {
                    orderFormState.isActive = true;
                    orderFormState.statusLabel = 'Editing Mode';
                    renderOrderFormView(container);
                    showToast('Form unlocked for editing.', 'info');
                }
            });

            document.getElementById('btn-order-suspend').addEventListener('click', async () => {
                const branchObj = state.branches.find(b => b.id === orderFormState.branchId);
                const destObj = state.destinations.find(d => d.id === orderFormState.destinationId);

                const orderId = orderFormState.editingOrderId || ('ORD-' + Date.now());
                const record = {
                    id: orderId,
                    branchId: orderFormState.branchId,
                    branchName: branchObj ? branchObj.name : 'Unknown Branch',
                    destinationId: orderFormState.destinationId,
                    destinationName: destObj ? destObj.name : 'Unknown Destination',
                    requestDate: orderFormState.requestDate,
                    deliveryDate: orderFormState.deliveryDate,
                    status: 'Suspended',
                    quantities: { ...orderFormState.quantities },
                    updatedAt: new Date().toISOString()
                };

                await dbSaveRecord('orders', record);
                orderFormState.isActive = false;
                orderFormState.statusLabel = 'Suspended (Saved as Draft)';
                renderOrderFormView(container);
                showToast('Order suspended and saved as draft.', 'warning');
            });

            document.getElementById('btn-order-save').addEventListener('click', async () => {
                const filledEntries = Object.entries(orderFormState.quantities).filter(([_, q]) => q > 0);
                if (filledEntries.length === 0) {
                    showToast('Please enter a quantity for at least one item before saving.', 'error');
                    return;
                }

                const branchObj = state.branches.find(b => b.id === orderFormState.branchId);
                const destObj = state.destinations.find(d => d.id === orderFormState.destinationId);

                // Check if an order already exists for the same Branch + Destination + Delivery Date
                const existingSameSlot = state.orders.find(o =>
                    o.branchId === orderFormState.branchId &&
                    o.destinationId === orderFormState.destinationId &&
                    o.deliveryDate === orderFormState.deliveryDate
                );

                const orderId = orderFormState.editingOrderId || (existingSameSlot ? existingSameSlot.id : 'ORD-' + Date.now());
                const record = {
                    id: orderId,
                    branchId: orderFormState.branchId,
                    branchName: branchObj ? branchObj.name : 'Unknown Branch',
                    destinationId: orderFormState.destinationId,
                    destinationName: destObj ? destObj.name : 'Unknown Destination',
                    requestDate: orderFormState.requestDate,
                    deliveryDate: orderFormState.deliveryDate,
                    status: 'Submitted',
                    quantities: { ...orderFormState.quantities },
                    updatedAt: new Date().toISOString()
                };

                await dbSaveRecord('orders', record);
                orderFormState.isActive = false;
                orderFormState.editingOrderId = null;
                orderFormState.statusLabel = 'Saved & Submitted';
                renderOrderFormView(container);
                showToast(`Order saved successfully (${filledEntries.length} items submitted to ${record.destinationName})!`, 'success');
            });
        }

        // ------------------------------------------------------------
        // 6. BRANCH ORDER HISTORY VIEW
        // ------------------------------------------------------------
        function renderBranchHistoryView(container) {
            const branchOrders = state.orders
                .filter(o => currentUser.role !== 'branch' || o.branchId === currentUser.branchId)
                .sort((a, b) => (b.updatedAt || '').localeCompare(a.updatedAt || ''));

            container.innerHTML = `
                <div class="max-w-6xl mx-auto bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
                    <div class="p-6 border-b border-slate-200 flex items-center justify-between">
                        <div>
                            <h3 class="text-lg font-bold text-slate-900">Submitted & Suspended Orders</h3>
                            <p class="text-xs text-slate-500">Click "Load to Modify" to reopen any order in the Stock Transfer Form</p>
                        </div>
                        <button onclick="navigateTo('order-form')" class="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white font-semibold rounded-xl text-sm transition flex items-center gap-1.5">
                            <i data-lucide="plus" class="w-4 h-4"></i> New Order Form
                        </button>
                    </div>
                    <div class="overflow-x-auto">
                        <table class="w-full text-left border-collapse">
                            <thead>
                                <tr class="bg-slate-50 border-b border-slate-200 text-xs font-bold text-slate-500 uppercase tracking-wider">
                                    <th class="py-3.5 px-4">Order ID</th>
                                    <th class="py-3.5 px-4">Branch</th>
                                    <th class="py-3.5 px-4">Destination</th>
                                    <th class="py-3.5 px-4">Req Date</th>
                                    <th class="py-3.5 px-4">Delivery Date</th>
                                    <th class="py-3.5 px-4">Items / Qty</th>
                                    <th class="py-3.5 px-4">Status</th>
                                    <th class="py-3.5 px-4 text-right">Action</th>
                                </tr>
                            </thead>
                            <tbody class="divide-y divide-slate-100 text-sm">
                                ${branchOrders.length === 0 ? `
                                    <tr><td colspan="8" class="py-10 text-center text-slate-400">No orders found yet.</td></tr>
                                ` : branchOrders.map(ord => {
                                    const qtys = Object.values(ord.quantities || {});
                                    const itemCount = qtys.filter(q => q > 0).length;
                                    const sumQty = qtys.reduce((s, q) => s + Number(q || 0), 0);
                                    const badge = ord.status === 'Suspended'
                                        ? 'bg-amber-50 text-amber-700 border-amber-200'
                                        : 'bg-emerald-50 text-emerald-700 border-emerald-200';
                                    return `
                                        <tr class="hover:bg-slate-50 transition">
                                            <td class="py-3 px-4 font-mono text-xs font-bold text-slate-600">${ord.id}</td>
                                            <td class="py-3 px-4 font-semibold text-slate-900">${ord.branchName}</td>
                                            <td class="py-3 px-4 font-medium text-blue-700">${ord.destinationName}</td>
                                            <td class="py-3 px-4 text-slate-600">${ord.requestDate}</td>
                                            <td class="py-3 px-4 font-semibold text-slate-800">${ord.deliveryDate}</td>
                                            <td class="py-3 px-4 text-slate-600">${itemCount} items (${sumQty} qty)</td>
                                            <td class="py-3 px-4"><span class="px-2.5 py-1 rounded-full text-xs font-bold border ${badge}">${ord.status}</span></td>
                                            <td class="py-3 px-4 text-right">
                                                <button onclick="loadOrderIntoForm('${ord.id}')" class="px-3 py-1.5 bg-slate-100 hover:bg-blue-600 hover:text-white text-slate-700 font-semibold rounded-lg text-xs transition">
                                                    Load to Modify
                                                </button>
                                            </td>
                                        </tr>
                                    `;
                                }).join('')}
                            </tbody>
                        </table>
                    </div>
                </div>
            `;
        }

        window.loadOrderIntoForm = function(orderId) {
            const ord = state.orders.find(o => o.id === orderId);
            if (!ord) return;
            orderFormState = {
                isActive: true,
                editingOrderId: ord.id,
                statusLabel: `Modifying (${ord.status})`,
                branchId: ord.branchId,
                destinationId: ord.destinationId,
                requestDate: ord.requestDate,
                deliveryDate: ord.deliveryDate,
                selectedCategoryIndex: 0,
                quantities: { ...(ord.quantities || {}) }
            };
            navigateTo('order-form');
            showToast(`Loaded ${ord.id} into editor.`, 'info');
        };

        // ------------------------------------------------------------
        // 7. FACTORY & WAREHOUSE ORDER MATRIX (Double-Click Modify & Save)
        // ------------------------------------------------------------
        let matrixFilter = {
            date: TOMORROW,
            destinationId: 'ALL',
            categoryId: 'ALL'
        };
        let matrixPendingEdits = {}; // `${branchId}__${itemId}` -> newQty

        function renderOrderMatrixView(container) {
            const branches = state.branches;
            const destinations = state.destinations;
            const categories = state.categories;

            const filteredItems = matrixFilter.categoryId === 'ALL'
                ? state.items
                : state.items.filter(i => i.categoryId === matrixFilter.categoryId);

            const matchingOrders = state.orders.filter(o => {
                const dateOk = o.deliveryDate === matrixFilter.date || o.requestDate === matrixFilter.date;
                const destOk = matrixFilter.destinationId === 'ALL' || o.destinationId === matrixFilter.destinationId;
                return dateOk && destOk && o.status !== 'Suspended';
            });

            // Build lookup: branchId -> itemId -> qty
            const cellMatrix = {};
            branches.forEach(b => { cellMatrix[b.id] = {}; });

            matchingOrders.forEach(ord => {
                if (!cellMatrix[ord.branchId]) cellMatrix[ord.branchId] = {};
                Object.entries(ord.quantities || {}).forEach(([itemId, q]) => {
                    cellMatrix[ord.branchId][itemId] = (cellMatrix[ord.branchId][itemId] || 0) + Number(q || 0);
                });
            });

            // Overlay any unsaved double-click edits
            Object.entries(matrixPendingEdits).forEach(([key, val]) => {
                const [bId, iId] = key.split('__');
                if (!cellMatrix[bId]) cellMatrix[bId] = {};
                cellMatrix[bId][iId] = val;
            });

            const pendingCount = Object.keys(matrixPendingEdits).length;
            const branchColumnTotals = {};
            branches.forEach(b => { branchColumnTotals[b.id] = 0; });
            let grandTotal = 0;

            container.innerHTML = `
                <div class="space-y-6">
                    <!-- Filter & Export Toolbar -->
                    <div class="bg-white rounded-2xl p-6 shadow-sm border border-slate-200 flex flex-col xl:flex-row xl:items-end justify-between gap-4">
                        <div class="grid grid-cols-1 sm:grid-cols-3 gap-4 flex-1">
                            <div>
                                <label class="block text-xs font-bold uppercase tracking-wider text-slate-500 mb-1.5">Order / Delivery Date</label>
                                <input type="date" id="matrix-date" value="${matrixFilter.date}" class="w-full px-3.5 py-2 bg-slate-50 border border-slate-200 rounded-xl text-sm font-semibold focus:ring-2 focus:ring-blue-600 outline-none">
                            </div>
                            <div>
                                <label class="block text-xs font-bold uppercase tracking-wider text-slate-500 mb-1.5">Destination (Factory / WH)</label>
                                <select id="matrix-dest" class="w-full px-3.5 py-2 bg-slate-50 border border-slate-200 rounded-xl text-sm font-semibold focus:ring-2 focus:ring-blue-600 outline-none">
                                    <option value="ALL" ${matrixFilter.destinationId === 'ALL' ? 'selected' : ''}>All Destinations</option>
                                    ${destinations.map(d => `<option value="${d.id}" ${matrixFilter.destinationId === d.id ? 'selected' : ''}>${d.name}</option>`).join('')}
                                </select>
                            </div>
                            <div>
                                <label class="block text-xs font-bold uppercase tracking-wider text-slate-500 mb-1.5">Item Category</label>
                                <select id="matrix-cat" class="w-full px-3.5 py-2 bg-slate-50 border border-slate-200 rounded-xl text-sm font-semibold focus:ring-2 focus:ring-blue-600 outline-none">
                                    <option value="ALL" ${matrixFilter.categoryId === 'ALL' ? 'selected' : ''}>All Categories</option>
                                    ${categories.map(c => `<option value="${c.id}" ${matrixFilter.categoryId === c.id ? 'selected' : ''}>${c.name}</option>`).join('')}
                                </select>
                            </div>
                        </div>

                        <div class="flex flex-wrap items-center gap-2">
                            <button id="btn-matrix-excel" class="px-4 py-2 bg-emerald-600 hover:bg-emerald-700 text-white font-semibold rounded-xl text-sm transition flex items-center gap-1.5">
                                <i data-lucide="file-spreadsheet" class="w-4 h-4"></i> Excel
                            </button>
                            <button id="btn-matrix-pdf" class="px-4 py-2 bg-rose-600 hover:bg-rose-700 text-white font-semibold rounded-xl text-sm transition flex items-center gap-1.5">
                                <i data-lucide="file-text" class="w-4 h-4"></i> PDF
                            </button>
                            <button id="btn-matrix-save" class="px-5 py-2 bg-blue-600 hover:bg-blue-700 text-white font-semibold rounded-xl text-sm shadow-md shadow-blue-600/20 transition flex items-center gap-1.5">
                                <i data-lucide="save" class="w-4 h-4"></i> Save Changes ${pendingCount > 0 ? `(${pendingCount})` : ''}
                            </button>
                        </div>
                    </div>

                    <!-- Helper Tip -->
                    <div class="flex items-center justify-between px-4 py-2.5 bg-blue-50 border border-blue-200 rounded-xl text-xs text-blue-800">
                        <span class="flex items-center gap-2 font-medium">
                            <i data-lucide="mouse-pointer-click" class="w-4 h-4 text-blue-600"></i>
                            Tip: <strong>Double-click</strong> any branch quantity cell below to modify its value inline, then click <strong>Save Changes</strong>.
                        </span>
                        <span class="font-bold">${matchingOrders.length} Branch Order(s) Loaded</span>
                    </div>

                    <!-- Consolidated Matrix Table -->
                    <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-x-auto">
                        <table class="w-full text-left border-collapse whitespace-nowrap">
                            <thead>
                                <tr class="bg-slate-100 border-b border-slate-200 text-xs font-bold text-slate-600 uppercase tracking-wider">
                                    <th class="py-3.5 px-4 sticky left-0 bg-slate-100 z-10 border-r border-slate-200">Item Code</th>
                                    <th class="py-3.5 px-4 sticky left-24 bg-slate-100 z-10 border-r border-slate-200">Item Name</th>
                                    <th class="py-3.5 px-4 border-r border-slate-200">Unit</th>
                                    ${branches.map(b => `<th class="py-3.5 px-4 text-center border-r border-slate-200 min-w-[140px]">${b.name}</th>`).join('')}
                                    <th class="py-3.5 px-4 text-center bg-blue-100/70 text-blue-900 font-extrabold">Total Order</th>
                                </tr>
                            </thead>
                            <tbody class="divide-y divide-slate-100 text-sm">
                                ${filteredItems.map(item => {
                                    let rowTotal = 0;
                                    const branchTds = branches.map(b => {
                                        const qty = cellMatrix[b.id]?.[item.id] || 0;
                                        rowTotal += qty;
                                        branchColumnTotals[b.id] += qty;
                                        const isEdited = Object.prototype.hasOwnProperty.call(matrixPendingEdits, `${b.id}__${item.id}`);

                                        return `
                                            <td data-branch-id="${b.id}" data-item-id="${item.id}" data-qty="${qty}" class="matrix-editable-cell py-2.5 px-4 text-center border-r border-slate-100 cursor-pointer select-none transition hover:bg-blue-50/70 ${isEdited ? 'bg-amber-50 font-bold text-amber-800 ring-1 ring-inset ring-amber-300' : ''}" title="Double-click to edit">
                                                ${qty > 0 ? `<span class="font-bold text-slate-900">${qty}</span>` : `<span class="text-slate-300">-</span>`}
                                            </td>
                                        `;
                                    }).join('');

                                    grandTotal += rowTotal;

                                    return `
                                        <tr class="hover:bg-slate-50/80 transition">
                                            <td class="py-3 px-4 font-mono font-bold text-slate-700 sticky left-0 bg-white border-r border-slate-200">${item.code}</td>
                                            <td class="py-3 px-4 font-semibold text-slate-900 sticky left-24 bg-white border-r border-slate-200">${item.name}</td>
                                            <td class="py-3 px-4 text-xs font-bold text-slate-500 border-r border-slate-200">${item.unit}</td>
                                            ${branchTds}
                                            <td class="py-3 px-4 text-center font-extrabold text-blue-700 bg-blue-50/40">${rowTotal > 0 ? rowTotal : '-'}</td>
                                        </tr>
                                    `;
                                }).join('')}
                            </tbody>
                            <tfoot>
                                <tr class="bg-slate-100 border-t-2 border-slate-300 font-extrabold text-sm text-slate-900">
                                    <td colspan="3" class="py-3.5 px-4 text-right uppercase text-xs tracking-wider text-slate-600 border-r border-slate-200">Branch Total Quantities:</td>
                                    ${branches.map(b => `<td class="py-3.5 px-4 text-center border-r border-slate-200 text-slate-900">${branchColumnTotals[b.id] || 0}</td>`).join('')}
                                    <td class="py-3.5 px-4 text-center bg-blue-600 text-white">${grandTotal}</td>
                                </tr>
                            </tfoot>
                        </table>
                    </div>
                </div>
            `;

            // Filter Listeners
            document.getElementById('matrix-date').addEventListener('change', e => {
                matrixFilter.date = e.target.value;
                matrixPendingEdits = {};
                renderOrderMatrixView(container);
            });
            document.getElementById('matrix-dest').addEventListener('change', e => {
                matrixFilter.destinationId = e.target.value;
                matrixPendingEdits = {};
                renderOrderMatrixView(container);
            });
            document.getElementById('matrix-cat').addEventListener('change', e => {
                matrixFilter.categoryId = e.target.value;
                renderOrderMatrixView(container);
            });

            // Double-Click Inline Cell Editor
            document.querySelectorAll('.matrix-editable-cell').forEach(td => {
                td.addEventListener('dblclick', () => {
                    if (td.querySelector('input')) return;
                    const branchId = td.getAttribute('data-branch-id');
                    const itemId = td.getAttribute('data-item-id');
                    const currentVal = parseFloat(td.getAttribute('data-qty')) || 0;

                    td.innerHTML = `<input type="number" min="0" step="any" value="${currentVal}" class="w-20 px-2 py-1 text-center bg-white border-2 border-blue-600 rounded-lg font-bold text-slate-900 outline-none shadow-sm">`;
                    const input = td.querySelector('input');
                    input.focus();
                    input.select();

                    const commitEdit = () => {
                        const newVal = parseFloat(input.value);
                        const finalVal = (!isNaN(newVal) && newVal >= 0) ? newVal : 0;
                        matrixPendingEdits[`${branchId}__${itemId}`] = finalVal;
                        renderOrderMatrixView(container);
                    };

                    input.addEventListener('blur', commitEdit);
                    input.addEventListener('keydown', e => {
                        if (e.key === 'Enter') {
                            e.preventDefault();
                            commitEdit();
                        } else if (e.key === 'Escape') {
                            renderOrderMatrixView(container);
                        }
                    });
                });
            });

            // Save Modified Matrix Quantities back to Orders
            document.getElementById('btn-matrix-save').addEventListener('click', async () => {
                if (Object.keys(matrixPendingEdits).length === 0) {
                    showToast('No double-click modifications to save.', 'info');
                    return;
                }

                const targetDestId = matrixFilter.destinationId === 'ALL'
                    ? (state.destinations[0]?.id || 'DST-01')
                    : matrixFilter.destinationId;
                const targetDestObj = state.destinations.find(d => d.id === targetDestId);

                // Group edits by branchId
                const editsByBranch = {};
                Object.entries(matrixPendingEdits).forEach(([key, qty]) => {
                    const [branchId, itemId] = key.split('__');
                    if (!editsByBranch[branchId]) editsByBranch[branchId] = {};
                    editsByBranch[branchId][itemId] = qty;
                });

                for (const [branchId, itemUpdates] of Object.entries(editsByBranch)) {
                    const branchObj = state.branches.find(b => b.id === branchId);
                    let targetOrder = matchingOrders.find(o => o.branchId === branchId);

                    if (targetOrder) {
                        const updatedQtys = { ...(targetOrder.quantities || {}) };
                        Object.entries(itemUpdates).forEach(([itemId, q]) => {
                            if (q > 0) updatedQtys[itemId] = q;
                            else delete updatedQtys[itemId];
                        });
                        await dbSaveRecord('orders', {
                            ...targetOrder,
                            quantities: updatedQtys,
                            updatedAt: new Date().toISOString()
                        });
                    } else {
                        const cleanQtys = {};
                        Object.entries(itemUpdates).forEach(([itemId, q]) => {
                            if (q > 0) cleanQtys[itemId] = q;
                        });
                        if (Object.keys(cleanQtys).length > 0) {
                            await dbSaveRecord('orders', {
                                id: 'ORD-' + Date.now() + '-' + branchId,
                                branchId,
                                branchName: branchObj ? branchObj.name : branchId,
                                destinationId: targetDestId,
                                destinationName: targetDestObj ? targetDestObj.name : 'Central Factory',
                                requestDate: matrixFilter.date,
                                deliveryDate: matrixFilter.date,
                                status: 'Submitted',
                                quantities: cleanQtys,
                                updatedAt: new Date().toISOString()
                            });
                        }
                    }
                }

                matrixPendingEdits = {};
                renderOrderMatrixView(container);
                showToast('All double-click matrix modifications saved to database!', 'success');
            });

            // Excel Export of Consolidated Matrix
            document.getElementById('btn-matrix-excel').addEventListener('click', () => {
                const rows = filteredItems.map(item => {
                    const row = {
                        'Item Code': item.code,
                        'Item Name': item.name,
                        'Unit': item.unit
                    };
                    let sum = 0;
                    branches.forEach(b => {
                        const q = cellMatrix[b.id]?.[item.id] || 0;
                        row[b.name] = q;
                        sum += q;
                    });
                    row['Total Order'] = sum;
                    return row;
                });

                const ws = XLSX.utils.json_to_sheet(rows);
                const wb = XLSX.utils.book_new();
                XLSX.utils.book_append_sheet(wb, ws, 'Order Matrix');
                XLSX.writeFile(wb, `Order_Matrix_${matrixFilter.date}.xlsx`);
                showToast('Consolidated Matrix exported to Excel!', 'success');
            });

            // PDF Export of Consolidated Matrix
            document.getElementById('btn-matrix-pdf').addEventListener('click', () => {
                const { jsPDF } = window.jspdf;
                const docPdf = new jsPDF('landscape');
                const destName = matrixFilter.destinationId === 'ALL'
                    ? 'All Destinations'
                    : (destinations.find(d => d.id === matrixFilter.destinationId)?.name || '');

                docPdf.setFontSize(14);
                docPdf.text(`Consolidated Factory & Warehouse Order Matrix (${matrixFilter.date})`, 14, 15);
                docPdf.setFontSize(10);
                docPdf.text(`Destination: ${destName}`, 14, 21);

                const head = [['Code', 'Item Name', 'Unit', ...branches.map(b => b.name), 'Total']];
                const body = filteredItems.map(item => {
                    let sum = 0;
                    const vals = branches.map(b => {
                        const q = cellMatrix[b.id]?.[item.id] || 0;
                        sum += q;
                        return q > 0 ? q : '-';
                    });
                    return [item.code, item.name, item.unit, ...vals, sum > 0 ? sum : '-'];
                });

                docPdf.autoTable({ head, body, startY: 26, styles: { fontSize: 8 } });
                docPdf.save(`Order_Matrix_${matrixFilter.date}.pdf`);
                showToast('Consolidated Matrix exported to PDF!', 'success');
            });
        }

        // ------------------------------------------------------------
        // 8. BRANCH-WISE DELIVERY CHALLAN & PRINT / EXCEL / PDF
        // ------------------------------------------------------------
        let challanFilter = {
            branchId: '',
            categoryId: 'ALL',
            destinationId: 'ALL',
            deliveryDate: TOMORROW
        };

        function renderDeliveryChallanView(container) {
            const branches = currentUser.role === 'branch' && currentUser.branchId
                ? state.branches.filter(b => b.id === currentUser.branchId)
                : state.branches;
            const categories = state.categories;
            const destinations = state.destinations;

            if ((!challanFilter.branchId || !branches.some(b => b.id === challanFilter.branchId)) && branches.length > 0) {
                challanFilter.branchId = branches[0].id;
            }

            const selectedBranch = branches.find(b => b.id === challanFilter.branchId);
            const selectedCategory = categories.find(c => c.id === challanFilter.categoryId);
            const selectedDest = destinations.find(d => d.id === challanFilter.destinationId);

            // Aggregate quantities for this branch + date + destination
            const matchingOrders = state.orders.filter(o =>
                o.branchId === challanFilter.branchId &&

                        </div>
                        <div class="divide-y divide-slate-100">
                            ${state.branches.map(b => `
                                <div class="p-4 flex items-center justify-between hover:bg-slate-50 transition">
                                    <div>
                                        <div class="font-bold text-sm text-slate-900">${b.name} <span class="ml-1.5 font-mono text-xs bg-slate-100 px-2 py-0.5 rounded text-slate-600">${b.code}</span></div>
                                        <div class="text-xs text-slate-500 mt-0.5">${b.address || 'No address specified'}</div>
                                    </div>
                                    <div class="flex items-center gap-1">
                                        <button onclick="openBranchModal('${b.id}')" class="p-1.5 text-slate-400 hover:text-blue-600 rounded-lg transition"><i data-lucide="edit-2" class="w-4 h-4"></i></button>
                                        <button onclick="deleteBranch('${b.id}')" class="p-1.5 text-slate-400 hover:text-rose-600 rounded-lg transition"><i data-lucide="trash-2" class="w-4 h-4"></i></button>
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    </div>

                    <!-- Destinations (Factory, Warehouse, Frozen Warehouse) -->
                    <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
                        <div class="p-5 border-b border-slate-200 flex items-center justify-between bg-slate-50">
                            <div>
                                <h3 class="font-bold text-slate-900">Factories & Warehouses</h3>
                                <p class="text-xs text-slate-500">Fulfillment destinations (Factory, Warehouse, Frozen WH)</p>
                            </div>
                            <button onclick="openDestinationModal()" class="px-3.5 py-2 bg-blue-600 hover:bg-blue-700 text-white font-semibold rounded-xl text-xs transition flex items-center gap-1">
                                <i data-lucide="plus" class="w-4 h-4"></i> Add Destination
                            </button>
                        </div>
                        <div class="divide-y divide-slate-100">
                            ${state.destinations.map(d => `
                                <div class="p-4 flex items-center justify-between hover:bg-slate-50 transition">
                                    <div>
                                        <div class="font-bold text-sm text-slate-900">${d.name}</div>
                                        <span class="inline-block mt-1 px-2.5 py-0.5 bg-blue-50 text-blue-700 rounded-full text-[11px] font-bold">${d.type}</span>
                                    </div>
                                    <div class="flex items-center gap-1">
                                        <button onclick="openDestinationModal('${d.id}')" class="p-1.5 text-slate-400 hover:text-blue-600 rounded-lg transition"><i data-lucide="edit-2" class="w-4 h-4"></i></button>
                                        <button onclick="deleteDestination('${d.id}')" class="p-1.5 text-slate-400 hover:text-rose-600 rounded-lg transition"><i data-lucide="trash-2" class="w-4 h-4"></i></button>
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                </div>
            `;
        }

        window.openBranchModal = function(branchId = null) {
            const existing = branchId ? state.branches.find(b => b.id === branchId) : null;
            openModal({
                title: existing ? 'Modify Branch' : 'Add New Restaurant Branch',
                confirmText: existing ? 'Update Branch' : 'Save Branch',
                bodyHtml: `
                    <div class="space-y-4">
                        <div>
                            <label class="block text-xs font-bold uppercase text-slate-500 mb-1">Branch Name</label>
                            <input type="text" id="modal-br-name" value="${existing ? existing.name : ''}" placeholder="e.g. Branch 4 - Uttara" class="w-full px-3.5 py-2 bg-slate-50 border border-slate-300 rounded-xl text-sm font-semibold outline-none focus:ring-2 focus:ring-blue-600">
                        </div>
                        <div>
                            <label class="block text-xs font-bold uppercase text-slate-500 mb-1">Short Code</label>
                            <input type="text" id="modal-br-code" value="${existing ? existing.code : ''}" placeholder="e.g. UTT" class="w-full px-3.5 py-2 bg-slate-50 border border-slate-300 rounded-xl text-sm font-mono font-bold uppercase outline-none focus:ring-2 focus:ring-blue-600">
                        </div>
                        <div>
                            <label class="block text-xs font-bold uppercase text-slate-500 mb-1">Location Address</label>
                            <input type="text" id="modal-br-addr" value="${existing ? existing.address : ''}" placeholder="Sector 7, Uttara" class="w-full px-3.5 py-2 bg-slate-50 border border-slate-300 rounded-xl text-sm outline-none focus:ring-2 focus:ring-blue-600">
                        </div>
                    </div>
                `,
                onConfirm: async () => {
                    const name = document.getElementById('modal-br-name').value.trim();
                    const code = document.getElementById('modal-br-code').value.trim().toUpperCase();
                    const address = document.getElementById('modal-br-addr').value.trim();
                    if (!name || !code) return showToast('Branch name and code are required.', 'error');
                    const id = existing ? existing.id : ('BR-' + Date.now());
                    await dbSaveRecord('branches', { id, name, code, address });
                    closeModal();
                    renderCurrentRoute();
                    showToast(existing ? 'Branch updated!' : 'Branch added!', 'success');
                }
            });
        };

        window.deleteBranch = async function(id) {
            await dbDeleteRecord('branches', id);
            renderCurrentRoute();
            showToast('Branch removed.', 'info');
        };

        window.openDestinationModal = function(destId = null) {
            const existing = destId ? state.destinations.find(d => d.id === destId) : null;
            openModal({
                title: existing ? 'Modify Destination' : 'Add Factory / Warehouse',
                confirmText: existing ? 'Update' : 'Save',
                bodyHtml: `
                    <div class="space-y-4">
                        <div>
                            <label class="block text-xs font-bold uppercase text-slate-500 mb-1">Destination Name</label>
                            <input type="text" id="modal-dst-name" value="${existing ? existing.name : ''}" placeholder="e.g. Cold Storage Hub 2" class="w-full px-3.5 py-2 bg-slate-50 border border-slate-300 rounded-xl text-sm font-semibold outline-none focus:ring-2 focus:ring-blue-600">
                        </div>
                        <div>
                            <label class="block text-xs font-bold uppercase text-slate-500 mb-1">Facility Type</label>
                            <select id="modal-dst-type" class="w-full px-3.5 py-2 bg-slate-50 border border-slate-300 rounded-xl text-sm font-semibold outline-none focus:ring-2 focus:ring-blue-600">
                                <option value="Factory" ${existing?.type === 'Factory' ? 'selected' : ''}>Factory</option>
                                <option value="Warehouse" ${existing?.type === 'Warehouse' ? 'selected' : ''}>Warehouse</option>
                                <option value="Frozen Warehouse" ${existing?.type === 'Frozen Warehouse' ? 'selected' : ''}>Frozen Warehouse</option>
                            </select>
                        </div>
                    </div>
                `,
                onConfirm: async () => {
                    const name = document.getElementById('modal-dst-name').value.trim();
                    const type = document.getElementById('modal-dst-type').value;
                    if (!name) return showToast('Destination name is required.', 'error');
                    const id = existing ? existing.id : ('DST-' + Date.now());
                    await dbSaveRecord('destinations', { id, name, type });
                    closeModal();
                    renderCurrentRoute();
                    showToast(existing ? 'Destination updated!' : 'Destination added!', 'success');
                }
            });
        };

        window.deleteDestination = async function(id) {
            await dbDeleteRecord('destinations', id);
            renderCurrentRoute();
            showToast('Destination removed.', 'info');
        };

        // ------------------------------------------------------------
        // 11. MASTER SETUP: USERS & ACCESS CONTROL
        // ------------------------------------------------------------
        function renderMasterUsersView(container) {
            container.innerHTML = `
                <div class="max-w-5xl mx-auto bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
                    <div class="p-6 border-b border-slate-200 flex items-center justify-between bg-slate-50">
                        <div>
                            <h3 class="text-lg font-bold text-slate-900">System Users & Branch Logins</h3>
                            <p class="text-xs text-slate-500">Assign unique username & password for each branch, factory, or warehouse user</p>
                        </div>
                        <button onclick="openUserModal()" class="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white font-semibold rounded-xl text-sm transition flex items-center gap-1.5 shadow-sm">
                            <i data-lucide="user-plus" class="w-4 h-4"></i> Add New User
                        </button>
                    </div>
                    <div class="overflow-x-auto">
                        <table class="w-full text-left border-collapse">
                            <thead>
                                <tr class="bg-slate-50 border-b border-slate-200 text-xs font-bold text-slate-500 uppercase tracking-wider">
                                    <th class="py-3.5 px-4">Username</th>
                                    <th class="py-3.5 px-4">Password</th>
                                    <th class="py-3.5 px-4">Full Name</th>
                                    <th class="py-3.5 px-4">Role</th>
                                    <th class="py-3.5 px-4">Assigned Branch / Facility</th>
                                    <th class="py-3.5 px-4 text-right">Actions</th>
                                </tr>
                            </thead>
                            <tbody class="divide-y divide-slate-100 text-sm">
                                ${state.users.map(u => {
                                    const br = state.branches.find(b => b.id === u.branchId);
                                    const dst = state.destinations.find(d => d.id === u.destinationId);
                                    const assigned = br ? br.name : (dst ? dst.name : 'All Access');
                                    return `
                                        <tr class="hover:bg-slate-50 transition">
                                            <td class="py-3 px-4 font-mono font-bold text-blue-600">${u.username}</td>
                                            <td class="py-3 px-4 font-mono text-slate-500">${u.password}</td>
                                            <td class="py-3 px-4 font-semibold text-slate-900">${u.fullName}</td>
                                            <td class="py-3 px-4"><span class="px-2.5 py-0.5 bg-slate-100 text-slate-700 rounded-full text-xs font-bold uppercase">${u.role.replace('_', ' ')}</span></td>
                                            <td class="py-3 px-4 text-slate-700 font-medium">${assigned}</td>
                                            <td class="py-3 px-4 text-right space-x-1">
                                                <button onclick="openUserModal('${u.id}')" class="p-1.5 text-slate-400 hover:text-blue-600 rounded-lg transition"><i data-lucide="edit-2" class="w-4 h-4"></i></button>
                                                ${u.username !== 'admin' ? `<button onclick="deleteUser('${u.id}')" class="p-1.5 text-slate-400 hover:text-rose-600 rounded-lg transition"><i data-lucide="trash-2" class="w-4 h-4"></i></button>` : ''}
                                            </td>
                                        </tr>
                                    `;
                                }).join('')}
                            </tbody>
                        </table>
                    </div>
                </div>
            `;
        }

        window.openUserModal = function(userId = null) {
            const existing = userId ? state.users.find(u => u.id === userId) : null;
            openModal({
                title: existing ? 'Modify User Account' : 'Create Branch / Warehouse User',
                confirmText: existing ? 'Update User' : 'Create User',
                bodyHtml: `
                    <div class="space-y-3.5">
                        <div class="grid grid-cols-2 gap-3">
                            <div>
                                <label class="block text-xs font-bold uppercase text-slate-500 mb-1">Username</label>
                                <input type="text" id="modal-u-uname" value="${existing ? existing.username : ''}" placeholder="e.g. branch4" class="w-full px-3.5 py-2 bg-slate-50 border border-slate-300 rounded-xl text-sm font-mono font-bold outline-none focus:ring-2 focus:ring-blue-600">
                            </div>
                            <div>
                                <label class="block text-xs font-bold uppercase text-slate-500 mb-1">Password</label>
                                <input type="text" id="modal-u-pwd" value="${existing ? existing.password : '1234'}" class="w-full px-3.5 py-2 bg-slate-50 border border-slate-300 rounded-xl text-sm font-mono outline-none focus:ring-2 focus:ring-blue-600">
                            </div>
                        </div>
                        <div>
                            <label class="block text-xs font-bold uppercase text-slate-500 mb-1">Full Name</label>
                            <input type="text" id="modal-u-fname" value="${existing ? existing.fullName : ''}" placeholder="e.g. Uttara Branch Manager" class="w-full px-3.5 py-2 bg-slate-50 border border-slate-300 rounded-xl text-sm font-semibold outline-none focus:ring-2 focus:ring-blue-600">
                        </div>
                        <div>
                            <label class="block text-xs font-bold uppercase text-slate-500 mb-1">Access Role</label>
                            <select id="modal-u-role" class="w-full px-3.5 py-2 bg-slate-50 border border-slate-300 rounded-xl text-sm font-semibold outline-none focus:ring-2 focus:ring-blue-600">
                                <option value="branch" ${existing?.role === 'branch' ? 'selected' : ''}>Branch User (Order Request Form)</option>
                                <option value="factory_warehouse" ${existing?.role === 'factory_warehouse' ? 'selected' : ''}>Factory / Warehouse User (Matrix & Delivery)</option>
                                <option value="admin" ${existing?.role === 'admin' ? 'selected' : ''}>Administrator (Full Access)</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-xs font-bold uppercase text-slate-500 mb-1">Assigned Branch (Required for Branch User)</label>
                            <select id="modal-u-branch" class="w-full px-3.5 py-2 bg-slate-50 border border-slate-300 rounded-xl text-sm font-semibold outline-none focus:ring-2 focus:ring-blue-600">
                                <option value="">-- None / Central --</option>
                                ${state.branches.map(b => `<option value="${b.id}" ${existing?.branchId === b.id ? 'selected' : ''}>${b.name}</option>`).join('')}
                            </select>
                        </div>
                        <div>
                            <label class="block text-xs font-bold uppercase text-slate-500 mb-1">Assigned Factory/Warehouse (Optional)</label>
                            <select id="modal-u-dest" class="w-full px-3.5 py-2 bg-slate-50 border border-slate-300 rounded-xl text-sm font-semibold outline-none focus:ring-2 focus:ring-blue-600">
                                <option value="">-- All Facilities --</option>
                                ${state.destinations.map(d => `<option value="${d.id}" ${existing?.destinationId === d.id ? 'selected' : ''}>${d.name}</option>`).join('')}
                            </select>
                        </div>
                    </div>
                `,
                onConfirm: async () => {
                    const username = document.getElementById('modal-u-uname').value.trim().toLowerCase();
                    const password = document.getElementById('modal-u-pwd').value.trim();
                    const fullName = document.getElementById('modal-u-fname').value.trim();
                    const role = document.getElementById('modal-u-role').value;
                    const branchId = role === 'branch' ? document.getElementById('modal-u-branch').value : '';
                    const destinationId = role === 'factory_warehouse' ? document.getElementById('modal-u-dest').value : '';

                    if (!username || !password || !fullName) {
                        return showToast('Username, password, and full name are required.', 'error');
                    }
                    if (role === 'branch' && !branchId) {
                        return showToast('Please assign a Branch for a Branch User.', 'error');
                    }
                    const id = existing ? existing.id : ('USR-' + Date.now());
                    await dbSaveRecord('users', { id, username, password, fullName, role, branchId, destinationId });
                    closeModal();
                    renderCurrentRoute();
                    showToast(existing ? 'User updated!' : 'New user created!', 'success');
                }
            });
        };

        window.deleteUser = async function(id) {
            await dbDeleteRecord('users', id);
            renderCurrentRoute();
            showToast('User deleted.', 'info');
        };

        // Initialize application on page load
        window.addEventListener('DOMContentLoaded', () => {
            lucide.createIcons();
            initHybridDatabase();
        });
    </script>
</body>
</html>
