    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f5f9;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 9999px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }

        .excel-grid th, .excel-grid td {
            border: 1px solid #cbd5e1;
        }
        .excel-cell-editable {
            cursor: cell;
            user-select: none;
            transition: background-color 0.12s ease;
        }
        .excel-cell-editable:hover {
            background-color: #ecfdf5;
            outline: 1px solid #10b981;
            outline-offset: -1px;
        }
        .excel-cell-editing {
            padding: 0 !important;
            background-color: #ffffff !important;
            outline: 2px solid #059669 !important;
            outline-offset: -2px;
        }

        .challan-sheet {
            break-after: page;
            page-break-after: always;
        }
        .challan-sheet:last-child {
            break-after: auto;
            page-break-after: auto;
        }

        @media print {
            body * {
                visibility: hidden !important;
            }
            #printable-challan, #printable-challan * {
                visibility: visible !important;
            }
            #printable-challan {
                position: static !important;
                left: 0 !important;
                top: 0 !important;
                width: 100% !important;
                margin: 0 !important;
                padding: 0 !important;
                box-shadow: none !important;
                border: none !important;
                background: white !important;
            }
            .challan-sheet {
                box-shadow: none !important;
                border: 1px solid #cbd5e1 !important;
                margin-bottom: 0 !important;
                padding: 20px !important;
                break-after: page !important;
                page-break-after: always !important;
            }
            .challan-sheet:last-child {
                break-after: auto !important;
                page-break-after: auto !important;
            }
            .no-print {
                display: none !important;
            }
        }
    </style>
</head>

    <!-- ==================== APPLICATION SCRIPT ==================== -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-app.js";
        import { getAnalytics } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-analytics.js";
        import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-auth.js";
        import {
            getFirestore,
            collection,
            doc,
            setDoc,
            getDocs,
            deleteDoc
        } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCw7brFS62KnSPy7m6Pfpj34A24NXA5qv8",
            authDomain: "kty-store-order-cf0ae.firebaseapp.com",
            projectId: "kty-store-order-cf0ae",
            storageBucket: "kty-store-order-cf0ae.firebasestorage.app",
            messagingSenderId: "567340585940",
            appId: "1:567340585940:web:cfd8de452dc562ec217c41",
            measurementId: "G-NH25J77GLR"
        };

        let firebaseApp = null;
        let analytics = null;
        let auth = null;
        let firestoreDb = null;

        try {
            firebaseApp = initializeApp(firebaseConfig);
            auth = getAuth(firebaseApp);
            firestoreDb = getFirestore(firebaseApp);
            try {
                analytics = getAnalytics(firebaseApp);
            } catch (e) {
                analytics = null;
            }
        } catch (err) {
            console.warn('Firebase initialization fallback:', err);
        }

        async function ensureFirebaseAuth() {
            if (!auth) return;
            try {
                await signInAnonymously(auth);
            } catch (e) {
                // Sandboxed preview or offline fallback
            }
        }

        window.escapeHtml = function(str) {
            if (str === null || str === undefined) return '';
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        };

        window.escapeAttr = function(str) {
            if (str === null || str === undefined) return '';
            return String(str)
                .replace(/\\/g, '\\\\')
                .replace(/'/g, "\\'")
                .replace(/"/g, '&quot;');
        };

        async function hashPassword(plainText) {
            try {
                if (window.crypto && window.crypto.subtle) {
                    const encoder = new TextEncoder();
                    const data = encoder.encode(String(plainText) + '_KTY_SALT_2026');
                    const hashBuffer = await crypto.subtle.digest('SHA-256', data);
                    const hashArray = Array.from(new Uint8Array(hashBuffer));
                    return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
                }
            } catch (e) {}
            return 'plain_' + String(plainText);
        }

        function getLocalToday() {
            const now = new Date();
            const offset = now.getTimezoneOffset() * 60000;
            return new Date(now.getTime() - offset).toISOString().split('T')[0];
        }

        function getLocalOffsetDate(daysOffset = 1) {
            const now = new Date();
            const offset = now.getTimezoneOffset() * 60000;
            return new Date(now.getTime() - offset + daysOffset * 86400000).toISOString().split('T')[0];
        }

        const TODAY = getLocalToday();
        const TOMORROW = getLocalOffsetDate(1);
        const MONTH_NAMES = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];

        const ROLE_CATALOG = [
            { id: 'admin', label: 'Administrator' },
            { id: 'branch', label: 'Branch User' },
            { id: 'factory_warehouse', label: 'Destination / Warehouse User' },
            { id: 'auditor', label: 'Viewer / Auditor' }
        ];

        const SYSTEM_MENU_REGISTRY = [
            {
                id: 'order-transaction',
                label: 'Order Transaction',
                icon: 'arrow-left-right',
                children: [
                    { id: 'order-form', label: 'Stock Transfer Order Form', icon: 'clipboard-edit', defaultViewRoles: ['admin', 'branch'], defaultEditRoles: ['admin', 'branch'] },
                    { id: 'my-orders', label: 'Branch Order History', icon: 'history', defaultViewRoles: ['admin', 'branch', 'factory_warehouse', 'auditor'], defaultEditRoles: ['admin'] },
                    { id: 'order-matrix', label: 'Consolidated Order Matrix', icon: 'table-2', defaultViewRoles: ['admin', 'factory_warehouse', 'auditor'], defaultEditRoles: ['admin', 'factory_warehouse'] },
                    { id: 'delivery-challan', label: 'Delivery Challan & Print', icon: 'printer', defaultViewRoles: ['admin', 'factory_warehouse', 'auditor'], defaultEditRoles: ['admin', 'factory_warehouse'] }
                ]
            },
            {
                id: 'production',
                label: 'Production',
                icon: 'factory',
                children: [
                    { id: 'production-sheet', label: 'Daily Production Sheet', icon: 'calendar-range', defaultViewRoles: ['admin', 'factory_warehouse', 'auditor'], defaultEditRoles: ['admin', 'factory_warehouse'] },
                    { id: 'production-reports', label: 'Production Reports', icon: 'bar-chart-3', defaultViewRoles: ['admin', 'factory_warehouse', 'auditor'], defaultEditRoles: ['admin', 'factory_warehouse'] }
                ]
            },
            {
                id: 'app-settings',
                label: 'App Settings',
                icon: 'sliders-horizontal',
                children: [
                    { id: 'master-items', label: 'Categories & Item Master', icon: 'package', defaultViewRoles: ['admin', 'auditor'], defaultEditRoles: ['admin'] },
                    { id: 'master-locations', label: 'Branches & Destinations', icon: 'building-2', defaultViewRoles: ['admin', 'auditor'], defaultEditRoles: ['admin'] },
                    { id: 'master-users', label: 'User Accounts & Roles', icon: 'users', defaultViewRoles: ['admin'], defaultEditRoles: ['admin'] },
                    { id: 'system-settings', label: 'Company & System Information', icon: 'settings', defaultViewRoles: ['admin'], defaultEditRoles: ['admin'] }
                ]
            }
        ];

        function getAllScreenIds() {
            return SYSTEM_MENU_REGISTRY.flatMap(g => g.children.map(c => c.id));
        }

        function getUserRolesList(user) {
            if (!user) return [];
            if (Array.isArray(user.roles) && user.roles.length > 0) {
                return Array.from(new Set(user.roles));
            }
            return user.role ? [user.role] : ['branch'];
        }

        function buildDefaultPermissionsForRoles(rolesInput) {
            const roles = Array.isArray(rolesInput) && rolesInput.length > 0 ? rolesInput : ['branch'];
            const isAdmin = roles.includes('admin');
            const perms = {};

            SYSTEM_MENU_REGISTRY.forEach(group => {
                group.children.forEach(sub => {
                    const canView = isAdmin || roles.some(r => sub.defaultViewRoles.includes(r));
                    const canEdit = isAdmin || (canView && roles.some(r => sub.defaultEditRoles.includes(r)));
                    perms[sub.id] = { view: canView, edit: canView && canEdit };
                });
            });
            return perms;
        }

        function resolveUserPermissions(user) {
            const allIds = getAllScreenIds();
            if (!user) return {};
            const roles = getUserRolesList(user);
            const base = buildDefaultPermissionsForRoles(roles);
            const custom = user.permissions && typeof user.permissions === 'object' ? user.permissions : {};
            const resolved = {};

            allIds.forEach(id => {
                const rawEntry = custom[id];
                if (typeof rawEntry === 'boolean') {
                    resolved[id] = { view: rawEntry, edit: rawEntry && roles.includes('admin') };
                } else if (rawEntry && typeof rawEntry === 'object') {
                    const canView = rawEntry.view !== undefined ? Boolean(rawEntry.view) : Boolean(base[id]?.view);
                    const canEdit = rawEntry.edit !== undefined ? Boolean(rawEntry.edit) : Boolean(base[id]?.edit);
                    resolved[id] = {
                        view: canView,
                        edit: canView && canEdit
                    };
                } else {
                    resolved[id] = {
                        view: Boolean(base[id]?.view),
                        edit: Boolean(base[id]?.edit)
                    };
                }
            });

            return resolved;
        }

        function canViewScreen(screenId, user = currentUser) {
            if (!user) return false;
            const perms = resolveUserPermissions(user);
            return Boolean(perms[screenId]?.view);
        }

        function canEditScreen(screenId, user = currentUser) {
            if (!user) return false;
            const perms = resolveUserPermissions(user);
            return Boolean(perms[screenId]?.view && perms[screenId]?.edit);
        }

        function requireEditPermission(screenId, actionLabel = 'modify data') {
            if (!canEditScreen(screenId)) {
                showToast(`Access Denied: You do not have permission to ${actionLabel}.`, 'warning');
                return false;
            }
            return true;
        }

        // Helper excluding "Daily Bread Orders" and "Warehouse Orders" from production modules
        function isExcludedProductionCategory(catOrName) {
            const rawName = typeof catOrName === 'string'
                ? catOrName
                : (catOrName && catOrName.name ? catOrName.name : '');
            const norm = String(rawName)
                .toLowerCase()
                .replace(/[^a-z0-9\s]/g, ' ')
                .replace(/\s+/g, ' ')
                .trim();
            if (!norm) return false;
            return (
                norm === 'daily bread orders' ||
                norm === 'daily bread order' ||
                norm === 'warehouse orders' ||
                norm === 'warehouse order' ||
                norm.includes('daily bread order') ||
                norm.includes('warehouse order')
            );
        }

        function getProductionEligibleCategories() {
            return (state.categories || []).filter(c => !isExcludedProductionCategory(c));
        }

        function getProductionEligibleCategoryIds() {
            return new Set(getProductionEligibleCategories().map(c => c.id));
        }

        const DEFAULT_SETTINGS = {
            id: 'MAIN_SETTINGS',
            softwareName: 'StockTransfer ERP',
            companyName: 'Enterprise Food & Supply Co.',
            tagline: 'Central Kitchen, Factory & Branch Inventory Transfer System',
            address: 'Head Office & Central Warehouse',
            phone: '',
            email: '',
            taxId: '',
            logoDataUrl: ''
        };

        const CLEAN_DEFAULT_DATA = {
            settings: { ...DEFAULT_SETTINGS },
            branches: [],
            destinations: [],
            categories: [],
            items: [],
            users: [],
            orders: [],
            productionEntries: {}
        };

        const STORAGE_KEY = 'kty_store_order_secure_v15';
        let state = JSON.parse(JSON.stringify(CLEAN_DEFAULT_DATA));

        async function ensureDefaultAdmin() {
            if (!state.users || state.users.length === 0) {
                const defaultHash = await hashPassword('1234');
                const adminUser = {
                    id: 'USR-01',
                    username: 'admin',
                    passwordHash: defaultHash,
                    fullName: 'System Administrator',
                    role: 'admin',
                    roles: ['admin'],
                    branchId: '',
                    destinationId: '',
                    permissions: buildDefaultPermissionsForRoles(['admin'])
                };
                state.users = [adminUser];
                saveToLocalStorage();
                if (firestoreDb) {
                    try {
                        await setDoc(doc(firestoreDb, 'users', adminUser.id), adminUser);
                    } catch (e) {}
                }
            }
        }

        function loadFromLocalStorage() {
            try {
                const raw = localStorage.getItem(STORAGE_KEY);
                if (raw) {
                    const parsed = JSON.parse(raw);
                    state = {
                        settings: { ...DEFAULT_SETTINGS, ...(parsed.settings || {}) },
                        branches: Array.isArray(parsed.branches) ? parsed.branches : [],
                        destinations: Array.isArray(parsed.destinations) ? parsed.destinations : [],
                        categories: Array.isArray(parsed.categories) ? parsed.categories : [],
                        items: (Array.isArray(parsed.items) ? parsed.items : []).map(it => ({
                            status: 'Active',
                            conversionDirection: 'down',
                            conversionFactor: 1,
                            altUnit: '',
                            ...it
                        })),
                        users: (Array.isArray(parsed.users) ? parsed.users : []).map(u => ({
                            ...u,
                            roles: Array.isArray(u.roles) && u.roles.length > 0 ? u.roles : [u.role || 'branch']
                        })),
                        orders: Array.isArray(parsed.orders) ? parsed.orders : [],
                        productionEntries: parsed.productionEntries && typeof parsed.productionEntries === 'object' ? parsed.productionEntries : {}
                    };
                }
            } catch (e) {
                console.warn('Local storage load fallback:', e);
            }
        }

        function saveToLocalStorage() {
            try {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
            } catch (e) {}
        }

        async function initHybridDatabase() {
            loadFromLocalStorage();
            await ensureDefaultAdmin();
            applyCompanyBranding();
            checkExistingSession();

            if (!firestoreDb) return;

            await ensureFirebaseAuth();
            const collections = ['branches', 'destinations', 'categories', 'items', 'users', 'orders', 'productionEntries'];
            try {
                const settingsSnap = await getDocs(collection(firestoreDb, 'settings'));
                if (!settingsSnap.empty) {
                    const sDoc = settingsSnap.docs[0].data();
                    state.settings = { ...DEFAULT_SETTINGS, ...sDoc };
                }
                for (const colName of collections) {
                    const colRef = collection(firestoreDb, colName);
                    const snap = await getDocs(colRef);
                    if (!snap.empty) {
                        if (colName === 'productionEntries') {
                            const merged = { ...(state.productionEntries || {}) };
                            snap.docs.forEach(d => {
                                const data = d.data();
                                if (data && data.entries && typeof data.entries === 'object') {
                                    merged[d.id] = { ...(merged[d.id] || {}), ...data.entries };
                                } else {
                                    merged[d.id] = { ...(merged[d.id] || {}), ...data };
                                }
                            });
                            state.productionEntries = merged;
                        } else {
                            state[colName] = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                        }
                    }
                }
                state.items = (state.items || []).map(it => ({
                    status: 'Active',
                    conversionDirection: 'down',
                    conversionFactor: 1,
                    altUnit: '',
                    ...it
                }));
                state.users = (state.users || []).map(u => ({
                    ...u,
                    roles: Array.isArray(u.roles) && u.roles.length > 0 ? u.roles : [u.role || 'branch']
                }));
                saveToLocalStorage();
                await ensureDefaultAdmin();
                applyCompanyBranding();
                if (currentUser) {
                    renderTopMenu();
                    renderCurrentRoute();
                }
            } catch (err) {
                console.warn('Firestore sync skipped in preview:', err.message);
            }
        }

        function formatLiveSystemDateTime() {

            const dateStr = now.toLocaleDateString(undefined, { year: 'numeric', month: 'short', day: 'numeric' });

            return `${dayShort}, ${dateStr} • ${timeStr}`;
        }

            const updateEl = () => {

        const INACTIVITY_TIMEOUT_MS = 30 * 60 * 1000;

        function checkExistingSession() {
            try {
                const savedUser = sessionStorage.getItem('kty_active_user');
                const expiry = sessionStorage.getItem('kty_session_expiry');

                if (savedUser && expiry && Date.now() < parseInt(expiry, 10)) {
                    const parsed = JSON.parse(savedUser);
                    if (parsed && parsed.username) {
                        activateAuthenticatedUser(parsed);
                        return;
                    }
                }
            } catch (e) {}

            // Auto-enter clean preview session so sandboxed iframe preview never gets blocked
            const adminUser = state.users && state.users.find(u => u.username === 'admin');
            if (adminUser) {
                activateAuthenticatedUser(adminUser);

            loginForm.addEventListener('submit', async (e) => {
                e.preventDefault();
                const errBox = document.getElementById('login-error-box');
                const errMsg = document.getElementById('login-error-msg');
                if (errBox) errBox.classList.add('hidden');

                if (Date.now() < lockoutUntil) {
                    const secs = Math.ceil((lockoutUntil - Date.now()) / 1000);
                    if (errMsg) errMsg.textContent = `Too many failed attempts. Try again in ${secs}s.`;
                    if (errBox) errBox.classList.remove('hidden');
                    return;
                }

                const uname = (document.getElementById('login-username')?.value || '').trim().toLowerCase();
                const pwd = document.getElementById('login-password')?.value || '';

                if (!uname || !pwd) {
                    if (errMsg) errMsg.textContent = 'Please enter both username and password.';
                    if (errBox) errBox.classList.remove('hidden');
                    return;
                }

                const inputHash = await hashPassword(pwd);
                const matchedUser = (state.users || []).find(u => {
                    if (String(u.username || '').toLowerCase() !== uname) return false;
                    if (u.passwordHash) return u.passwordHash === inputHash;
                    return u.password === pwd;
                });

                if (!matchedUser) {
                    failedAttempts++;
                    if (failedAttempts >= 5) {
                        lockoutUntil = Date.now() + 60000;
                        failedAttempts = 0;
                        if (errMsg) errMsg.textContent = 'Account temporarily locked for 60 seconds due to multiple failed logins.';
                    } else {
                        if (errMsg) errMsg.textContent = 'Invalid username or password. Access denied.';
                    }
                    if (errBox) errBox.classList.remove('hidden');
                    const passInput = document.getElementById('login-password');
                    if (passInput) passInput.value = '';
                    return;
                }

                const uInput = document.getElementById('login-username');
                const pInput = document.getElementById('login-password');
                if (uInput) uInput.value = '';
                if (pInput) pInput.value = '';

                activateAuthenticatedUser(matchedUser);
                showToast(`Welcome, ${matchedUser.fullName}!`, 'success');
            });

            if (!alt || factor <= 0) return '-';
            if (item.conversionDirection === 'up') {
                return `${factor} ${base} = 1 ${alt}`;
            }
            return `1 ${base} = ${factor} ${alt}`;
        }

                                            <th class="py-3 px-3">Code</th>
                                            <th class="py-3 px-4">Item Name</th>
                                            <th class="py-3 px-3">Unit</th>
                                            <th class="py-3 px-3">Conversion</th>
                                            <th class="py-3 px-4 text-right">Quantity</th>
                                        </tr>
                                    </thead>
                                    <tbody class="divide-y text-sm">
                                        ${items.length === 0 ? `
                                            <tr><td colspan="7" class="p-8 text-center text-slate-400 font-medium">No active items found${q ? ` for "<strong>${escapeHtml(orderFormState.searchQuery)}</strong>"` : ''}.</td></tr>
                                        ` : items.map((it, idx) => {
                                            const checked = Boolean(orderFormState.selectedItems[it.id]);
                                            const convText = formatUnitConversion(it);
                                            return `
                                                <tr class="${checked ? 'bg-blue-50/40' : ''}">
                                                    <td class="py-3 px-3 text-center">
                                                        <input type="checkbox" ${!inputsEnabled ? 'disabled' : ''} ${checked ? 'checked' : ''} onchange="toggleOrderItemCheck('${it.id}', this.checked)" class="rounded text-blue-600 w-4 h-4">
                                                    </td>
                                                    <td class="py-3 px-3 text-slate-500 font-mono">${idx + 1}</td>
                                                    <td class="py-3 px-3 font-mono font-bold">${escapeHtml(it.code)}</td>
                                                    <td class="py-3 px-4 font-semibold">${escapeHtml(it.name)}</td>
                                                    <td class="py-3 px-3"><span class="px-2 py-0.5 bg-slate-100 text-xs font-bold rounded">${escapeHtml(it.unit)}</span></td>
                                                    <td class="py-3 px-3 text-xs font-medium text-indigo-700">${escapeHtml(convText)}</td>
                                                    <td class="py-3 px-4 text-right">
                                                        <input type="number" min="0" step="any" data-item="${it.id}" ${!inputsEnabled ? 'disabled' : ''} value="${orderFormState.quantities[it.id] || ''}" oninput="updateQty('${it.id}', this.value)" class="w-28 px-3 py-1.5 text-right border rounded-xl font-bold">
                                                    </td>
                                                </tr>
                                            `;
                                        }).join('')}
                                    </tbody>
                                </table>
                            </div>
                        `}
                    </div>
                </div>
            `;

            const bEl = document.getElementById('f-branch');
            const dEl = document.getElementById('f-dest');
            const rEl = document.getElementById('f-req');
            const delEl = document.getElementById('f-del');
            const cEl = document.getElementById('f-cat');
            const sEl = document.getElementById('f-item-search');

            if (bEl) bEl.onchange = e => { orderFormState.branchId = e.target.value; };
            if (dEl) dEl.onchange = e => { orderFormState.destinationId = e.target.value; };
            if (rEl) rEl.onchange = e => { orderFormState.requestDate = e.target.value; };
            if (delEl) delEl.onchange = e => { orderFormState.deliveryDate = e.target.value; };
            if (cEl) cEl.onchange = e => {
                orderFormState.catIdx = parseInt(e.target.value, 10) || 0;
                renderOrderFormView(container);
                try { lucide.createIcons(); } catch (err) {}
            };
            if (sEl) {
                sEl.addEventListener('input', e => {
                    orderFormState.searchQuery = e.target.value;
                    renderOrderFormView(container);
                    try { lucide.createIcons(); } catch (err) {}
                    const nextSearch = document.getElementById('f-item-search');
                    if (nextSearch) {
                        nextSearch.focus();
                        const len = nextSearch.value.length;
                        nextSearch.setSelectionRange(len, len);
                    }
                });
            }
        }

        window.toggleOrderItemCheck = function(itemId, checked) {
            if (!requireEditPermission('order-form', 'select items')) return;
            if (checked) orderFormState.selectedItems[itemId] = true;
            else delete orderFormState.selectedItems[itemId];
            renderOrderFormView(document.getElementById('main-content'));
            try { lucide.createIcons(); } catch (e) {}
        };

        window.toggleCategoryOrderSelection = function(checked) {
            if (!requireEditPermission('order-form', 'select category items')) return;
            const cats = state.categories || [];
            const activeCat = cats[orderFormState.catIdx] || cats[0];
            if (!activeCat) return;
            const catItems = (state.items || []).filter(i => i.categoryId === activeCat.id && isItemActive(i));
            const q = (orderFormState.searchQuery || '').trim().toLowerCase();
            const targetItems = q
                ? catItems.filter(it =>
                    String(it.name || '').toLowerCase().includes(q) ||
                    String(it.code || '').toLowerCase().includes(q) ||
                    String(it.unit || '').toLowerCase().includes(q)
                )
                : catItems;

            targetItems.forEach(it => {
                if (checked) orderFormState.selectedItems[it.id] = true;
                else delete orderFormState.selectedItems[it.id];
            });
            renderOrderFormView(document.getElementById('main-content'));
            try { lucide.createIcons(); } catch (e) {}
        };

        window.clearOrderSearch = function() {
            orderFormState.searchQuery = '';
            renderOrderFormView(document.getElementById('main-content'));
            try { lucide.createIcons(); } catch (e) {}
        };

        window.activateOrderForm = function() {
            if (!requireEditPermission('order-form', 'create a new order')) return;
            orderFormState.isActive = true;
            orderFormState.requestDate = getLocalToday();
            renderOrderFormView(document.getElementById('main-content'));
            try { lucide.createIcons(); } catch (e) {}
            showToast('Form activated for new entry!', 'success');
        };

        window.cancelOrderForm = function() {
            orderFormState.isActive = false;
            orderFormState.quantities = {};
            orderFormState.selectedItems = {};
            orderFormState.searchQuery = '';
            renderOrderFormView(document.getElementById('main-content'));
            try { lucide.createIcons(); } catch (e) {}
            showToast('Order entry cancelled and locked.', 'info');
        };

        window.updateQty = function(itemId, val) {
            if (!canEditScreen('order-form')) return;
            const num = parseFloat(val);
            if (num > 0) {
                orderFormState.quantities[itemId] = num;
                orderFormState.selectedItems[itemId] = true;
            } else {
                delete orderFormState.quantities[itemId];
            }
        };

        window.changeCat = function(dir) {
            orderFormState.catIdx = Math.max(0, Math.min((state.categories || []).length - 1, orderFormState.catIdx + dir));
            renderOrderFormView(document.getElementById('main-content'));
            try { lucide.createIcons(); } catch (e) {}
        };

        window.saveOrderForm = async function() {
            if (!requireEditPermission('order-form', 'submit orders')) return;
            if (!orderFormState.branchId) return showToast('Please select a branch!', 'error');
            if (!orderFormState.destinationId) return showToast('Please select a destination!', 'error');

            const submittedQuantities = {};
            const submittedItemIds = [];
            Object.entries(orderFormState.quantities || {}).forEach(([itemId, qty]) => {
                const it = (state.items || []).find(x => x.id === itemId);
                if (orderFormState.selectedItems[itemId] && Number(qty) > 0 && it && isItemActive(it)) {
                    submittedQuantities[itemId] = Number(qty);
                    submittedItemIds.push(itemId);
                }
            });

            if (submittedItemIds.length === 0) {
                return showToast('Please check item(s) and enter quantities greater than 0 to submit!', 'error');
            }

            const branch = (state.branches || []).find(b => b.id === orderFormState.branchId);
            const dest = (state.destinations || []).find(d => d.id === orderFormState.destinationId);

            let existingOrder = (state.orders || []).find(o => o.branchId === orderFormState.branchId && o.deliveryDate === orderFormState.deliveryDate && o.destinationId === orderFormState.destinationId);

            if (existingOrder) {
                existingOrder.quantities = { ...(existingOrder.quantities || {}), ...submittedQuantities };
                existingOrder.selectedItemIds = Array.from(new Set([...(existingOrder.selectedItemIds || []), ...submittedItemIds]));
                existingOrder.requestDate = orderFormState.requestDate || getLocalToday();
                existingOrder.updatedAt = new Date().toISOString();
                existingOrder.status = 'Submitted';
                await dbSaveRecord('orders', existingOrder);
            } else {
                const record = {
                    id: 'ORD-' + Date.now(),
                    branchId: orderFormState.branchId,
                    branchName: branch ? branch.name : 'Branch',
                    destinationId: orderFormState.destinationId,
                    destinationName: dest ? dest.name : 'Destination',
                    requestDate: orderFormState.requestDate || getLocalToday(),
                    deliveryDate: orderFormState.deliveryDate,
                    status: 'Submitted',
                    quantities: submittedQuantities,
                    selectedItemIds: submittedItemIds,
                    updatedAt: new Date().toISOString()
                };
                await dbSaveRecord('orders', record);
            }

            historyFilterDate = orderFormState.requestDate || getLocalToday();
            historyShowAllDates = false;

            orderFormState.isActive = false;
            orderFormState.quantities = {};
            orderFormState.selectedItems = {};
            orderFormState.searchQuery = '';
            showToast(`Submitted ${submittedItemIds.length} selected item(s) successfully!`, 'success');
            navigateTo('my-orders');
        };

        // ==================== 2. BRANCH ORDER HISTORY ====================
        let historyFilterDate = TODAY;
        let historyShowAllDates = false;

        function renderBranchHistoryView(container) {
            const currentToday = getLocalToday();
            if (!historyFilterDate) historyFilterDate = currentToday;

            const roles = getUserRolesList(currentUser);
            const isBranchScoped = roles.includes('branch') && !roles.includes('admin') && !roles.includes('factory_warehouse') && currentUser?.branchId;

            let baseOrders = state.orders || [];
            if (isBranchScoped) {
                baseOrders = baseOrders.filter(o => o.branchId === currentUser.branchId);
            }

            const visibleOrders = historyShowAllDates
                ? baseOrders
                : baseOrders.filter(o => getOrderHistoryDate(o) === historyFilterDate);

            container.innerHTML = `
                <div class="max-w-6xl mx-auto bg-white rounded-2xl shadow-sm border p-6 space-y-5">
                    <div class="flex flex-wrap items-end justify-between gap-4 pb-4 border-b border-slate-200">
                        <div>
                            <h3 class="text-lg font-bold text-slate-900">Submitted Orders History</h3>
                            <p class="text-xs text-slate-500">Showing orders by date (defaults to current date: <strong>${escapeHtml(currentToday)}</strong>)</p>
                        </div>

                        <div class="flex flex-wrap items-end gap-2.5">
                            <div>
                                <label class="block text-xs font-bold uppercase text-slate-500 mb-1">History Date</label>
                                <input type="date" id="history-date-picker" value="${escapeHtml(historyFilterDate)}" ${historyShowAllDates ? 'disabled' : ''} class="px-3.5 py-2 bg-slate-50 border border-slate-300 rounded-xl text-sm font-bold text-slate-800 focus:ring-2 focus:ring-blue-600 outline-none">
                            </div>
                            <button type="button" onclick="resetHistoryToToday()" class="px-3.5 py-2 bg-blue-50 hover:bg-blue-100 text-blue-700 border border-blue-200 font-bold rounded-xl text-xs transition">
                                Today (${escapeHtml(currentToday)})
                            </button>
                            <label class="inline-flex items-center gap-2 px-3 py-2 bg-slate-50 hover:bg-slate-100 border border-slate-200 rounded-xl text-xs font-bold text-slate-700 cursor-pointer select-none">
                                <input type="checkbox" id="history-all-dates" ${historyShowAllDates ? 'checked' : ''} onchange="toggleHistoryAllDates(this.checked)" class="rounded text-blue-600 w-4 h-4">
                                <span>All Dates</span>
                            </label>
                        </div>
                    </div>

                    <div class="overflow-x-auto">
                        <table class="w-full text-left text-sm border-collapse">
                            <thead>
                                <tr class="bg-slate-100 text-xs font-bold uppercase">
                                    <th class="p-3 border">Order ID</th>
                                    <th class="p-3 border">Order Date</th>
                                    <th class="p-3 border">Branch</th>
                                    <th class="p-3 border">Destination</th>
                                    <th class="p-3 border">Delivery Date</th>
                                    <th class="p-3 border">Items Count</th>
                                    <th class="p-3 border">Status</th>
                                    <th class="p-3 border text-right">Details</th>
                                </tr>
                            </thead>
                            <tbody class="divide-y">
                                ${visibleOrders.length === 0 ? `<tr><td colspan="8" class="p-8 text-center text-slate-400 font-medium">No orders submitted for ${historyShowAllDates ? 'any date' : `<strong>${escapeHtml(historyFilterDate)}</strong>`}.</td></tr>` :
                                    visibleOrders.map(o => {
                                        const itemCount = Object.values(o.quantities || {}).filter(v => Number(v) > 0).length;
                                        const ordDate = getOrderHistoryDate(o);
                                        const badgeClass = o.status === 'Executed for Challan'
                                            ? 'bg-indigo-50 text-indigo-700 border border-indigo-200'
                                            : 'bg-emerald-50 text-emerald-700 border border-emerald-200';
                                        return `
                                            <tr>
                                                <td class="p-3 border font-mono font-bold">${escapeHtml(o.id)}</td>
                                                <td class="p-3 border font-mono text-xs font-bold text-slate-700">${escapeHtml(ordDate)}</td>
                                                <td class="p-3 border font-semibold">${escapeHtml(o.branchName)}</td>
                                                <td class="p-3 border">${escapeHtml(o.destinationName)}</td>
                                                <td class="p-3 border">${escapeHtml(o.deliveryDate)}</td>
                                                <td class="p-3 border font-bold">${itemCount} items</td>
                                                <td class="p-3 border"><span class="px-2.5 py-0.5 ${badgeClass} font-bold rounded-full text-xs">${escapeHtml(o.status)}</span></td>
                                                <td class="p-3 border text-right">
                                                    <button type="button" onclick="viewOrderDetails('${escapeAttr(o.id)}')" class="inline-flex items-center gap-1 text-blue-600 hover:text-blue-800 hover:underline font-bold text-xs">
                                                        <i data-lucide="eye" class="w-3.5 h-3.5"></i> View Items
                                                    </button>
                                                </td>
                                            </tr>
                                        `;
                                    }).join('')}
                            </tbody>
                        </table>
                    </div>
                </div>
            `;

            const datePicker = document.getElementById('history-date-picker');
            if (datePicker) {
                datePicker.onchange = e => {
                    historyFilterDate = e.target.value || getLocalToday();
                    renderBranchHistoryView(container);
                    try { lucide.createIcons(); } catch (err) {}
                };
            }
        }

        window.resetHistoryToToday = function() {
            historyShowAllDates = false;
            historyFilterDate = getLocalToday();
            renderBranchHistoryView(document.getElementById('main-content'));
            try { lucide.createIcons(); } catch (e) {}
        };

        window.toggleHistoryAllDates = function(showAll) {
            historyShowAllDates = Boolean(showAll);
            renderBranchHistoryView(document.getElementById('main-content'));
            try { lucide.createIcons(); } catch (e) {}
        };

        window.viewOrderDetails = function(orderId) {
            const ord = (state.orders || []).find(o => o.id === orderId);
            if (!ord) return;
            const rows = Object.entries(ord.quantities || {})
                .filter(([_, q]) => Number(q) > 0)
                .map(([itemId, q], i) => {
                    const it = (state.items || []).find(x => x.id === itemId);
                    return `<tr>
                        <td class="p-2 border font-mono text-xs">${i + 1}</td>
                        <td class="p-2 border font-mono text-xs">${escapeHtml(it?.code || itemId)}</td>
                        <td class="p-2 border font-semibold text-xs">${escapeHtml(it?.name || 'Unknown Item')}</td>
                        <td class="p-2 border text-xs">${escapeHtml(it?.unit || '')}</td>
                        <td class="p-2 border text-right font-bold text-xs">${q}</td>
                    </tr>`;
                }).join('');

            openModal({
                title: `Order Details: ${ord.branchName} (${ord.deliveryDate})`,
                confirmText: 'Close',
                bodyHtml: `
                    <table class="w-full text-left border">
                        <thead class="bg-slate-100 text-xs font-bold">
                            <tr><th class="p-2 border">Sr</th><th class="p-2 border">Code</th><th class="p-2 border">Item Name</th><th class="p-2 border">Unit</th><th class="p-2 border text-right">Qty</th></tr>
                        </thead>
                        <tbody>${rows || '<tr><td colspan="5" class="p-4 text-center">No items in order.</td></tr>'}</tbody>
                    </table>
                `,
                onConfirm: () => closeModal()
            });
        };

        // ==================== 3. CONSOLIDATED ORDER MATRIX ====================
        let matrixFilterDate = TOMORROW;
        let matrixFilterCatId = 'ALL';

        function getSubmittedDateOrders(targetDate, destFilter = null) {
            return (state.orders || []).filter(o => {
                const hasOrderId = Boolean(o && typeof o.id === 'string' && o.id.trim() !== '');
                const dateMatch = targetDate ? o.deliveryDate === targetDate : true;
                const destMatch = destFilter ? o.destinationId === destFilter : true;
                const hasItems = Object.values(o.quantities || {}).some(q => Number(q) > 0);
                return hasOrderId && dateMatch && destMatch && hasItems;
            });
        }

        function renderOrderMatrixView(container) {
            const canEditMatrix = canEditScreen('order-matrix');
            const roles = getUserRolesList(currentUser);

            const destFilter = (roles.includes('factory_warehouse') && !roles.includes('admin') && currentUser?.destinationId)
                ? currentUser.destinationId
                : null;

            const dateOrders = getSubmittedDateOrders(matrixFilterDate, destFilter);

            const activeBranches = (state.branches || []).filter(b =>
                dateOrders.some(o => o.branchId === b.id)
            );

            const selectedItemIdsForDate = new Set();
            dateOrders.forEach(ord => {
                const explicitIds = Array.isArray(ord.selectedItemIds) ? ord.selectedItemIds : [];
                explicitIds.forEach(id => {
                    if (Number(ord.quantities?.[id]) > 0) selectedItemIdsForDate.add(id);
                });
                Object.entries(ord.quantities || {}).forEach(([id, q]) => {
                    if (Number(q) > 0 && explicitIds.length === 0) selectedItemIdsForDate.add(id);
                });
            });

            const displayedItems = (state.items || []).filter(it => {
                if (!isItemActive(it)) return false;
                if (!selectedItemIdsForDate.has(it.id)) return false;
                if (matrixFilterCatId !== 'ALL' && it.categoryId !== matrixFilterCatId) return false;
                return true;
            });

            container.innerHTML = `
                <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6 space-y-5">
                    <div class="flex flex-wrap items-end justify-between gap-4 pb-4 border-b border-slate-200">
                        <div class="flex flex-wrap items-end gap-4">
                            <div>
                                <label class="block text-xs font-bold uppercase text-slate-500 mb-1">Delivery Date</label>
                                <input type="date" id="matrix-date-filter" value="${matrixFilterDate}" class="px-3.5 py-2 bg-slate-50 border border-slate-300 rounded-xl text-sm font-bold text-slate-800 focus:ring-2 focus:ring-indigo-600 outline-none">
                            </div>
                            <div>
                                <label class="block text-xs font-bold uppercase text-slate-500 mb-1">Category Filter</label>
                                <select id="matrix-cat-filter" class="px-3.5 py-2 bg-slate-50 border border-slate-300 rounded-xl text-sm font-bold text-slate-800 focus:ring-2 focus:ring-indigo-600 outline-none min-w-[200px]">
                                    <option value="ALL">-- All Categories --</option>
                                    ${(state.categories || []).map(c => `<option value="${c.id}" ${c.id === matrixFilterCatId ? 'selected' : ''}>${escapeHtml(c.name)}</option>`).join('')}
                                </select>
                            </div>
                        </div>

                        <div class="flex flex-wrap items-center gap-2">
                            <span class="px-3 py-1.5 bg-slate-100 text-slate-700 border border-slate-200 rounded-xl text-xs font-semibold flex items-center gap-1.5">
                                <i data-lucide="calendar-check" class="w-3.5 h-3.5 text-indigo-600"></i>
                                ${activeBranches.length} Submitted Branch${activeBranches.length === 1 ? '' : 'es'}
                            </span>
                            <button type="button" onclick="exportMatrixToExcel()" class="px-4 py-2 bg-emerald-600 hover:bg-emerald-700 text-white font-semibold rounded-xl text-xs flex items-center gap-1.5 shadow-sm transition">
                                <i data-lucide="file-spreadsheet" class="w-4 h-4"></i> Export Excel
                            </button>
                            <button type="button" onclick="executeOrdersToChallan()" ${!canEditMatrix ? 'disabled' : ''} class="px-4 py-2 ${!canEditMatrix ? 'bg-slate-300 text-slate-500 cursor-not-allowed' : 'bg-indigo-600 hover:bg-indigo-700 text-white shadow-md shadow-indigo-600/25'} font-bold rounded-xl text-xs flex items-center gap-1.5 transition">
                                <i data-lucide="play-circle" class="w-4 h-4"></i> Execute to Delivery Challan
                            </button>
                        </div>
                    </div>

                    <div class="flex items-center justify-between bg-indigo-50/70 border border-indigo-100 px-4 py-2.5 rounded-xl text-xs text-indigo-900">
                        <span class="flex items-center gap-1.5 font-medium">
                            <i data-lucide="mouse-pointer-click" class="w-4 h-4 text-indigo-600 shrink-0"></i>
                            Showing only checked/submitted active items and branches with orders for <strong>${escapeHtml(matrixFilterDate || 'selected date')}</strong>. ${canEditMatrix ? 'Double-click any branch cell to edit (Enter/Tab saves, Esc cancels).' : ''}
                        </span>
                    </div>

                    <div class="overflow-x-auto rounded-xl border border-slate-300 shadow-inner">
                        <table id="consolidated-matrix-table" class="excel-grid w-full text-left text-sm whitespace-nowrap border-collapse">
                            <thead>
                                <tr class="bg-slate-200/90 text-slate-800 font-bold uppercase text-xs select-none">
                                    <th class="py-3 px-3 text-center w-14 bg-slate-200">Sr. No</th>
                                    <th class="py-3 px-3 bg-slate-200">Item Code</th>
                                    <th class="py-3 px-4 bg-slate-200">Item Name</th>
                                    <th class="py-3 px-3 text-center bg-slate-200">Units</th>
                                    ${activeBranches.map(b => {
                                        const ord = dateOrders.find(o => o.branchId === b.id);
                                        return `
                                            <th data-matrix-branch="true" class="py-3 px-4 text-center bg-slate-100 text-slate-900 min-w-[130px]">
                                                <div>${escapeHtml(b.name)}</div>
                                                <div class="text-[10px] font-mono font-semibold text-indigo-600 mt-0.5">${escapeHtml(ord?.id || '')}</div>
                                            </th>
                                        `;
                                    }).join('')}
                                    <th class="py-3 px-4 text-center bg-indigo-100 text-indigo-900 font-extrabold min-w-[120px]">
                                        Total Order
                                    </th>
                                </tr>
                            </thead>
                            <tbody class="divide-y divide-slate-300 bg-white">
                                ${activeBranches.length === 0 || displayedItems.length === 0 ? `
                                    <tr>
                                        <td colspan="${6 + activeBranches.length}" class="p-10 text-center text-slate-400 font-medium">
                                            No checked/submitted active items found for <strong>${escapeHtml(matrixFilterDate || 'this date')}</strong>.
                                        </td>
                                    </tr>
                                ` : displayedItems.map((it, idx) => {
                                    let rowTotal = 0;
                                    const branchCells = activeBranches.map((b, bIdx) => {
                                        const branchOrders = dateOrders.filter(o => o.branchId === b.id);
                                        const q = branchOrders.reduce((sum, ord) => sum + (Number(ord?.quantities?.[it.id]) || 0), 0);
                                        rowTotal += q;

                                        return `
                                            <td 
                                                data-row="${idx}" 
                                                data-col="${bIdx}" 
                                                data-item-id="${it.id}" 
                                                data-branch-id="${b.id}"
                                                ${canEditMatrix ? `ondblclick="startMatrixCellEdit(this)"` : ''}
                                                class="py-2.5 px-3 text-center font-bold ${q > 0 ? 'text-slate-900 bg-emerald-50/40' : 'text-slate-400'} ${canEditMatrix ? 'excel-cell-editable' : ''}"
                                                title="${canEditMatrix ? 'Double-click to edit quantity' : ''}"
                                            >${q > 0 ? q : 0}</td>
                                        `;
                                    }).join('');

                                    return `
                                        <tr class="hover:bg-slate-50/80">
                                            <td class="py-2.5 px-3 text-center font-mono text-xs text-slate-500 bg-slate-50">${idx + 1}</td>
                                            <td class="py-2.5 px-3 font-mono font-bold text-slate-700">${escapeHtml(it.code)}</td>
                                            <td class="py-2.5 px-4 font-semibold text-slate-900">${escapeHtml(it.name)}</td>

        window.startMatrixCellEdit = function(td) {
            if (!canEditScreen('order-matrix')) return;
            if (!td || td.classList.contains('excel-cell-editing')) return;

            const currentVal = parseFloat(td.textContent.trim()) || 0;
            const itemId = td.dataset.itemId;
            const branchId = td.dataset.branchId;
            const rowIdx = parseInt(td.dataset.row, 10);
            const colIdx = parseInt(td.dataset.col, 10);

            td.classList.add('excel-cell-editing');
            td.innerHTML = `<input type="number" min="0" step="any" value="${currentVal}" class="w-full h-full py-2 px-2 text-center font-bold text-blue-700 bg-white outline-none" />`;

            const input = td.querySelector('input');
            if (!input) return;
            input.focus();
            input.select();

            let committed = false;

            const commitChange = async (moveNext = false, reverse = false) => {
                if (committed) return;
                committed = true;

                const newVal = Math.max(0, parseFloat(input.value) || 0);
                td.classList.remove('excel-cell-editing');
                td.textContent = String(newVal);
                if (newVal > 0) {
                    td.classList.remove('text-slate-400');
                    td.classList.add('text-slate-900', 'bg-emerald-50/40');
                } else {
                    td.classList.remove('text-slate-900', 'bg-emerald-50/40');
                    td.classList.add('text-slate-400');
                }

                if (newVal !== currentVal) {
                    await updateBranchOrderFromMatrix(branchId, itemId, newVal);
                }

                const rowCells = document.querySelectorAll(`td[data-item-id="${itemId}"]`);
                let sum = 0;
                rowCells.forEach(c => { sum += (parseFloat(c.textContent.trim()) || 0); });
                const totalCell = document.getElementById(`matrix-row-total-${itemId}`);
                if (totalCell) totalCell.textContent = String(sum);

                if (moveNext) {
                    const totalCols = document.querySelectorAll(`th[data-matrix-branch="true"]`).length || 1;
                    let nextRow = rowIdx;
                    let nextCol = reverse ? colIdx - 1 : colIdx + 1;

                    if (nextCol >= totalCols) {
                        nextCol = 0;
                        nextRow = rowIdx + 1;
                    } else if (nextCol < 0) {
                        nextCol = totalCols - 1;
                        nextRow = rowIdx - 1;
                    }

                    const nextCell = document.querySelector(`td[data-row="${nextRow}"][data-col="${nextCol}"]`);
                    if (nextCell) {
                        startMatrixCellEdit(nextCell);
                    }
                }
            };

            input.addEventListener('keydown', async (e) => {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    await commitChange(false);
                } else if (e.key === 'Tab') {
                    e.preventDefault();
                    await commitChange(true, e.shiftKey);
                } else if (e.key === 'Escape') {
                    committed = true;
                    td.classList.remove('excel-cell-editing');
                    td.textContent = String(currentVal);
                }
            });

            input.addEventListener('blur', async () => {
                await commitChange(false);
            });
        };

        async function updateBranchOrderFromMatrix(branchId, itemId, newQty) {
            const targetDate = matrixFilterDate || getLocalToday();
            const branch = (state.branches || []).find(b => b.id === branchId);
            const destId = (currentUser?.destinationId)
                ? currentUser.destinationId
                : ((state.destinations && state.destinations[0] && state.destinations[0].id) || 'DST-01');
            const dest = (state.destinations || []).find(d => d.id === destId);

            const matchingOrders = (state.orders || []).filter(o => o.branchId === branchId && o.deliveryDate === targetDate);

            if (matchingOrders.length > 0) {
                const primaryOrder = matchingOrders[0];
                if (!primaryOrder.quantities) primaryOrder.quantities = {};
                if (!Array.isArray(primaryOrder.selectedItemIds)) primaryOrder.selectedItemIds = [];

                if (newQty > 0) {
                    primaryOrder.quantities[itemId] = newQty;
                    if (!primaryOrder.selectedItemIds.includes(itemId)) primaryOrder.selectedItemIds.push(itemId);
                } else {
                    delete primaryOrder.quantities[itemId];
                    primaryOrder.selectedItemIds = primaryOrder.selectedItemIds.filter(id => id !== itemId);
                }
                primaryOrder.updatedAt = new Date().toISOString();
                await dbSaveRecord('orders', primaryOrder);

                for (let i = 1; i < matchingOrders.length; i++) {
                    if (matchingOrders[i].quantities && matchingOrders[i].quantities[itemId] !== undefined) {
                        delete matchingOrders[i].quantities[itemId];
                        await dbSaveRecord('orders', matchingOrders[i]);
                    }
                }
            } else if (newQty > 0) {
                const newOrder = {
                    id: 'ORD-' + Date.now(),
                    branchId: branchId,
                    branchName: branch ? branch.name : 'Branch',
                    destinationId: destId,
                    destinationName: dest ? dest.name : 'Central Supply',
                    requestDate: getLocalToday(),
                    deliveryDate: targetDate,
                    status: 'Submitted',
                    quantities: { [itemId]: newQty },
                    selectedItemIds: [itemId],
                    updatedAt: new Date().toISOString()
                };
                await dbSaveRecord('orders', newOrder);
            }

            showToast(`Updated ${branch?.name || 'Branch'} quantity to ${newQty}.`, 'success');
        }

        function getDaysInYearMonth(ym) {
            const parts = String(ym || TODAY.slice(0, 7)).split('-');
            const y = parseInt(parts[0], 10) || new Date().getFullYear();
            const m = parseInt(parts[1], 10) || (new Date().getMonth() + 1);
            return new Date(y, m, 0).getDate();
        }

        function getProductionQty(ym, itemId, day) {
            const monthMap = state.productionEntries?.[ym];
            if (!monthMap || !monthMap[itemId]) return 0;
            const raw = monthMap[itemId][String(day)];
            const num = parseFloat(raw);
            return Number.isFinite(num) && num > 0 ? num : 0;
        }

        async function setProductionQty(ym, itemId, day, newQty) {
            if (!state.productionEntries) state.productionEntries = {};
            const monthMap = { ...(state.productionEntries[ym] || {}) };
            const itemMap = { ...(monthMap[itemId] || {}) };
            const cleanVal = Math.max(0, Number(newQty) || 0);

            if (cleanVal > 0) {
                itemMap[String(day)] = cleanVal;
            } else {
                delete itemMap[String(day)];
            }

            if (Object.keys(itemMap).length > 0) {
                monthMap[itemId] = itemMap;
            } else {
                delete monthMap[itemId];
            }

            await saveProductionMonthToDb(ym, monthMap);
        }

        function recalculateProductionSheetDom(daysInMonth, visibleItems, ym = prodSheetYearMonth) {
            const daySums = {};
            for (let d = 1; d <= daysInMonth; d++) daySums[d] = 0;
            let overallTotal = 0;
            let activeDaysCount = 0;
            let topItemSummary = { name: '-', total: 0 };

            visibleItems.forEach(it => {
                let rowSum = 0;
                for (let d = 1; d <= daysInMonth; d++) {
                    const cell = document.querySelector(`td.prod-day-cell[data-item-id="${it.id}"][data-day="${d}"]`);
                    const val = cell ? (parseFloat(cell.dataset.val ?? cell.textContent.replace(/,/g, '')) || 0) : 0;
                    rowSum += val;
                    daySums[d] += val;
                }
                if (rowSum > topItemSummary.total) {
                    topItemSummary = { name: it.name, total: rowSum };
                }
                overallTotal += rowSum;
                const rowAvg = daysInMonth > 0 ? rowSum / daysInMonth : 0;

                const totalEl = document.getElementById(`prod-row-total-${it.id}`);
                const avgEl = document.getElementById(`prod-row-avg-${it.id}`);
                if (totalEl) totalEl.textContent = formatNum(rowSum, 0);
                if (avgEl) avgEl.textContent = formatNum(rowAvg, 1);
            });

            for (let d = 1; d <= daysInMonth; d++) {
                if (daySums[d] > 0) activeDaysCount++;
            }

            const itemCount = visibleItems.length || 1;
            for (let d = 1; d <= daysInMonth; d++) {
                const footTotalEl = document.getElementById(`prod-foot-total-d${d}`);
                const footAvgEl = document.getElementById(`prod-foot-avg-d${d}`);
                if (footTotalEl) footTotalEl.textContent = formatNum(daySums[d], 0);
                if (footAvgEl) footAvgEl.textContent = formatNum(daySums[d] / itemCount, 1);
            }

            const grandTotalEl = document.getElementById('prod-grand-total');
            const grandDailyAvgEl = document.getElementById('prod-grand-daily-avg');
            const activeDaysEl = document.getElementById('prod-active-days-kpi');

            }
            const q = (prodSheetSearch || '').trim().toLowerCase();
            return (state.items || []).filter(it => {
                if (!isItemActive(it)) return false;
                if (!eligibleCatIds.has(it.categoryId)) return false;
                if (prodSheetCatId !== 'ALL' && it.categoryId !== prodSheetCatId) return false;
                if (q) {
                    const matchName = String(it.name || '').toLowerCase().includes(q);
                    const matchCode = String(it.code || '').toLowerCase().includes(q);

        window.startProductionCellEdit = function(td) {
            if (!canEditScreen('production-sheet')) return;
            if (!td || td.classList.contains('excel-cell-editing')) return;

            const ym = prodSheetYearMonth || TODAY.slice(0, 7);
            const daysInMonth = getDaysInYearMonth(ym);
            const currentVal = parseFloat(td.dataset.val ?? td.textContent.replace(/,/g, '')) || 0;
            const itemId = td.dataset.itemId;
            const dayNum = parseInt(td.dataset.day, 10);
            const rowIdx = parseInt(td.dataset.row, 10);
            const colIdx = parseInt(td.dataset.col, 10);

            td.classList.add('excel-cell-editing');
            td.innerHTML = `<input type="number" min="0" step="any" value="${currentVal}" class="w-full h-full py-1.5 px-1 text-center font-bold text-emerald-800 bg-white outline-none" />`;

            const input = td.querySelector('input');
            if (!input) return;
            input.focus();
            input.select();

            let committed = false;

            const commitEdit = async (navMode = 'none', reverse = false) => {
                if (committed) return;
                committed = true;

                const newVal = Math.max(0, parseFloat(input.value) || 0);
                td.classList.remove('excel-cell-editing');
                td.dataset.val = String(newVal);
                td.textContent = String(newVal);

                if (newVal > 0) {
                    td.classList.remove('text-slate-400', 'text-slate-500');
                    td.classList.add('text-slate-900', 'bg-emerald-50/50');
                } else {
                    td.classList.remove('text-slate-900', 'bg-emerald-50/50');
                    td.classList.add('text-slate-400');
                }

                if (newVal !== currentVal) {
                    await setProductionQty(ym, itemId, dayNum, newVal);
                }

                const visibleItems = getFilteredProductionSheetItems();
                recalculateProductionSheetDom(daysInMonth, visibleItems, ym);

                if (navMode === 'vertical') {
                    const nextRow = reverse ? rowIdx - 1 : rowIdx + 1;
                    const nextCell = document.querySelector(`td.prod-day-cell[data-row="${nextRow}"][data-col="${colIdx}"]`);
                    if (nextCell) startProductionCellEdit(nextCell);
                } else if (navMode === 'horizontal') {
                    let nextRow = rowIdx;
                    let nextCol = reverse ? colIdx - 1 : colIdx + 1;
                    if (nextCol >= daysInMonth) {
                        nextCol = 0;
                        nextRow = rowIdx + 1;
                    } else if (nextCol < 0) {
                        nextCol = daysInMonth - 1;
                        nextRow = rowIdx - 1;
                    }
                    const nextCell = document.querySelector(`td.prod-day-cell[data-row="${nextRow}"][data-col="${nextCol}"]`);
                    if (nextCell) startProductionCellEdit(nextCell);
                }
            };

            input.addEventListener('keydown', async (e) => {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    await commitEdit('vertical', e.shiftKey);
                } else if (e.key === 'Tab') {
                    e.preventDefault();
                    await commitEdit('horizontal', e.shiftKey);
                } else if (e.key === 'Escape') {
                    committed = true;
                    td.classList.remove('excel-cell-editing');
                    td.dataset.val = String(currentVal);
                    td.textContent = String(currentVal);
                }
            });

            input.addEventListener('blur', async () => {
                await commitEdit('none', false);
            });
        };

        window.importProductionExcel = async function(event) {
            if (!requireEditPermission('production-sheet', 'import production data')) return;
            const file = event.target.files?.[0];
            if (!file || !window.XLSX) return;
            const ym = prodSheetYearMonth || TODAY.slice(0, 7);
            const daysInMonth = getDaysInYearMonth(ym);
            const eligibleCategories = getProductionEligibleCategories();
            const fallbackCatId = (prodSheetCatId !== 'ALL' && !isExcludedProductionCategory(state.categories.find(c => c.id === prodSheetCatId)))
                ? prodSheetCatId
                : (eligibleCategories[0]?.id || state.categories[0]?.id || 'CAT-PROD');

            const reader = new FileReader();
            reader.onload = async function(e) {
                try {
                    const data = new Uint8Array(e.target.result);
                    const workbook = XLSX.read(data, { type: 'array' });
                    const firstSheet = workbook.Sheets[workbook.SheetNames[0]];
                    const rows = XLSX.utils.sheet_to_json(firstSheet, { header: 1, defval: '' });

                    let dayColMap = {};
                    let codeCol = -1;
                    let nameCol = -1;
                    let importedRows = 0;
                    const monthMap = { ...(state.productionEntries?.[ym] || {}) };

                    for (let r = 0; r < rows.length; r++) {
                        const row = rows[r] || [];
                        const lowerCells = row.map(c => String(c || '').trim().toLowerCase());
                        const dayMatches = {};
                        row.forEach((cell, cIdx) => {
                            const txt = String(cell || '').trim();
                            const n = parseInt(txt, 10);
                            if (String(n) === txt && n >= 1 && n <= daysInMonth) {
                                dayMatches[cIdx] = n;
                            }
                        });

                        if (Object.keys(dayMatches).length >= 3) {
                            dayColMap = dayMatches;
                            lowerCells.forEach((lbl, idx) => {
                                if (lbl.includes('code') || lbl === 'item code') codeCol = idx;
                                if (lbl.includes('item name') || lbl === 'name' || lbl === 'item') nameCol = idx;
                            });
                            if (codeCol === -1) codeCol = 1;
                            if (nameCol === -1) nameCol = 2;
                            continue;
                        }

                        if (Object.keys(dayColMap).length === 0) continue;

                        const rawCode = String(row[codeCol] || '').trim();
                        const rawName = String(row[nameCol] || '').trim();
                        if (!rawCode && !rawName) continue;
                        if (rawName.toLowerCase().includes('total') || rawName.toLowerCase().includes('average')) continue;

                        let matchedItem = (state.items || []).find(it =>
                            (rawCode && String(it.code || '').trim().toLowerCase() === rawCode.toLowerCase()) ||
                            (rawName && String(it.name || '').trim().toLowerCase() === rawName.toLowerCase())
                        );

                        if (!matchedItem) {
                            matchedItem = {
                                id: 'ITM-' + Date.now() + '-' + importedRows,
                                code: rawCode || ('P-' + (importedRows + 1)),
                                name: rawName || rawCode,
                                unit: 'PCS',
                                altUnit: '',
                                conversionFactor: 1,
                                conversionDirection: 'down',
                                status: 'Active',
                                categoryId: fallbackCatId
                            };
                            await dbSaveRecord('items', matchedItem);
                        }

                        const itemMap = { ...(monthMap[matchedItem.id] || {}) };
                        Object.entries(dayColMap).forEach(([cIdxStr, dayNum]) => {
                            const cIdx = parseInt(cIdxStr, 10);
                            const numVal = parseFloat(row[cIdx]);
                            if (Number.isFinite(numVal) && numVal > 0) {
                                itemMap[String(dayNum)] = numVal;
                            }
                        });
                        if (Object.keys(itemMap).length > 0) {
                            monthMap[matchedItem.id] = itemMap;
                        }
                        importedRows++;
                    }

                    event.target.value = '';
                    if (importedRows > 0) {
                        await saveProductionMonthToDb(ym, monthMap);
                        renderCurrentRoute();
                        showToast(`Imported daily production data for ${importedRows} item(s) in ${ym}!`, 'success');
                    } else {
                        showToast('Could not detect day columns (1..31) in the uploaded Excel file.', 'warning');

                    console.error(err);
                    showToast('Failed to import production Excel file.', 'error');
                }
            };

        let reportPeriodMode = 'monthly'; // 'monthly' | 'quarterly' | 'yearly'
        let reportFromDate = `${TODAY.slice(0, 7)}-01`;
        let reportToDate = `${TODAY.slice(0, 7)}-${String(getDaysInYearMonth(TODAY.slice(0, 7))).padStart(2, '0')}`;
        let reportCatId = 'ALL';
        let reportSearchQuery = '';
        let prodReportChartInstance = null;

        function getQuarterDateRange(year, qNum) {
            const startMonth = (qNum - 1) * 3 + 1;
            const endMonth = startMonth + 2;
            const startStr = `${year}-${String(startMonth).padStart(2, '0')}-01`;
            const lastDay = new Date(year, endMonth, 0).getDate();
            const endStr = `${year}-${String(endMonth).padStart(2, '0')}-${String(lastDay).padStart(2, '0')}`;
            return { from: startStr, to: endStr };
        }

        function setReportPeriodPreset(mode) {
            reportPeriodMode = mode;
            const now = new Date();
            const year = now.getFullYear();
            const month = now.getMonth() + 1;

            if (mode === 'monthly') {
                const ym = `${year}-${String(month).padStart(2, '0')}`;
                const lastDay = getDaysInYearMonth(ym);
                reportFromDate = `${ym}-01`;
                reportToDate = `${ym}-${String(lastDay).padStart(2, '0')}`;
            } else if (mode === 'quarterly') {
                const qNum = Math.floor((month - 1) / 3) + 1;
                const rng = getQuarterDateRange(year, qNum);
                reportFromDate = rng.from;
                reportToDate = rng.to;
            } else if (mode === 'yearly') {
                reportFromDate = `${year}-01-01`;
                reportToDate = `${year}-12-31`;
            }
        }

        function enumerateDatesInRange(fromStr, toStr) {
            if (!fromStr || !toStr) return [];
            const start = new Date(fromStr + 'T00:00:00');
            const end = new Date(toStr + 'T00:00:00');
            if (isNaN(start.getTime()) || isNaN(end.getTime()) || start > end) return [];

            const dates = [];
            const cur = new Date(start.getTime());
            let guard = 0;
            while (cur <= end && guard < 3660) {
                const y = cur.getFullYear();
                const m = String(cur.getMonth() + 1).padStart(2, '0');
                const d = String(cur.getDate()).padStart(2, '0');
                dates.push({
                    iso: `${y}-${m}-${d}`,
                    ym: `${y}-${m}`,
                    dayOfMonth: cur.getDate()
                });
                cur.setDate(cur.getDate() + 1);
                guard++;
            }
            return dates;
        }

        function buildProductionReportDataset() {
            let fromD = reportFromDate;
            let toD = reportToDate;
            if (fromD && toD && fromD > toD) {
                const tmp = fromD;
                fromD = toD;
                toD = tmp;
            }

            const dateList = enumerateDatesInRange(fromD, toD);
            const selectedDaysCount = Math.max(1, dateList.length);

            const eligibleCatIds = getProductionEligibleCategoryIds();
            if (reportCatId !== 'ALL' && !eligibleCatIds.has(reportCatId)) {
                reportCatId = 'ALL';
            }

            const q = (reportSearchQuery || '').trim().toLowerCase();
            const items = (state.items || []).filter(it => {
                if (!isItemActive(it)) return false;
                if (!eligibleCatIds.has(it.categoryId)) return false;
                if (reportCatId !== 'ALL' && it.categoryId !== reportCatId) return false;
                if (q) {
                    const matchName = String(it.name || '').toLowerCase().includes(q);
                    const matchCode = String(it.code || '').toLowerCase().includes(q);
                    const matchUnit = String(it.unit || '').toLowerCase().includes(q);
                    if (!matchName && !matchCode && !matchUnit) return false;
                }
                return true;
            });

            const day1To31Totals = {};
            for (let d = 1; d <= 31; d++) day1To31Totals[d] = 0;

            let grandTotal = 0;
            const rows = items.map((it, idx) => {
                const itemDay1To31 = {};
                for (let d = 1; d <= 31; d++) itemDay1To31[d] = 0;

                let rangeTotal = 0;
                dateList.forEach(dt => {
                    const val = getProductionQty(dt.ym, it.id, dt.dayOfMonth);
                    rangeTotal += val;
                    itemDay1To31[dt.dayOfMonth] += val;
                    day1To31Totals[dt.dayOfMonth] += val;
                });

                grandTotal += rangeTotal;
                const rangeAvg = rangeTotal / selectedDaysCount;

                return {
                    sr: idx + 1,
                    id: it.id,
                    code: it.code,
                    name: it.name,
                    unit: it.unit,
                    day1To31: itemDay1To31,
                    rangeTotal,
                    rangeAvg
                };
            });

            return {
                fromDate: fromD,
                toDate: toD,
                selectedDaysCount,
                rows,
                day1To31Totals,
                grandTotal,
                selectedDateAverage: grandTotal / selectedDaysCount
            };
        }
