        window.exportProductionReportExcel = function() {
            if (!window.XLSX) return;
            const ds = buildProductionReportDataset();
            const dayCols31 = Array.from({ length: 31 }, (_, i) => i + 1);
            const header = ['Sr', 'Code', 'Item Name', 'Unit', ...dayCols31.map(d => `Day ${d}`), 'Range Total', 'Selected Date Avg'];

            const rows = ds.rows.map(r => [
                r.sr,
                r.code,
                r.name,
                r.unit,
                ...dayCols31.map(d => r.day1To31[d] || 0),
                r.rangeTotal,
                Number(r.rangeAvg.toFixed(2))
            ]);

            rows.push([
                '',
                '',
                'Total (Day 1-31)',
                '',
                ...dayCols31.map(d => ds.day1To31Totals[d] || 0),
                ds.grandTotal,
                Number(ds.selectedDateAverage.toFixed(2))
            ]);

            rows.push([
                '',
                '',
                `Average (${ds.selectedDaysCount} Selected Days)`,
                '',
                ...dayCols31.map(d => Number(((ds.day1To31Totals[d] || 0) / ds.selectedDaysCount).toFixed(2))),
                Number((ds.grandTotal / (ds.rows.length || 1)).toFixed(2)),
                Number(ds.selectedDateAverage.toFixed(2))
            ]);

            const ws = XLSX.utils.aoa_to_sheet([header, ...rows]);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, 'Production_Report');
            XLSX.writeFile(wb, `Production_Report_${ds.fromDate}_to_${ds.toDate}.xlsx`);
        };

        window.exportProductionReportPdf = function() {
            if (!window.jspdf || !window.jspdf.jsPDF) return showToast('PDF library unavailable.', 'warning');
            const { jsPDF } = window.jspdf;
            const docPdf = new jsPDF({ orientation: 'landscape', unit: 'pt', format: 'a4' });
            const s = state.settings || DEFAULT_SETTINGS;
            const ds = buildProductionReportDataset();
            const dayCols31 = Array.from({ length: 31 }, (_, i) => i + 1);

            docPdf.setFillColor(49, 46, 129);
            docPdf.rect(0, 0, docPdf.internal.pageSize.getWidth(), 56, 'F');
            docPdf.setTextColor(255, 255, 255);
            docPdf.setFontSize(13);
            docPdf.text(`${s.companyName || 'Company'} — Production Report (${ds.fromDate} to ${ds.toDate})`, 30, 26);
            docPdf.setFontSize(9);
            docPdf.text(`Selected Days: ${ds.selectedDaysCount} • Range Total: ${formatNum(ds.grandTotal, 0)} • Selected Date Avg: ${formatNum(ds.selectedDateAverage, 2)}`, 30, 42);

            const head = [['Sr', 'Code', 'Item Name', 'Unit', ...dayCols31.map(String), 'Total', 'Avg']];
            const body = ds.rows.map(r => [
                String(r.sr),
                r.code,
                r.name,
                r.unit,
                ...dayCols31.map(d => String(r.day1To31[d] || 0)),
                String(r.rangeTotal),
                r.rangeAvg.toFixed(2)
            ]);

            body.push([
                '',
                '',
                'Total',
                '',
                ...dayCols31.map(d => String(ds.day1To31Totals[d] || 0)),
                String(ds.grandTotal),
                ds.selectedDateAverage.toFixed(2)
            ]);

            body.push([
                '',
                '',
                'Date Avg',
                '',
                ...dayCols31.map(d => ((ds.day1To31Totals[d] || 0) / ds.selectedDaysCount).toFixed(2)),
                (ds.grandTotal / (ds.rows.length || 1)).toFixed(1),
                ds.selectedDateAverage.toFixed(2)
            ]);

            docPdf.autoTable({
                startY: 70,
                head,
                body,
                styles: { fontSize: 6, cellPadding: 1.8 },
                headStyles: { fillColor: [79, 70, 229], textColor: [255, 255, 255], fontStyle: 'bold' },
                alternateRowStyles: { fillColor: [248, 250, 252] }
            });

            docPdf.save(`Production_Report_${ds.fromDate}_to_${ds.toDate}.pdf`);
        };

            openModal({
                title: 'Confirm Bulk Deletion',
                bodyHtml: `<p>Delete <strong>${ids.length}</strong> selected item(s)?</p>`,
                confirmText: 'Delete Selected',
                onConfirm: async () => {

                    closeModal();
                    renderCurrentRoute();
                    showToast(`Deleted ${ids.length} items successfully!`, 'success');

        function renderPermissionMatrixHtml(userObj) {
            const perms = resolveUserPermissions(userObj);
            return SYSTEM_MENU_REGISTRY.map(group => {

                                </label>

                                const p = perms[sub.id] || { view: false, edit: false };
                                return `
                                    <div class="flex items-center justify-between gap-2 bg-white px-3 py-2 rounded-lg border border-slate-200">
                                        <span class="text-xs font-semibold text-slate-800 truncate" title="${escapeHtml(sub.label)}">${escapeHtml(sub.label)}</span>

                                                <span>View</span>
                                            </label>
                                            <label class="inline-flex items-center gap-1 text-emerald-700 cursor-pointer">
                                                <input type="checkbox" id="perm-edit-${sub.id}" data-perm-edit="${sub.id}" ${p.edit ? 'checked' : ''} onchange="onSinglePermissionChange('${sub.id}', 'edit', this.checked)" class="rounded text-emerald-600 w-3.5 h-3.5">

        window.onSinglePermissionChange = function(screenId, kind, checked) {
            const viewCb = document.getElementById(`perm-view-${screenId}`);
            const editCb = document.getElementById(`perm-edit-${screenId}`);
            if (!viewCb || !editCb) return;

            if (kind === 'edit' && checked) {
                viewCb.checked = true;
            }
            if (kind === 'view' && !checked) {
                editCb.checked = false;
            }
        };

        window.toggleGroupPermission = function(groupId, kind, checked) {
            const grp = SYSTEM_MENU_REGISTRY.find(g => g.id === groupId);
            if (!grp) return;
            grp.children.forEach(sub => {
                const viewCb = document.getElementById(`perm-view-${sub.id}`);
                const editCb = document.getElementById(`perm-edit-${sub.id}`);
                if (!viewCb || !editCb) return;

                if (kind === 'view') {
                    viewCb.checked = checked;
                    if (!checked) editCb.checked = false;
                } else if (kind === 'edit') {
                    editCb.checked = checked;
                    if (checked) viewCb.checked = true;
                }
            });
        };

        window.applyRolePresetPermissions = function() {
            const checkedRoles = Array.from(document.querySelectorAll('.m-u-role-cb:checked')).map(cb => cb.value);
            const rolesToUse = checkedRoles.length > 0 ? checkedRoles : ['branch'];
            const preset = buildDefaultPermissionsForRoles(rolesToUse);

            getAllScreenIds().forEach(screenId => {
                const viewCb = document.getElementById(`perm-view-${screenId}`);
                const editCb = document.getElementById(`perm-edit-${screenId}`);
                const p = preset[screenId] || { view: false, edit: false };
                if (viewCb) viewCb.checked = Boolean(p.view);
                if (editCb) editCb.checked = Boolean(p.view && p.edit);
            });
            showToast(`Applied default View/Edit permissions for: ${rolesToUse.join(', ')}`, 'info');
        };

        function collectPermissionsFromModal() {
            const perms = {};
            getAllScreenIds().forEach(screenId => {
                const viewCb = document.getElementById(`perm-view-${screenId}`);
                const editCb = document.getElementById(`perm-edit-${screenId}`);
                const canV = Boolean(viewCb?.checked);
                const canE = canV && Boolean(editCb?.checked);
                perms[screenId] = { view: canV, edit: canE };
            });
            return perms;
        }

        window.openUserModal = function(id = null) {
            if (!requireEditPermission('master-users', 'manage user accounts')) return;
            const existing = id ? (state.users || []).find(u => u.id === id) : null;
            const user = existing
                ? { ...existing, roles: getUserRolesList(existing) }
                : { id: 'USR-' + Date.now(), username: '', passwordHash: '', fullName: '', role: 'branch', roles: ['branch'], branchId: '', destinationId: '', permissions: buildDefaultPermissionsForRoles(['branch']) };

            openModal({
                title: id ? 'Edit User Account & Permissions' : 'Create User Account & Permissions',
                confirmText: 'Save User',
                bodyHtml: `
                    <div class="space-y-4">
                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                            <div><label class="block text-xs font-bold uppercase text-slate-500 mb-1">Username</label><input type="text" id="m-u-name" value="${escapeHtml(user.username)}" ${user.username === 'admin' ? 'readonly' : ''} class="w-full px-3 py-2 border rounded-xl text-sm font-bold"></div>
                            <div><label class="block text-xs font-bold uppercase text-slate-500 mb-1">${id ? 'New Password (leave blank to keep)' : 'Password'}</label><input type="password" id="m-u-pass" placeholder="${id ? '••••••••' : 'Enter password'}" class="w-full px-3 py-2 border rounded-xl text-sm font-bold"></div>
                        </div>
                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                            <div><label class="block text-xs font-bold uppercase text-slate-500 mb-1">Full Name</label><input type="text" id="m-u-full" value="${escapeHtml(user.fullName)}" class="w-full px-3 py-2 border rounded-xl text-sm font-bold"></div>
                            <div>
                                <label class="block text-xs font-bold uppercase text-slate-500 mb-1">Assigned Roles (Multi-Select)</label>
                                <div class="grid grid-cols-2 gap-1.5 p-2 bg-slate-50 border rounded-xl">
                                    ${ROLE_CATALOG.map(rc => {
                                        const isChecked = (user.roles || []).includes(rc.id);
                                        const lockedAdmin = user.username === 'admin' && rc.id === 'admin';
                                        return `
                                            <label class="inline-flex items-center gap-1.5 text-xs font-bold text-slate-700 cursor-pointer">
                                                <input type="checkbox" value="${rc.id}" ${isChecked ? 'checked' : ''} ${lockedAdmin ? 'checked disabled' : ''} class="m-u-role-cb rounded text-blue-600 w-3.5 h-3.5">
                                                <span>${escapeHtml(rc.label)}</span>
                                            </label>
                                        `;
                                    }).join('')}
                                </div>
                            </div>
                        </div>
                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                            <div><label class="block text-xs font-bold uppercase text-slate-500 mb-1">Branch (if Branch User)</label><select id="m-u-br" class="w-full px-3 py-2 border rounded-xl text-sm font-bold"><option value="">None</option>${(state.branches || []).map(b => `<option value="${b.id}" ${b.id === user.branchId ? 'selected' : ''}>${escapeHtml(b.name)}</option>`).join('')}</select></div>
                            <div><label class="block text-xs font-bold uppercase text-slate-500 mb-1">Destination (if Warehouse User)</label><select id="m-u-dst" class="w-full px-3 py-2 border rounded-xl text-sm font-bold"><option value="">None</option>${(state.destinations || []).map(d => `<option value="${d.id}" ${d.id === user.destinationId ? 'selected' : ''}>${escapeHtml(d.name)}</option>`).join('')}</select></div>
                        </div>
                        <div class="space-y-2 pt-2 border-t border-slate-200">
                            <div class="flex flex-wrap items-center justify-between gap-2">
                                <label class="block text-xs font-extrabold uppercase text-slate-700">Document View &amp; Edit Permissions</label>
                                <button type="button" onclick="applyRolePresetPermissions()" class="px-2.5 py-1 bg-indigo-50 hover:bg-indigo-100 text-indigo-700 border border-indigo-200 rounded-lg text-[11px] font-bold">
                                    Reset to Selected Role Defaults
                                </button>
                            </div>
                            <div class="space-y-2.5 max-h-64 overflow-y-auto pr-1">
                                ${renderPermissionMatrixHtml(user)}
                            </div>
                        </div>
                    </div>
                `,
                onConfirm: async () => {
                    const uname = (document.getElementById('m-u-name')?.value || '').trim().toLowerCase();
                    const rawPass = document.getElementById('m-u-pass')?.value || '';
                    const fullName = (document.getElementById('m-u-full')?.value || '').trim();

                    const checkedRoles = Array.from(document.querySelectorAll('.m-u-role-cb:checked')).map(cb => cb.value);
                    if (user.username === 'admin' && !checkedRoles.includes('admin')) {
                        checkedRoles.unshift('admin');
                    }
                    const rolesList = checkedRoles.length > 0 ? Array.from(new Set(checkedRoles)) : ['branch'];

                    const brId = document.getElementById('m-u-br')?.value || '';
                    const dstId = document.getElementById('m-u-dst')?.value || '';

                    if (!uname || !fullName) return showToast('Username and Full Name are required!', 'error');
                    if (!id && !rawPass) return showToast('Password is required for a new user!', 'error');

                    const duplicate = (state.users || []).find(u => u.username.toLowerCase() === uname && u.id !== user.id);
                    if (duplicate) return showToast('Username already exists!', 'error');

                    user.username = uname;
                    user.fullName = fullName;
                    user.roles = rolesList;
                    user.role = rolesList.includes('admin') ? 'admin' : rolesList[0];
                    user.branchId = brId;
                    user.destinationId = dstId;
                    user.permissions = collectPermissionsFromModal();

                    if (rawPass) {
                        user.passwordHash = await hashPassword(rawPass);
                        delete user.password;
                    }

                    await dbSaveRecord('users', user);

                    if (currentUser && (currentUser.id === user.id || currentUser.username === user.username)) {
                        currentUser = {
                            ...currentUser,
                            fullName: user.fullName,
                            role: user.role,
                            roles: user.roles,
                            branchId: user.branchId,
                            destinationId: user.destinationId,
                            permissions: user.permissions
                        };
                        try {
                            sessionStorage.setItem('kty_active_user', JSON.stringify(currentUser));
                        } catch (e) {}
                        updateHeaderUserDisplay(currentUser);
                        renderTopMenu();
                    }

                    closeModal();
                    renderCurrentRoute();
                    showToast('User account & permissions saved successfully!');
                }
            });
        };

        // ==================== 10. COMPANY & SYSTEM INFORMATION ====================
        let tempLogoDataUrl = null;

            const s = state.settings || DEFAULT_SETTINGS;
            if (tempLogoDataUrl === null) tempLogoDataUrl = s.logoDataUrl || '';

            container.innerHTML = `
                <div class="max-w-4xl mx-auto bg-white rounded-2xl p-6 shadow-sm border space-y-6">
                    <div class="pb-3 border-b">
                        <h3 class="font-bold text-lg text-slate-900">Company &amp; System Information</h3>
                        <p class="text-xs text-slate-500">Customize the software name, company name, logo, and print header details</p>
                    </div>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-xs font-bold uppercase text-slate-500 mb-1">Software Name</label>
                            <input type="text" id="set-soft-name" ${!canEdit ? 'disabled' : ''} value="${escapeHtml(s.softwareName || '')}" class="w-full px-3.5 py-2 border rounded-xl text-sm font-bold">
                        </div>
                        <div>
                            <label class="block text-xs font-bold uppercase text-slate-500 mb-1">Company Name</label>
                            <input type="text" id="set-comp-name" ${!canEdit ? 'disabled' : ''} value="${escapeHtml(s.companyName || '')}" class="w-full px-3.5 py-2 border rounded-xl text-sm font-bold">
                        </div>
                    </div>
                    <div>
                        <label class="block text-xs font-bold uppercase text-slate-500 mb-1">Tagline / Subtitle</label>
                        <input type="text" id="set-tagline" ${!canEdit ? 'disabled' : ''} value="${escapeHtml(s.tagline || '')}" class="w-full px-3.5 py-2 border rounded-xl text-sm font-bold">
                    </div>
                    <div>
                        <label class="block text-xs font-bold uppercase text-slate-500 mb-1">Company Address</label>
                        <input type="text" id="set-addr" ${!canEdit ? 'disabled' : ''} value="${escapeHtml(s.address || '')}" class="w-full px-3.5 py-2 border rounded-xl text-sm font-bold">
                    </div>
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                        <div><label class="block text-xs font-bold uppercase text-slate-500 mb-1">Phone</label><input type="text" id="set-phone" ${!canEdit ? 'disabled' : ''} value="${escapeHtml(s.phone || '')}" class="w-full px-3.5 py-2 border rounded-xl text-sm font-bold"></div>
                        <div><label class="block text-xs font-bold uppercase text-slate-500 mb-1">Email</label><input type="text" id="set-email" ${!canEdit ? 'disabled' : ''} value="${escapeHtml(s.email || '')}" class="w-full px-3.5 py-2 border rounded-xl text-sm font-bold"></div>
                        <div><label class="block text-xs font-bold uppercase text-slate-500 mb-1">Tax ID / VAT</label><input type="text" id="set-tax" ${!canEdit ? 'disabled' : ''} value="${escapeHtml(s.taxId || '')}" class="w-full px-3.5 py-2 border rounded-xl text-sm font-bold"></div>
                    </div>
                    <div class="flex flex-wrap items-center gap-6 p-4 bg-slate-50 rounded-xl border">
                        <div class="w-20 h-20 bg-white border rounded-xl flex items-center justify-center overflow-hidden p-1" id="set-logo-preview">
                            ${tempLogoDataUrl ? `<img src="${tempLogoDataUrl}" class="max-w-full max-h-full object-contain">` : `<span class="text-xs text-slate-400">No Logo</span>`}

                        <div class="space-y-1">
                            <label class="block text-xs font-bold uppercase text-slate-600">Company Logo</label>
                            <input type="file" id="set-logo-file" accept="image/*" ${!canEdit ? 'disabled' : ''} class="text-xs text-slate-600">
                            <p class="text-[11px] text-slate-400">Displayed on Login Screen, Home Banner, Top Navigation &amp; Delivery Challans</p>
                        </div>
                    </div>
                    <div class="flex justify-end">
                        <button type="button" onclick="saveCompanySettings()" ${!canEdit ? 'disabled' : ''} class="px-6 py-2.5 ${!canEdit ? 'bg-slate-300 text-slate-500 cursor-not-allowed' : 'bg-blue-600 hover:bg-blue-700 text-white shadow-md'} font-bold rounded-xl text-sm flex items-center gap-2">

                        tempLogoDataUrl = ev.target.result;

        window.saveCompanySettings = async function() {
            if (!requireEditPermission('system-settings', 'save company settings')) return;
            const updated = {
                id: 'MAIN_SETTINGS',
                softwareName: (document.getElementById('set-soft-name')?.value || '').trim() || 'StockTransfer ERP',
                companyName: (document.getElementById('set-comp-name')?.value || '').trim() || 'Enterprise Food & Supply Co.',
                tagline: (document.getElementById('set-tagline')?.value || '').trim(),
                address: (document.getElementById('set-addr')?.value || '').trim(),
                phone: (document.getElementById('set-phone')?.value || '').trim(),
                email: (document.getElementById('set-email')?.value || '').trim(),
                taxId: (document.getElementById('set-tax')?.value || '').trim(),
                logoDataUrl: tempLogoDataUrl || ''
            };
            state.settings = updated;
            saveToLocalStorage();
            applyCompanyBranding();
            if (firestoreDb) {
                try { await setDoc(doc(firestoreDb, 'settings', 'MAIN_SETTINGS'), updated); } catch (e) {}
            }
            renderCurrentRoute();
            showToast('Company & System Information saved and applied!', 'success');
        };

        // ==================== EXCEL IMPORT & RECORD DELETION ====================
        window.importExcelData = async function(event, targetCollection) {
            if (!requireEditPermission(currentRoute || 'master-items', `import ${targetCollection}`)) return;
            const file = event.target.files?.[0];
            if (!file || !window.XLSX) return;

            if (targetCollection === 'items' && importCompletedForCategory) {
                event.target.value = '';
                return showToast('Import already completed for this category. Click "Refresh" to choose another category.', 'warning');
            }

            if (targetCollection === 'items' && !itemMasterFilterCatId) {
                event.target.value = '';
                return showToast('Please select a target category first before importing items!', 'error');
            }

            const reader = new FileReader();
            reader.onload = async function(e) {
                try {
                    const data = new Uint8Array(e.target.result);
                    const workbook = XLSX.read(data, { type: 'array' });
                    const firstSheet = workbook.Sheets[workbook.SheetNames[0]];
                    const rows = XLSX.utils.sheet_to_json(firstSheet, { header: 1, defval: '' });

                    let importedCount = 0;

                    if (targetCollection === 'categories') {
                        for (let i = 0; i < rows.length; i++) {
                            const r = rows[i];
                            if (!r || r.length === 0) continue;
                            const c0 = String(r[0] || '').trim();
                            const c1 = String(r[1] || '').trim();

                            if (i === 0 && (c0.toLowerCase() === 'sr' || c0.toLowerCase() === 'category name' || c1.toLowerCase() === 'category name')) continue;

                            const catName = (c1 && !/^\d+$/.test(c1)) ? c1 : (c0 && !/^\d+$/.test(c0) ? c0 : '');
                            if (!catName) continue;

                            const exists = (state.categories || []).some(c => c.name.toLowerCase() === catName.toLowerCase());
                            if (!exists) {
                                await dbSaveRecord('categories', {
                                    id: 'CAT-' + Date.now() + '-' + importedCount,
                                    name: catName
                                });
                                importedCount++;
                            }
                        }
                    } else if (targetCollection === 'items') {
                        const targetCatId = itemMasterFilterCatId;
                        const targetCat = (state.categories || []).find(c => c.id === targetCatId);

                        for (let i = 0; i < rows.length; i++) {
                            const r = rows[i];
                            if (!r || r.length === 0) continue;
                            const c0 = String(r[0] || '').trim();
                            const c1 = String(r[1] || '').trim();
                            const c2 = String(r[2] || '').trim();
                            const c3 = String(r[3] || '').trim();
                            const c4 = String(r[4] || '').trim();

                            if (i === 0 && (c0.toLowerCase() === 'sr' || c1.toLowerCase().includes('code') || c2.toLowerCase().includes('name'))) continue;

                            let code = '', name = '', unit = 'PCS', status = 'Active';
                            if (/^\d+$/.test(c0) && c1 && c2) {
                                code = c1;
                                name = c2;
                                unit = (c3 || 'PCS').toUpperCase();
                                status = /inactive/i.test(c4) ? 'Inactive' : 'Active';
                            } else if (c0 && c1) {
                                code = c0;
                                name = c1;
                                unit = (c2 || 'PCS').toUpperCase();
                                status = /inactive/i.test(c3) ? 'Inactive' : 'Active';
                            }

                            if (!name) continue;
                            if (!code) code = 'ITM-' + (importedCount + 1);

                            await dbSaveRecord('items', {
                                id: 'ITM-' + Date.now() + '-' + importedCount,
                                code: code,
                                name: name,
                                unit: unit,
                                altUnit: '',
                                conversionFactor: 1,
                                conversionDirection: 'down',
                                status: status,
                                categoryId: targetCatId
                            });
                            importedCount++;
                        }

                        if (importedCount > 0) {
                            importCompletedForCategory = true;
                        }
                        event.target.value = '';
                        renderCurrentRoute();
                        showToast(`Imported ${importedCount} item(s) into "${targetCat ? targetCat.name : 'Selected Category'}"! Import locked for this category until Refresh.`, 'success');
                        return;
                    } else if (targetCollection === 'branches') {
                        for (let i = 0; i < rows.length; i++) {
                            const r = rows[i];
                            if (!r || r.length === 0) continue;
                            const c0 = String(r[0] || '').trim();
                            const c1 = String(r[1] || '').trim();
                            const c2 = String(r[2] || '').trim();
                            const c3 = String(r[3] || '').trim();

                            if (i === 0 && (c0.toLowerCase() === 'sr' || c1.toLowerCase().includes('id') || c1.toLowerCase().includes('code') || c2.toLowerCase().includes('branch'))) continue;

                            let code = '', name = '', address = '';
                            if (/^\d+$/.test(c0) && c1 && c2) {
                                code = c1;
                                name = c2;
                                address = c3;
                            } else if (c0 && c1) {
                                code = c0;
                                name = c1;
                                address = c2;
                            }

                            if (!name) continue;
                            if (!code) code = 'BR-' + (importedCount + 1);

                            await dbSaveRecord('branches', {
                                id: 'BR-' + Date.now() + '-' + importedCount,
                                code: code,
                                name: name,
                                address: address || '-'
                            });
                            importedCount++;
                        }
                    } else if (targetCollection === 'destinations') {
                        for (let i = 0; i < rows.length; i++) {
                            const r = rows[i];
                            if (!r || r.length === 0) continue;
                            const c0 = String(r[0] || '').trim();
                            const c1 = String(r[1] || '').trim();
                            const c2 = String(r[2] || '').trim();

                            if (i === 0 && (c0.toLowerCase() === 'sr' || c1.toLowerCase().includes('destination') || c1.toLowerCase().includes('name'))) continue;

                            let name = '', type = 'Warehouse';
                            if (/^\d+$/.test(c0) && c1) {
                                name = c1;
                                type = c2 || 'Warehouse';
                            } else if (c0) {
                                name = c0;
                                type = c1 || 'Warehouse';
                            }

                            if (!name) continue;

                            await dbSaveRecord('destinations', {
                                id: 'DST-' + Date.now() + '-' + importedCount,
                                name: name,
                                type: type
                            });
                            importedCount++;
                        }
                    }

                    event.target.value = '';
                    renderCurrentRoute();
                    showToast(`Successfully imported ${importedCount} ${targetCollection}!`, 'success');
                } catch (err) {
                    console.error(err);
                    showToast('Failed to parse Excel file. Please check format.', 'error');
                }
            };
            reader.readAsArrayBuffer(file);
        };

        window.deleteRecord = async function(colName, id) {
            if (!requireEditPermission(currentRoute || 'master-items', `delete from ${colName}`)) return;
            openModal({
                title: 'Confirm Deletion',
                bodyHtml: `<p>Are you sure you want to permanently delete this record?</p>`,
                confirmText: 'Delete',
                onConfirm: async () => {
                    await dbDeleteRecord(colName, id);
                    closeModal();
                    renderCurrentRoute();
                    showToast('Record deleted!');
                }
            });
        };

        try { lucide.createIcons(); } catch (e) {}
        initHybridDatabase();
    </script>
