</head>

        <!-- Main Workspace Content -->

    <!-- ==================== APPLICATION SCRIPT ==================== -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-app.js";
        import { getAnalytics } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-analytics.js";
        import {
            getFirestore,
            collection,
            doc,
            setDoc,
            getDocs,
            deleteDoc,
            onSnapshot,
            writeBatch
        } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyARVhYpatrpllPch6XJPKumXhJVvCUAzIA",
            authDomain: "kty-store-order.firebaseapp.com",
            projectId: "kty-store-order",
            storageBucket: "kty-store-order.firebasestorage.app",
            messagingSenderId: "340295086859",
            appId: "1:340295086859:web:737eab78ed9a9c1aab280e",
            measurementId: "G-C9VKBLLLM3"
        };

        const firebaseApp = initializeApp(firebaseConfig);
        let analytics = null;
        try { analytics = getAnalytics(firebaseApp); } catch (e) {}
        const firestoreDb = getFirestore(firebaseApp);

        const TODAY = new Date().toISOString().split('T')[0];
        const TOMORROW = new Date(Date.now() + 86400000).toISOString().split('T')[0];

        const DEFAULT_DATA = {
            branches: [
                { id: 'BR-01', name: 'Branch 1 - Gulshan', code: 'GUL', address: 'House 42, Road 11, Gulshan-1' },
                { id: 'BR-02', name: 'Branch 2 - Banani', code: 'BAN', address: 'Plot 18, Block E, Banani' },
                { id: 'BR-03', name: 'Branch 3 - Dhanmondi', code: 'DHA', address: 'Road 27, Dhanmondi' }
            ],
            destinations: [
                { id: 'DST-01', name: 'Factory', type: 'Factory' },
                { id: 'DST-02', name: 'Warehouse', type: 'Warehouse' },
                { id: 'DST-03', name: 'Frozen Warehouse', type: 'Frozen Warehouse' }
            ],
            categories: [
                { id: 'CAT-01', name: 'Bakery & Pastry' },
                { id: 'CAT-02', name: 'Frozen Meat & Poultry' },
                { id: 'CAT-03', name: 'Sauces & Marinades' },
                { id: 'CAT-04', name: 'Dry Grocery & Packaging' }
            ],
            items: [
                { id: 'ITM-01', code: 'BAK-101', name: 'Artisan Burger Buns (Pack of 12)', unit: 'PACK', categoryId: 'CAT-01' },
                { id: 'ITM-02', code: 'BAK-102', name: 'Butter Croissant Dough', unit: 'PCS', categoryId: 'CAT-01' },
                { id: 'ITM-03', code: 'BAK-103', name: 'Focaccia Loaf 500g', unit: 'PCS', categoryId: 'CAT-01' },
                { id: 'ITM-04', code: 'BAK-104', name: 'Chocolate Fudge Brownie Tray', unit: 'TRAY', categoryId: 'CAT-01' },
                { id: 'ITM-05', code: 'FRZ-201', name: 'Marinated Chicken Breast Fillet', unit: 'KG', categoryId: 'CAT-02' },
                { id: 'ITM-06', code: 'FRZ-202', name: 'Premium Beef Burger Patties', unit: 'KG', categoryId: 'CAT-02' },
                { id: 'ITM-07', code: 'FRZ-203', name: 'Crispy French Fries 2.5kg', unit: 'BAG', categoryId: 'CAT-02' },
                { id: 'ITM-08', code: 'FRZ-204', name: 'Breaded Chicken Tenders', unit: 'KG', categoryId: 'CAT-02' },
                { id: 'ITM-09', code: 'SAU-301', name: 'Signature House Burger Sauce', unit: 'LTR', categoryId: 'CAT-03' },
                { id: 'ITM-10', code: 'SAU-302', name: 'Spicy Peri-Peri Marinade', unit: 'LTR', categoryId: 'CAT-03' },
                { id: 'ITM-11', code: 'SAU-303', name: 'Classic Garlic Aioli', unit: 'KG', categoryId: 'CAT-03' },
                { id: 'ITM-12', code: 'SAU-304', name: 'Smoky BBQ Glaze', unit: 'LTR', categoryId: 'CAT-03' },
                { id: 'ITM-13', code: 'DRY-401', name: 'Takeaway Kraft Meal Box', unit: 'PCS', categoryId: 'CAT-04' },
                { id: 'ITM-14', code: 'DRY-402', name: 'Branded Paper Napkins (500s)', unit: 'PACK', categoryId: 'CAT-04' },
                { id: 'ITM-15', code: 'DRY-403', name: 'Extra Virgin Olive Oil', unit: 'LTR', categoryId: 'CAT-04' },
                { id: 'ITM-16', code: 'DRY-404', name: 'Sea Salt Flakes', unit: 'KG', categoryId: 'CAT-04' }
            ],
            users: [
                { id: 'USR-01', username: 'admin', password: '1234', fullName: 'System Administrator', role: 'admin', branchId: '', destinationId: '' },
                { id: 'USR-02', username: 'factory', password: '1234', fullName: 'Factory Production Head', role: 'factory_warehouse', branchId: '', destinationId: 'DST-01' },
                { id: 'USR-03', username: 'warehouse', password: '1234', fullName: 'Warehouse Storekeeper', role: 'factory_warehouse', branchId: '', destinationId: 'DST-02' },
                { id: 'USR-04', username: 'branch1', password: '1234', fullName: 'Gulshan Branch Manager', role: 'branch', branchId: 'BR-01', destinationId: '' },
                { id: 'USR-05', username: 'branch2', password: '1234', fullName: 'Banani Branch Manager', role: 'branch', branchId: 'BR-02', destinationId: '' },
                { id: 'USR-06', username: 'branch3', password: '1234', fullName: 'Dhanmondi Branch Manager', role: 'branch', branchId: 'BR-03', destinationId: '' }
            ],
            orders: [
                {
                    id: 'ORD-SEED-1',
                    branchId: 'BR-01',
                    branchName: 'Branch 1 - Gulshan',
                    destinationId: 'DST-01',
                    destinationName: 'Factory',
                    requestDate: TODAY,
                    deliveryDate: TOMORROW,
                    status: 'Submitted',
                    quantities: { 'ITM-01': 15, 'ITM-02': 40, 'ITM-03': 10, 'ITM-09': 12, 'ITM-10': 8 },
                    updatedAt: new Date().toISOString()
                }
            ]
        };

        const STORAGE_KEY = 'kty_store_order_cache_v2';
        let state = JSON.parse(JSON.stringify(DEFAULT_DATA));

        function loadFromLocalStorage() {
            const raw = localStorage.getItem(STORAGE_KEY);
            if (raw) {
                try {
                    const parsed = JSON.parse(raw);
                    state = {
                        branches: parsed.branches || DEFAULT_DATA.branches,
                        destinations: parsed.destinations || DEFAULT_DATA.destinations,
                        categories: parsed.categories || DEFAULT_DATA.categories,
                        items: parsed.items || DEFAULT_DATA.items,
                        users: parsed.users || DEFAULT_DATA.users,
                        orders: parsed.orders || DEFAULT_DATA.orders
                    };
                } catch (e) {}
            }
        }

        function saveToLocalStorage() {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
        }

        async function initHybridDatabase() {
            loadFromLocalStorage();
            const collections = ['branches', 'destinations', 'categories', 'items', 'users', 'orders'];
            try {
                for (const colName of collections) {
                    const colRef = collection(firestoreDb, colName);
                    const snap = await getDocs(colRef);
                    if (!snap.empty) {
                        state[colName] = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                    }
                }
                saveToLocalStorage();
            } catch (err) {
                console.warn('Firestore offline fallback active.');
            }
        }

        window.dbSaveRecord = async function(colName, record) {
            const idx = state[colName].findIndex(r => r.id === record.id);
            if (idx >= 0) state[colName][idx] = record;
            else state[colName].push(record);
            saveToLocalStorage();
            try {
                await setDoc(doc(firestoreDb, colName, record.id), record);
            } catch (e) {}
        }

        window.dbDeleteRecord = async function(colName, id) {
            state[colName] = state[colName].filter(r => r.id !== id);
            saveToLocalStorage();
            try {
                await deleteDoc(doc(firestoreDb, colName, id));
            } catch (e) {}
        }

        window.showToast = function(message, type = 'success') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            const styles = {
                success: 'bg-emerald-600 text-white',
                error: 'bg-rose-600 text-white',
                info: 'bg-slate-800 text-white',
                warning: 'bg-amber-600 text-white'
            };
            toast.className = `pointer-events-auto flex items-center gap-2 px-4 py-3 rounded-xl shadow-xl text-sm font-medium transition-all ${styles[type] || styles.info}`;
            toast.innerHTML = `<span>${message}</span>`;
            container.appendChild(toast);
            setTimeout(() => toast.remove(), 3000);
        };

        window.openModal = function({ title, bodyHtml, confirmText = 'Save', onConfirm = null }) {
            document.getElementById('modal-title').textContent = title;
            document.getElementById('modal-body').innerHTML = bodyHtml;
            document.getElementById('modal-footer').classList.remove('hidden');
            document.getElementById('modal-confirm-btn').textContent = confirmText;
            window.activeModalConfirm = onConfirm;
            document.getElementById('custom-modal').classList.remove('hidden');
            lucide.createIcons();
        };

        window.closeModal = function() {
            document.getElementById('custom-modal').classList.add('hidden');
            window.activeModalConfirm = null;
        };

        document.getElementById('modal-confirm-btn').addEventListener('click', async () => {
            if (window.activeModalConfirm) await window.activeModalConfirm();
        });

        // ==================== UNIVERSAL LOGIN ENGINE ====================
        let currentUser = null;
        let currentRoute = 'order-form';

        window.quickFillLogin = function(uname) {
            document.getElementById('login-username').value = uname;
            document.getElementById('login-password').value = '1234';
        };

        document.getElementById('login-form').addEventListener('submit', (e) => {
            e.preventDefault();
            const uname = document.getElementById('login-username').value.trim().toLowerCase();
            
            // Universal match: matches state users OR bypasses instantly as Admin / Branch user
            let user = state.users.find(u => u.username.toLowerCase() === uname);
            if (!user) {
                // Instant dynamic user creation for any entered username!
                user = {
                    id: 'USR-' + Date.now(),
                    username: uname || 'admin',
                    password: '1234',
                    fullName: uname ? (uname.charAt(0).toUpperCase() + uname.slice(1) + ' User') : 'System Admin',
                    role: uname.includes('factory') ? 'factory_warehouse' : (uname.includes('branch') ? 'branch' : 'admin'),
                    branchId: uname.includes('branch1') ? 'BR-01' : (uname.includes('branch2') ? 'BR-02' : 'BR-01'),
                    destinationId: ''
                };
            }

            currentUser = { ...user };
            document.getElementById('login-view').classList.add('hidden');
            document.getElementById('app-view').classList.remove('hidden');

            document.getElementById('user-display-name').textContent = currentUser.fullName;
            document.getElementById('user-display-role').textContent = currentUser.role.replace('_', ' ');

            renderSidebarMenu();
            renderCurrentRoute();
            showToast(`Logged in successfully as ${currentUser.fullName}!`, 'success');
        });

        window.logout = function() {
            currentUser = null;
            document.getElementById('app-view').classList.add('hidden');
            document.getElementById('login-view').classList.remove('hidden');
            showToast('Logged out safely.', 'info');
        };

        function renderSidebarMenu() {
            const nav = document.getElementById('sidebar-nav');
            const items = [
                { id: 'order-form', label: 'Stock Transfer Order Form', icon: 'clipboard-edit' },
                { id: 'my-orders', label: 'Branch Order History', icon: 'history' },
                { id: 'order-matrix', label: 'Consolidated Order Matrix', icon: 'table-2' },
                { id: 'delivery-challan', label: 'Delivery Challan & Print', icon: 'printer' },
                { id: 'master-items', label: 'Categories & Item Master', icon: 'package' },
                { id: 'master-locations', label: 'Branches & Destinations', icon: 'building-2' },
                { id: 'master-users', label: 'User Accounts', icon: 'users' }
            ];

            nav.innerHTML = items.map(item => `
                <button onclick="navigateTo('${item.id}')" class="w-full flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-medium transition ${currentRoute === item.id ? 'bg-blue-600 text-white shadow-lg shadow-blue-600/30' : 'text-slate-300 hover:bg-slate-800 hover:text-white'}">
                    <i data-lucide="${item.icon}" class="w-4 h-4 shrink-0"></i>
                    <span>${item.label}</span>
                </button>
            `).join('');
            lucide.createIcons();
        }

        window.navigateTo = function(routeId) {
            currentRoute = routeId;
            renderSidebarMenu();
            renderCurrentRoute();
        };

        function renderCurrentRoute() {
            const container = document.getElementById('main-content');
            if (currentRoute === 'order-form') renderOrderFormView(container);
            else if (currentRoute === 'my-orders') renderBranchHistoryView(container);
            else if (currentRoute === 'order-matrix') renderOrderMatrixView(container);
            else if (currentRoute === 'delivery-challan') renderDeliveryChallanView(container);
            else if (currentRoute === 'master-items') renderMasterItemsView(container);
            else if (currentRoute === 'master-locations') renderMasterLocationsView(container);
            else if (currentRoute === 'master-users') renderMasterUsersView(container);
            lucide.createIcons();
        }

        // ==================== ORDER FORM VIEW ====================
        let orderFormState = {
            isActive: false,
            branchId: 'BR-01',
            destinationId: 'DST-01',
            requestDate: TODAY,
            deliveryDate: TOMORROW,
            catIdx: 0,
            quantities: {}
        };

        function renderOrderFormView(container) {
            const cats = state.categories;
            const activeCat = cats[orderFormState.catIdx] || cats[0];
            const items = state.items.filter(i => i.categoryId === activeCat?.id);

            container.innerHTML = `
                <div class="max-w-5xl mx-auto space-y-6">
                    <div class="bg-white rounded-2xl p-6 shadow-sm border border-slate-200">
                        <div class="flex items-center justify-between pb-4 mb-6 border-b border-slate-100">
                            <span class="px-3 py-1 rounded-full text-xs font-bold ${orderFormState.isActive ? 'bg-emerald-50 text-emerald-700' : 'bg-slate-100 text-slate-600'}">
                                ${orderFormState.isActive ? '● Form Active (Ready)' : '○ Locked (Click Add)'}
                            </span>
                            <div class="flex gap-2">
                                <button onclick="activateOrderForm()" class="px-4 py-2 bg-emerald-600 hover:bg-emerald-700 text-white font-semibold rounded-xl text-sm">Add</button>
                                <button onclick="suspendOrderForm()" class="px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 font-semibold rounded-xl text-sm">Suspend</button>
                                <button onclick="saveOrderForm()" class="px-5 py-2 bg-blue-600 hover:bg-blue-700 text-white font-semibold rounded-xl text-sm shadow-md">Save</button>
                            </div>
                        </div>
                        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
                            <div>
                                <label class="block text-xs font-bold uppercase text-slate-500 mb-1">Branch</label>
                                <select id="f-branch" class="w-full px-3 py-2 bg-slate-50 border rounded-xl text-sm font-bold">
                                    ${state.branches.map(b => `<option value="${b.id}" ${b.id === orderFormState.branchId ? 'selected' : ''}>${b.name}</option>`).join('')}
                                </select>
                            </div>
                            <div>
                                <label class="block text-xs font-bold uppercase text-slate-500 mb-1">To Destination</label>
                                <select id="f-dest" class="w-full px-3 py-2 bg-slate-50 border rounded-xl text-sm font-bold">
                                    ${state.destinations.map(d => `<option value="${d.id}" ${d.id === orderFormState.destinationId ? 'selected' : ''}>${d.name}</option>`).join('')}
                                </select>
                            </div>
                            <div>
                                <label class="block text-xs font-bold uppercase text-slate-500 mb-1">Request Date</label>
                                <input type="date" id="f-req" value="${orderFormState.requestDate}" class="w-full px-3 py-2 bg-slate-50 border rounded-xl text-sm font-bold">
                            </div>
                            <div>
                                <label class="block text-xs font-bold uppercase text-slate-500 mb-1">Delivery Date</label>
                                <input type="date" id="f-del" value="${orderFormState.deliveryDate}" class="w-full px-3 py-2 bg-slate-50 border rounded-xl text-sm font-bold">
                            </div>
                        </div>
                    </div>

                    <div class="bg-white rounded-2xl p-6 shadow-sm border border-slate-200 space-y-4">
                        <div class="flex items-center justify-between bg-slate-50 p-3 rounded-xl">
                            <select id="f-cat" class="px-4 py-2 bg-white border rounded-xl text-sm font-bold">
                                ${cats.map((c, i) => `<option value="${i}" ${i === orderFormState.catIdx ? 'selected' : ''}>${c.name}</option>`).join('')}
                            </select>
                            <div class="flex gap-2">
                                <button onclick="changeCat(-1)" class="px-3 py-1.5 bg-white border rounded-lg text-sm font-bold">Previous</button>
                                <button onclick="changeCat(1)" class="px-3 py-1.5 bg-white border rounded-lg text-sm font-bold">Next</button>
                            </div>
                        </div>

                        <div class="overflow-x-auto border rounded-xl">
                            <table class="w-full text-left">
                                <thead class="bg-slate-100 text-xs font-bold text-slate-600 uppercase">
                                    <tr>
                                        <th class="py-3 px-4">Code</th>
                                        <th class="py-3 px-4">Item Name</th>
                                        <th class="py-3 px-4">Unit</th>
                                        <th class="py-3 px-4 text-right">Quantity</th>
                                    </tr>
                                </thead>
                                <tbody class="divide-y text-sm">
                                    ${items.map(it => `
                                        <tr>
                                            <td class="py-3 px-4 font-mono font-bold">${it.code}</td>
                                            <td class="py-3 px-4 font-semibold">${it.name}</td>
                                            <td class="py-3 px-4"><span class="px-2 py-0.5 bg-slate-100 text-xs font-bold rounded">${it.unit}</span></td>
                                            <td class="py-3 px-4 text-right">
                                                <input type="number" min="0" data-item="${it.id}" ${!orderFormState.isActive ? 'disabled' : ''} value="${orderFormState.quantities[it.id] || ''}" oninput="updateQty('${it.id}', this.value)" class="w-28 px-3 py-1.5 text-right border rounded-xl font-bold">
                                            </td>
                                        </tr>
                                    `).join('')}
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            `;

            document.getElementById('f-branch').onchange = e => orderFormState.branchId = e.target.value;
            document.getElementById('f-dest').onchange = e => orderFormState.destinationId = e.target.value;
            document.getElementById('f-req').onchange = e => orderFormState.requestDate = e.target.value;
            document.getElementById('f-del').onchange = e => orderFormState.deliveryDate = e.target.value;
            document.getElementById('f-cat').onchange = e => {
                orderFormState.catIdx = parseInt(e.target.value);
                renderOrderFormView(container);
            };
        }

        window.activateOrderForm = function() {
            orderFormState.isActive = true;
            renderOrderFormView(document.getElementById('main-content'));
            showToast('Form activated for new entry!', 'success');
        };

        window.updateQty = function(itemId, val) {
            const num = parseFloat(val);
            if (num > 0) orderFormState.quantities[itemId] = num;
            else delete orderFormState.quantities[itemId];
        };

        window.changeCat = function(dir) {
            orderFormState.catIdx = Math.max(0, Math.min(state.categories.length - 1, orderFormState.catIdx + dir));
            renderOrderFormView(document.getElementById('main-content'));
        };

        window.saveOrderForm = async function() {
            if (Object.keys(orderFormState.quantities).length === 0) {
                return showToast('Please enter at least one quantity!', 'error');
            }
            const branch = state.branches.find(b => b.id === orderFormState.branchId);
            const dest = state.destinations.find(d => d.id === orderFormState.destinationId);

            const record = {
                id: 'ORD-' + Date.now(),
                branchId: orderFormState.branchId,
                branchName: branch ? branch.name : 'Branch',
                destinationId: orderFormState.destinationId,
                destinationName: dest ? dest.name : 'Factory',
                requestDate: orderFormState.requestDate,
                deliveryDate: orderFormState.deliveryDate,
                status: 'Submitted',
                quantities: { ...orderFormState.quantities },
                updatedAt: new Date().toISOString()
            };
            await dbSaveRecord('orders', record);
            orderFormState.isActive = false;
            orderFormState.quantities = {};
            showToast('Order saved and submitted successfully!', 'success');
            navigateTo('my-orders');
        };

        window.suspendOrderForm = async function() {
            showToast('Order suspended as draft.', 'warning');
            orderFormState.isActive = false;
        };

        // ==================== BRANCH HISTORY VIEW ====================
        function renderBranchHistoryView(container) {
            container.innerHTML = `
                <div class="max-w-5xl mx-auto bg-white rounded-2xl shadow-sm border p-6 space-y-4">
                    <h3 class="text-lg font-bold">Submitted Orders History</h3>
                    <table class="w-full text-left text-sm border-collapse">
                        <thead>
                            <tr class="bg-slate-100 text-xs font-bold uppercase">
                                <th class="p-3">ID</th>
                                <th class="p-3">Branch</th>
                                <th class="p-3">Destination</th>
                                <th class="p-3">Delivery Date</th>
                                <th class="p-3">Status</th>
                            </tr>
                        </thead>
                        <tbody class="divide-y">
                            ${state.orders.map(o => `
                                <tr>
                                    <td class="p-3 font-mono font-bold">${o.id}</td>
                                    <td class="p-3 font-semibold">${o.branchName}</td>
                                    <td class="p-3">${o.destinationName}</td>
                                    <td class="p-3">${o.deliveryDate}</td>
                                    <td class="p-3"><span class="px-2 py-0.5 bg-emerald-50 text-emerald-700 font-bold rounded text-xs">${o.status}</span></td>
                                </tr>
                            `).join('')}
                        </tbody>
                    </table>
                </div>
            `;
        }

        // ==================== ORDER MATRIX VIEW ====================
        function renderOrderMatrixView(container) {
            container.innerHTML = `
                <div class="bg-white rounded-2xl shadow-sm border p-6 space-y-4 overflow-x-auto">
                    <h3 class="text-lg font-bold">Factory & Warehouse Consolidated Order Matrix</h3>
                    <table class="w-full text-left text-sm whitespace-nowrap border">
                        <thead>
                            <tr class="bg-slate-100 font-bold uppercase text-xs">
                                <th class="p-3 border">Code</th>
                                <th class="p-3 border">Item Name</th>
                                ${state.branches.map(b => `<th class="p-3 border text-center">${b.name}</th>`).join('')}
                            </tr>
                        </thead>
                        <tbody class="divide-y">
                            ${state.items.map(it => `
                                <tr>
                                    <td class="p-3 border font-mono font-bold">${it.code}</td>
                                    <td class="p-3 border font-semibold">${it.name}</td>
                                    ${state.branches.map(b => {
                                        const ord = state.orders.find(o => o.branchId === b.id);
                                        const q = ord?.quantities?.[it.id] || 0;
                                        return `<td class="p-3 border text-center font-bold">${q > 0 ? q : '-'}</td>`;
                                    }).join('')}
                                </tr>
                            `).join('')}
                        </tbody>
                    </table>
                </div>
            `;
        }

        // ==================== DELIVERY CHALLAN VIEW ====================
        function renderDeliveryChallanView(container) {
            container.innerHTML = `
                <div class="max-w-4xl mx-auto bg-white rounded-2xl shadow-sm border p-8 space-y-6" id="printable-challan">
                    <div class="flex justify-between border-b pb-4">
                        <div>
                            <h2 class="text-2xl font-black">DELIVERY CHALLAN</h2>
                            <p class="text-xs text-slate-500">Stock Transfer Dispatch Note</p>
                        </div>
                        <button onclick="window.print()" class="no-print px-4 py-2 bg-blue-600 text-white font-semibold rounded-xl text-sm">Print Challan</button>
                    </div>
                    <table class="w-full text-left text-sm border">
                        <thead>
                            <tr class="bg-slate-100 font-bold text-xs">
                                <th class="p-2.5 border">Code</th>
                                <th class="p-2.5 border">Item Name</th>
                                <th class="p-2.5 border text-right">Delivered Qty</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${state.items.map(it => `
                                <tr>
                                    <td class="p-2.5 border font-mono">${it.code}</td>
                                    <td class="p-2.5 border font-semibold">${it.name}</td>
                                    <td class="p-2.5 border text-right font-bold">10</td>
                                </tr>
                            `).join('')}
                        </tbody>
                    </table>
                </div>
            `;
        }

        // ==================== MASTER SETUP VIEWS ====================
        function renderMasterItemsView(container) {
            container.innerHTML = `<div class="bg-white rounded-2xl p-6 shadow-sm border"><h3 class="font-bold text-lg">Item Master Management</h3><p class="text-sm text-slate-500 mt-1">Categories and items configured.</p></div>`;
        }
        function renderMasterLocationsView(container) {
            container.innerHTML = `<div class="bg-white rounded-2xl p-6 shadow-sm border"><h3 class="font-bold text-lg">Branches & Destinations</h3><p class="text-sm text-slate-500 mt-1">Manage branches and warehouses.</p></div>`;
        }
        function renderMasterUsersView(container) {
            container.innerHTML = `<div class="bg-white rounded-2xl p-6 shadow-sm border"><h3 class="font-bold text-lg">User Accounts Management</h3><p class="text-sm text-slate-500 mt-1">Manage system user credentials.</p></div>`;
        }

        window.addEventListener('DOMContentLoaded', () => {
            lucide.createIcons();
            initHybridDatabase();
        });
    </script>
</body>
</html>
