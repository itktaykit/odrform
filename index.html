        body { font-family: 'Inter', sans-serif; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #f1f5f9; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 9999px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

        .excel-grid th, .excel-grid td {
            border: 1px solid #cbd5e1;
        }
        .excel-cell-editable {
            cursor: cell;
            user-select: none;
            transition: background-color 0.12s ease;
        }
        .excel-cell-editable:hover {
            background-color: #eff6ff;
            outline: 1px solid #3b82f6;
            outline-offset: -1px;
        }
        .excel-cell-editing {
            padding: 0 !important;
            background-color: #ffffff !important;
            outline: 2px solid #2563eb !important;
            outline-offset: -2px;
        }
        .sticky-col-sr {
            position: sticky;
            left: 0;
            z-index: 10;
        }
        .sticky-col-code {
            position: sticky;
            left: 3rem;
            z-index: 10;
        }
        .sticky-col-name {
            position: sticky;
            left: 8.5rem;
            z-index: 10;
        }
        .sticky-col-total {
            position: sticky;
            right: 6.5rem;
            z-index: 10;
        }
        .sticky-col-avg {
            position: sticky;
            right: 0;
            z-index: 10;
        }

        .challan-sheet {
            break-after: page;
            page-break-after: always;
        }
        .challan-sheet:last-child {
            break-after: auto;
            page-break-after: auto;
        }

        @media print {
            body * { visibility: hidden !important; }
            #printable-challan, #printable-challan * { visibility: visible !important; }
            #printable-challan {
                position: static !important;
                left: 0 !important;
                top: 0 !important;
                width: 100% !important;
                margin: 0 !important;
                padding: 0 !important;
                box-shadow: none !important;
                border: none !important;
                background: white !important;
            }
            .challan-sheet {
                box-shadow: none !important;
                border: 1px solid #cbd5e1 !important;
                margin-bottom: 0 !important;
                padding: 20px !important;
                break-after: page !important;
                page-break-after: always !important;
            }
            .challan-sheet:last-child {
                break-after: auto !important;
                page-break-after: auto !important;
            }
            .no-print { display: none !important; }
        }
    </style>

            const branchesToRender = state.branches.filter(b => challanSelectedBranchIds.includes(b.id));

            if (branchesToRender.length === 0) {
                return showToast('Please select at least one branch to generate and print a challan.', 'warning');

        // ==================== PRODUCTION MODULE (DAILY SHEET + REPORTS) ====================
        const MONTH_NAMES = [
            'January', 'February', 'March', 'April', 'May', 'June',
            'July', 'August', 'September', 'October', 'November', 'December'
        ];

        function getCurrentYearMonth() {
            return TODAY.slice(0, 7);
        }

        function getDaysInYearMonth(ym) {
            const [y, m] = (ym || getCurrentYearMonth()).split('-').map(Number);
            if (!y || !m) return 30;
            return new Date(y, m, 0).getDate();
        }

        function formatYearMonthLabel(ym) {
            const [y, m] = (ym || getCurrentYearMonth()).split('-').map(Number);
            if (!y || !m) return ym;
            return `${MONTH_NAMES[m - 1]} - ${y}`;
        }

        function formatNumberClean(num) {
            const n = Number(num) || 0;
            if (Math.abs(n - Math.round(n)) < 0.0001) return Math.round(n).toLocaleString('en-US');
            return n.toLocaleString('en-US', { minimumFractionDigits: 1, maximumFractionDigits: 2 });
        }

        async function saveProductionMonthToDb(ym) {
            if (!state.production) state.production = {};
            const monthRecords = state.production[ym] || {};
            saveToLocalStorage();
            try {
                await setDoc(doc(firestoreDb, 'production', ym), {
                    id: ym,
                    monthKey: ym,
                    records: monthRecords,
                    updatedAt: new Date().toISOString()
                });
            } catch (e) {}
        }

            monthKey: getCurrentYearMonth(),
            categoryId: 'ALL',
            searchQuery: ''

        function getProductionSheetItems() {
            const q = (prodSheetState.searchQuery || '').trim().toLowerCase();
            return state.items.filter(it => {
                if (!isItemActive(it)) return false;
                if (prodSheetState.categoryId !== 'ALL' && it.categoryId !== prodSheetState.categoryId) return false;
                if (q) {
                    const matchCode = String(it.code || '').toLowerCase().includes(q);
                    const matchName = String(it.name || '').toLowerCase().includes(q);
                    const matchUnit = String(it.unit || '').toLowerCase().includes(q);
                    if (!matchCode && !matchName && !matchUnit) return false;
                }
                return true;
            });
        }

        window.startProductionCellEdit = function(td) {
            if (!canEditScreen('production-sheet')) return;
            if (td.classList.contains('excel-cell-editing')) return;

            const rawText = td.textContent.replace(/,/g, '').trim();
            const currentVal = parseFloat(rawText) || 0;
            const itemId = td.dataset.itemId;
            const dayNum = parseInt(td.dataset.day);
            const rowIdx = parseInt(td.dataset.prodRow);
            const colIdx = parseInt(td.dataset.prodCol);

            td.classList.add('excel-cell-editing');
            td.innerHTML = `<input type="number" min="0" step="any" value="${currentVal}" class="w-full h-full py-1.5 px-1.5 text-right font-bold text-blue-700 bg-white outline-none min-w-[54px]" />`;

            const input = td.querySelector('input');
            input.focus();
            input.select();

            let committed = false;

            const commitProductionCell = async (navDirection = 'none') => {
                if (committed) return;
                committed = true;

                const newVal = Math.max(0, parseFloat(input.value) || 0);
                td.classList.remove('excel-cell-editing');
                td.textContent = newVal > 0 ? formatNumberClean(newVal) : '0';

                if (newVal > 0) {
                    td.classList.remove('text-slate-300');
                    td.classList.add('text-slate-900', 'bg-emerald-50/50', 'font-bold');
                } else {
                    td.classList.remove('text-slate-900', 'bg-emerald-50/50', 'font-bold');
                    td.classList.add('text-slate-300');
                }

                const ym = prodSheetState.monthKey || getCurrentYearMonth();
                if (newVal !== currentVal) {
                    if (!state.production) state.production = {};
                    if (!state.production[ym]) state.production[ym] = {};
                    if (!state.production[ym][itemId]) state.production[ym][itemId] = {};

                    if (newVal > 0) {
                        state.production[ym][itemId][dayNum] = newVal;
                    } else {
                        delete state.production[ym][itemId][dayNum];
                    }

                    recalculateProductionTotalsDom(ym, itemId, dayNum);
                    await saveProductionMonthToDb(ym);
                    showToast(`Saved Day ${dayNum} production (${formatNumberClean(newVal)})`, 'success');
                }

                if (navDirection === 'down') {
                    const nextRowCell = document.querySelector(`td[data-prod-row="${rowIdx + 1}"][data-prod-col="${colIdx}"]`);
                    if (nextRowCell) startProductionCellEdit(nextRowCell);
                } else if (navDirection === 'right' || navDirection === 'left') {
                    const totalDays = getDaysInYearMonth(ym);
                    let nextRow = rowIdx;
                    let nextCol = navDirection === 'left' ? colIdx - 1 : colIdx + 1;

                    if (nextCol >= totalDays) {
                        nextCol = 0;
                        nextRow = rowIdx + 1;
                    } else if (nextCol < 0) {
                        nextCol = totalDays - 1;
                        nextRow = rowIdx - 1;
                    }

                    const nextCell = document.querySelector(`td[data-prod-row="${nextRow}"][data-prod-col="${nextCol}"]`);
                    if (nextCell) startProductionCellEdit(nextCell);
                }
            };

            input.addEventListener('keydown', async (e) => {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    await commitProductionCell('down');
                } else if (e.key === 'Tab') {
                    e.preventDefault();
                    await commitProductionCell(e.shiftKey ? 'left' : 'right');
                } else if (e.key === 'Escape') {
                    committed = true;
                    td.classList.remove('excel-cell-editing');
                    td.textContent = currentVal > 0 ? formatNumberClean(currentVal) : '0';
                }
            });

            input.addEventListener('blur', async () => {
                await commitProductionCell('none');
            });
        };

        function recalculateProductionTotalsDom(ym, changedItemId, changedDay) {
            const daysCount = getDaysInYearMonth(ym);
            const items = getProductionSheetItems();
            const monthData = (state.production && state.production[ym]) ? state.production[ym] : {};

            // Update changed item row total & average
            const itemRec = monthData[changedItemId] || {};
            let itemTotal = 0;
            for (let d = 1; d <= daysCount; d++) {
                itemTotal += Number(itemRec[d]) || 0;
            }
            const rowTotalEl = document.getElementById(`prod-row-total-${changedItemId}`);
            const rowAvgEl = document.getElementById(`prod-row-avg-${changedItemId}`);
            if (rowTotalEl) rowTotalEl.textContent = formatNumberClean(itemTotal);
            if (rowAvgEl) rowAvgEl.textContent = formatNumberClean(daysCount > 0 ? itemTotal / daysCount : 0);

            // Update changed day column total & average + grand totals
            let dayTotal = 0;
            let grandTotal = 0;
            items.forEach(it => {
                const rec = monthData[it.id] || {};
                dayTotal += Number(rec[changedDay]) || 0;
                for (let d = 1; d <= daysCount; d++) {
                    grandTotal += Number(rec[d]) || 0;
                }
            });

            const dayTotalEl = document.getElementById(`prod-day-total-${changedDay}`);
            const dayAvgEl = document.getElementById(`prod-day-avg-${changedDay}`);
            if (dayTotalEl) dayTotalEl.textContent = formatNumberClean(dayTotal);
            if (dayAvgEl) dayAvgEl.textContent = formatNumberClean(items.length > 0 ? dayTotal / items.length : 0);

            const grandTotalEl = document.getElementById('prod-grand-total');
            const grandDailyAvgEl = document.getElementById('prod-grand-daily-avg');
            const avgPerItemEl = document.getElementById('prod-avg-per-item');
            if (grandTotalEl) grandTotalEl.textContent = formatNumberClean(grandTotal);
            if (grandDailyAvgEl) grandDailyAvgEl.textContent = formatNumberClean(daysCount > 0 ? grandTotal / daysCount : 0);
            if (avgPerItemEl) avgPerItemEl.textContent = formatNumberClean(items.length > 0 ? grandTotal / items.length : 0);
        }

        window.importProductionExcel = function(event) {
            if (!requireEditPermission('production-sheet', 'import production Excel')) return;
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = async function(e) {
                try {
                    const data = new Uint8Array(e.target.result);
                    const workbook = XLSX.read(data, { type: 'array' });
                    const firstSheet = workbook.Sheets[workbook.SheetNames[0]];
                    const rows = XLSX.utils.sheet_to_json(firstSheet, { header: 1, defval: '' });

                    const ym = prodSheetState.monthKey || getCurrentYearMonth();
                    const daysCount = getDaysInYearMonth(ym);
                    if (!state.production) state.production = {};
                    if (!state.production[ym]) state.production[ym] = {};

                    // Locate header row containing day numbers 1..31
                    let headerRowIdx = -1;
                    let codeCol = -1;
                    let nameCol = -1;
                    const dayColMap = {};

                    for (let r = 0; r < Math.min(rows.length, 15); r++) {
                        const row = rows[r] || [];
                        let foundDays = 0;
                        row.forEach((cell, cIdx) => {
                            const val = String(cell ?? '').trim();
                            const num = Number(val);
                            if (val !== '' && !isNaN(num) && num >= 1 && num <= 31 && Number.isInteger(num)) {
                                foundDays++;
                            }
                        });
                        if (foundDays >= 10) {
                            headerRowIdx = r;
                            row.forEach((cell, cIdx) => {
                                const val = String(cell ?? '').trim();
                                const low = val.toLowerCase();
                                const num = Number(val);
                                if (low.includes('code')) codeCol = cIdx;
                                else if (low.includes('item') || low.includes('name') || low.includes('description')) nameCol = cIdx;
                                else if (val !== '' && !isNaN(num) && num >= 1 && num <= 31 && Number.isInteger(num)) {
                                    dayColMap[num] = cIdx;
                                }
                            });
                            break;
                        }
                    }

                    if (headerRowIdx === -1) {
                        event.target.value = '';
                        return showToast('Could not detect day columns (1..31) in the uploaded Excel sheet.', 'error');
                    }

                    if (codeCol === -1) codeCol = 1;
                    if (nameCol === -1) nameCol = 2;

                    // Ensure a default Production category exists if auto-creating new items
                    let defaultCatId = state.categories[0]?.id || '';
                    if (!defaultCatId) {
                        const newCat = { id: 'CAT-' + Date.now(), name: 'Production Items' };
                        await dbSaveRecord('categories', newCat);
                        defaultCatId = newCat.id;
                    }

                    let importedRows = 0;
                    let createdItems = 0;

                    for (let r = headerRowIdx + 1; r < rows.length; r++) {
                        const row = rows[r];
                        if (!row || row.every(c => String(c ?? '').trim() === '')) continue;

                        const rawCode = String(row[codeCol] ?? '').trim();
                        const rawName = String(row[nameCol] ?? '').trim();
                        const firstCellLow = String(row[0] ?? '').trim().toLowerCase();
                        const nameLow = rawName.toLowerCase();

                        if (firstCellLow.includes('total') || nameLow.includes('total') || (!rawCode && !rawName)) continue;

                        // Match existing item by Code or Name
                        let matchedItem = state.items.find(it =>
                            (rawCode && String(it.code || '').trim().toLowerCase() === rawCode.toLowerCase()) ||
                            (rawName && String(it.name || '').trim().toLowerCase() === rawName.toLowerCase())
                        );

                        if (!matchedItem) {
                            matchedItem = {
                                id: 'ITM-' + (Date.now() + r),
                                code: rawCode || ('PRD-' + (r + 1)),
                                name: rawName || rawCode,
                                unit: 'PCS',
                                altUnit: '',
                                conversionFactor: 1,
                                conversionDirection: 'down',
                                status: 'Active',
                                categoryId: defaultCatId
                            };
                            await dbSaveRecord('items', matchedItem);
                            createdItems++;
                        }

                        if (!state.production[ym][matchedItem.id]) {
                            state.production[ym][matchedItem.id] = {};
                        }

                        Object.entries(dayColMap).forEach(([dayStr, cIdx]) => {
                            const d = parseInt(dayStr);
                            if (d >= 1 && d <= daysCount) {
                                const qty = parseFloat(row[cIdx]);
                                if (!isNaN(qty) && qty > 0) {
                                    state.production[ym][matchedItem.id][d] = qty;
                                } else {
                                    delete state.production[ym][matchedItem.id][d];
                                }
                            }
                        });
                        importedRows++;
                    }

                    event.target.value = '';
                    await saveProductionMonthToDb(ym);
                    renderCurrentRoute();
                    showToast(`Imported ${importedRows} production row(s)${createdItems > 0 ? ` (${createdItems} new items added)` : ''}!`, 'success');
                } catch (err) {
                    console.error(err);
                    showToast('Failed to parse Production Excel file.', 'error');
                }
            };
            reader.readAsArrayBuffer(file);
        };

        function buildProductionReportDataset() {
            const { periodType, year, month, quarter, categoryId } = prodReportState;
            const prodMap = state.production || {};

            const filteredItems = state.items.filter(it => {
                if (!isItemActive(it)) return false;
                if (categoryId !== 'ALL' && it.categoryId !== categoryId) return false;
                return true;
            });

            let subColumns = []; // { key, label, months: ['YYYY-MM'], calendarDays }
            let periodTitle = '';

            if (periodType === 'monthly') {
                const ym = `${year}-${String(month).padStart(2, '0')}`;
                const totalDays = getDaysInYearMonth(ym);
                periodTitle = `Monthly Production Report — ${MONTH_NAMES[month - 1]} ${year}`;
                // Group into 4 weekly buckets for clean analytical comparison + exact total/average
                const weekRanges = [
                    { key: 'W1', label: 'Days 1–7', start: 1, end: 7 },
                    { key: 'W2', label: 'Days 8–14', start: 8, end: 14 },
                    { key: 'W3', label: 'Days 15–21', start: 15, end: 21 },
                    { key: 'W4', label: `Days 22–${totalDays}`, start: 22, end: totalDays }
                ];
                subColumns = weekRanges.map(w => ({
                    key: w.key,
                    label: w.label,
                    ymList: [ym],
                    dayStart: w.start,
                    dayEnd: w.end,
                    calendarDays: w.end - w.start + 1
                }));
            } else if (periodType === 'quarterly') {
                const startM = (quarter - 1) * 3 + 1;
                const qMonths = [startM, startM + 1, startM + 2];
                periodTitle = `Quarterly Production Report — Q${quarter} ${year} (${qMonths.map(m => MONTH_NAMES[m - 1].slice(0, 3)).join(', ')})`;
                subColumns = qMonths.map(m => {
                    const ym = `${year}-${String(m).padStart(2, '0')}`;
                    return {
                        key: `M${m}`,
                        label: `${MONTH_NAMES[m - 1]}`,
                        ymList: [ym],
                        dayStart: 1,
                        dayEnd: getDaysInYearMonth(ym),
                        calendarDays: getDaysInYearMonth(ym)
                    };
                });
            } else {
                periodTitle = `Yearly Production Report — Year ${year}`;
                subColumns = Array.from({ length: 12 }, (_, idx) => {
                    const m = idx + 1;
                    const ym = `${year}-${String(m).padStart(2, '0')}`;
                    return {
                        key: `M${m}`,
                        label: MONTH_NAMES[idx].slice(0, 3),
                        ymList: [ym],
                        dayStart: 1,
                        dayEnd: getDaysInYearMonth(ym),
                        calendarDays: getDaysInYearMonth(ym)
                    };
                });
            }

            const totalCalendarDays = subColumns.reduce((acc, c) => acc + c.calendarDays, 0);
            const subPeriodCount = subColumns.length;
            const colTotals = {};
            subColumns.forEach(c => colTotals[c.key] = 0);

            let grandTotal = 0;
            let activeProducedItemsCount = 0;
            let topItem = { name: '-', total: 0 };

            const rows = filteredItems.map((it, idx) => {
                const cat = state.categories.find(c => c.id === it.categoryId);
                const values = {};
                let itemTotal = 0;

                subColumns.forEach(col => {
                    let colSum = 0;
                    col.ymList.forEach(ym => {
                        const rec = prodMap[ym]?.[it.id] || {};
                        for (let d = col.dayStart; d <= col.dayEnd; d++) {
                            colSum += Number(rec[d]) || 0;
                        }
                    });
                    values[col.key] = colSum;
                    colTotals[col.key] += colSum;
                    itemTotal += colSum;
                });

                if (itemTotal > 0) activeProducedItemsCount++;
                if (itemTotal > topItem.total) {
                    topItem = { name: it.name, total: itemTotal };
                }
                grandTotal += itemTotal;

                const avgPerSubPeriod = subPeriodCount > 0 ? itemTotal / subPeriodCount : 0;
                const avgPerDay = totalCalendarDays > 0 ? itemTotal / totalCalendarDays : 0;

                return {
                    sr: idx + 1,
                    id: it.id,
                    code: it.code,
                    name: it.name,
                    unit: it.unit || 'PCS',
                    categoryName: cat ? cat.name : '-',
                    values,
                    total: itemTotal,
                    avgPerSubPeriod,
                    avgPerDay
                };
            });

            return {
                periodTitle,
                subColumns,
                rows,
                colTotals,
                grandTotal,
                totalCalendarDays,
                subPeriodCount,
                activeProducedItemsCount,
                topItem,
                avgLabelHeader: periodType === 'monthly' ? 'Weekly Avg' : 'Monthly Avg'
            };
        }

        window.exportProductionReportExcel = function() {
            const ds = buildProductionReportDataset();
            const s = state.settings || DEFAULT_SETTINGS;
            const overallSubPeriodAvg = ds.subPeriodCount > 0 ? ds.grandTotal / ds.subPeriodCount : 0;
            const overallDailyAvg = ds.totalCalendarDays > 0 ? ds.grandTotal / ds.totalCalendarDays : 0;

            const headers = ['Sr', 'Code', 'Item Name', 'Category', 'Unit', ...ds.subColumns.map(c => c.label), 'Period Total', ds.avgLabelHeader, 'Daily Avg'];
            const aoa = [
                [`${s.companyName || 'Factory'} — ${ds.periodTitle}`],
                [`Generated on: ${TODAY}`],
                [],
                headers
            ];

            ds.rows.forEach(r => {
                aoa.push([
                    r.sr,
                    r.code,
                    r.name,
                    r.categoryName,
                    r.unit,
                    ...ds.subColumns.map(c => Number((r.values[c.key] || 0).toFixed(2))),
                    Number(r.total.toFixed(2)),
                    Number(r.avgPerSubPeriod.toFixed(2)),
                    Number(r.avgPerDay.toFixed(2))
                ]);
            });

            aoa.push([
                '', '', 'GRAND TOTAL PRODUCTION', '', '',
                ...ds.subColumns.map(c => Number((ds.colTotals[c.key] || 0).toFixed(2))),
                Number(ds.grandTotal.toFixed(2)),
                Number(overallSubPeriodAvg.toFixed(2)),
                Number(overallDailyAvg.toFixed(2))
            ]);

            aoa.push([
                '', '', 'AVERAGE OUTPUT PER ITEM', '', '',
                ...ds.subColumns.map(c => Number((ds.rows.length > 0 ? ds.colTotals[c.key] / ds.rows.length : 0).toFixed(2))),
                Number((ds.rows.length > 0 ? ds.grandTotal / ds.rows.length : 0).toFixed(2)),
                Number((ds.rows.length > 0 ? overallSubPeriodAvg / ds.rows.length : 0).toFixed(2)),
                Number((ds.rows.length > 0 ? overallDailyAvg / ds.rows.length : 0).toFixed(2))
            ]);

            const ws = XLSX.utils.aoa_to_sheet(aoa);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, 'Production Report');
            XLSX.writeFile(wb, `Production_Report_${prodReportState.periodType}_${prodReportState.year}.xlsx`);
            showToast('Exported Production Report to Excel!', 'success');
        };

        window.exportProductionReportPdf = function() {
            const { jsPDF } = window.jspdf;
            const docPdf = new jsPDF({ orientation: 'landscape', unit: 'pt', format: 'a4' });
            const ds = buildProductionReportDataset();
            const s = state.settings || DEFAULT_SETTINGS;
            const overallSubPeriodAvg = ds.subPeriodCount > 0 ? ds.grandTotal / ds.subPeriodCount : 0;
            const overallDailyAvg = ds.totalCalendarDays > 0 ? ds.grandTotal / ds.totalCalendarDays : 0;

            docPdf.setFillColor(30, 41, 59);
            docPdf.rect(32, 24, docPdf.internal.pageSize.getWidth() - 64, 50, 'F');
            docPdf.setTextColor(255, 255, 255);
            docPdf.setFontSize(14);
            docPdf.setFont('helvetica', 'bold');
            docPdf.text(`${s.companyName || 'Production Factory'} — ${ds.periodTitle}`, 44, 46);
            docPdf.setFontSize(9);
            docPdf.setFont('helvetica', 'normal');
            docPdf.text(`Total Output: ${formatNumberClean(ds.grandTotal)}   |   ${ds.avgLabelHeader}: ${formatNumberClean(overallSubPeriodAvg)}   |   Daily Avg: ${formatNumberClean(overallDailyAvg)}   |   Date: ${TODAY}`, 44, 63);

            const head = [['Sr', 'Code', 'Item Name', 'Category', 'Unit', ...ds.subColumns.map(c => c.label), 'Total', ds.avgLabelHeader, 'Daily Avg']];
            const body = ds.rows.map(r => [
                String(r.sr),
                r.code,
                r.name,
                r.categoryName,
                r.unit,
                ...ds.subColumns.map(c => formatNumberClean(r.values[c.key] || 0)),
                formatNumberClean(r.total),
                formatNumberClean(r.avgPerSubPeriod),
                formatNumberClean(r.avgPerDay)
            ]);

            const totalIdx = 5 + ds.subColumns.length;
            const periodAvgIdx = 6 + ds.subColumns.length;
            const dailyAvgIdx = 7 + ds.subColumns.length;

            body.push([
                '', '', 'GRAND TOTAL', '', '',
                ...ds.subColumns.map(c => formatNumberClean(ds.colTotals[c.key] || 0)),
                formatNumberClean(ds.grandTotal),
                formatNumberClean(overallSubPeriodAvg),
                formatNumberClean(overallDailyAvg)
            ]);

            body.push([
                '', '', 'AVG / ITEM', '', '',
                ...ds.subColumns.map(c => formatNumberClean(ds.rows.length > 0 ? ds.colTotals[c.key] / ds.rows.length : 0)),
                formatNumberClean(ds.rows.length > 0 ? ds.grandTotal / ds.rows.length : 0),
                formatNumberClean(ds.rows.length > 0 ? overallSubPeriodAvg / ds.rows.length : 0),
                formatNumberClean(ds.rows.length > 0 ? overallDailyAvg / ds.rows.length : 0)
            ]);

            docPdf.autoTable({
                startY: 84,
                margin: { left: 32, right: 32 },
                head,
                body,
                theme: 'grid',
                styles: { fontSize: 7.5, cellPadding: 3.5, lineColor: [203, 213, 225], lineWidth: 0.4 },
                headStyles: { fillColor: [51, 65, 85], textColor: [255, 255, 255], fontStyle: 'bold' },
                columnStyles: {
                    0: { halign: 'center' },
                    [totalIdx]: { fillColor: [209, 250, 229], textColor: [6, 78, 59], fontStyle: 'bold', halign: 'right' },
                    [periodAvgIdx]: { fillColor: [254, 243, 199], textColor: [120, 53, 15], fontStyle: 'bold', halign: 'right' },
                    [dailyAvgIdx]: { fillColor: [224, 231, 255], textColor: [49, 46, 129], fontStyle: 'bold', halign: 'right' }
                },
                didParseCell: function(data) {
                    if (data.section === 'head') {
                        if (data.column.index === totalIdx) data.cell.styles.fillColor = [4, 120, 87];
                        if (data.column.index === periodAvgIdx) data.cell.styles.fillColor = [217, 119, 6];
                        if (data.column.index === dailyAvgIdx) data.cell.styles.fillColor = [67, 56, 202];
                    }
                    if (data.section === 'body' && data.row.index >= body.length - 2) {
                        const isGrand = data.row.index === body.length - 2;
                        data.cell.styles.fillColor = isGrand ? [30, 41, 59] : [241, 245, 249];
                        data.cell.styles.textColor = isGrand ? [255, 255, 255] : [30, 41, 59];
                        data.cell.styles.fontStyle = 'bold';
                    }
                }
            });

            docPdf.save(`Production_Report_${prodReportState.periodType}_${prodReportState.year}.pdf`);
            showToast('Exported Production Report to PDF!', 'success');
        };

                const allGroupView = group.children.every(c => Boolean(perms[c.id]?.view));
                const allGroupEdit = group.children.every(c => Boolean(perms[c.id]?.edit));

                return `
                    <div class="p-3 bg-slate-50 border border-slate-200 rounded-xl space-y-2.5">

                                </label>

                                </label>
                            </div>

                                        <span class="font-semibold text-slate-800 truncate">${escapeHtml(sub.label)}</span>

                                                <input type="checkbox" data-perm-screen="${sub.id}" data-perm-action="view" data-perm-group="${group.id}" ${p.view ? 'checked' : ''} onchange="onScreenViewPermissionChange('${sub.id}', this.checked)" class="rounded text-blue-600 w-3.5 h-3.5">
                                                <span>View</span>
                                            </label>
                                            <label class="inline-flex items-center gap-1 text-emerald-700 cursor-pointer">

        window.onScreenViewPermissionChange = function(screenId, canView) {
            const editCb = document.querySelector(`input[data-perm-screen="${screenId}"][data-perm-action="edit"]`);
            if (editCb) {
                editCb.disabled = !canView;
                if (!canView) editCb.checked = false;
            }
        };

        window.onScreenEditPermissionChange = function(screenId, canEdit) {
            if (!canEdit) return;
            const viewCb = document.querySelector(`input[data-perm-screen="${screenId}"][data-perm-action="view"]`);
            if (viewCb && !viewCb.checked) {
                viewCb.checked = true;
            }
        };

        window.toggleGroupActionPermission = function(groupId, action, checked) {
            document.querySelectorAll(`input[data-perm-group="${groupId}"][data-perm-action="${action}"]`).forEach(cb => {
                if (action === 'edit' && checked) {
                    const screenId = cb.dataset.permScreen;
                    const viewCb = document.querySelector(`input[data-perm-screen="${screenId}"][data-perm-action="view"]`);
                    if (viewCb) viewCb.checked = true;
                    cb.disabled = false;
                }
                cb.checked = checked;
                if (action === 'view' && !checked) {
                    const screenId = cb.dataset.permScreen;
                    const editCb = document.querySelector(`input[data-perm-screen="${screenId}"][data-perm-action="edit"]`);
                    if (editCb) {
                        editCb.checked = false;
                        editCb.disabled = true;
                    }
                }
            });
        };

        window.applySelectedRolesPreset = function() {
            const selectedRoles = Array.from(document.querySelectorAll('input[data-user-role-cb]:checked')).map(cb => cb.value);
            const rolesToApply = selectedRoles.length > 0 ? selectedRoles : ['branch'];
            const defaults = buildDefaultPermissionsForRoles(rolesToApply);

            document.querySelectorAll('input[data-perm-screen][data-perm-action="view"]').forEach(viewCb => {
                const screenId = viewCb.dataset.permScreen;
                const def = defaults[screenId] || { view: false, edit: false };
                viewCb.checked = Boolean(def.view);

                const editCb = document.querySelector(`input[data-perm-screen="${screenId}"][data-perm-action="edit"]`);
                if (editCb) {
                    editCb.disabled = !def.view;
                    editCb.checked = Boolean(def.view && def.edit);
                }
            });
        };

        window.openUserModal = function(id = null) {
            if (!requireEditPermission('master-users', 'manage users and permissions')) return;

                ? { ...existing, roles: getUserRolesList(existing) }
                : { id: 'USR-' + Date.now(), username: '', passwordHash: '', fullName: '', role: 'branch', roles: ['branch'], branchId: '', destinationId: '', permissions: buildDefaultPermissionsForRoles(['branch']) };

            openModal({
                title: id ? 'Edit User, Multi-Roles & Permissions' : 'Add User Account',
                bodyHtml: `
                    <div class="space-y-4">
                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                            <div><label class="block text-xs font-bold uppercase text-slate-500 mb-1">Username</label><input type="text" id="m-u-name" value="${escapeHtml(u.username)}" ${u.username === 'admin' ? 'readonly' : ''} class="w-full px-3 py-2 border rounded-xl text-sm font-bold"></div>
                            <div><label class="block text-xs font-bold uppercase text-slate-500 mb-1">${id ? 'New Password (optional)' : 'Password'}</label><input type="password" id="m-u-pass" placeholder="Enter password" class="w-full px-3 py-2 border rounded-xl text-sm font-bold"></div>
                        </div>
                        <div>
                            <label class="block text-xs font-bold uppercase text-slate-500 mb-1">Full Name</label>
                            <input type="text" id="m-u-full" value="${escapeHtml(u.fullName)}" class="w-full px-3 py-2 border rounded-xl text-sm font-bold">
                        </div>

                        <div class="p-3 bg-slate-50 border border-slate-200 rounded-xl space-y-2">
                            <div class="flex items-center justify-between">
                                <label class="text-xs font-extrabold uppercase text-slate-700">Assigned Roles (Multiple Allowed)</label>
                                <button type="button" onclick="applySelectedRolesPreset()" class="text-[11px] font-bold text-blue-600 hover:underline">Apply Preset from Selected Roles</button>
                            </div>
                            <div class="grid grid-cols-1 sm:grid-cols-2 gap-2">
                                ${ROLE_CATALOG.map(r => {
                                    const checked = u.roles.includes(r.id);
                                    return `
                                        <label class="flex items-center gap-2 px-3 py-2 bg-white border border-slate-200 rounded-lg text-xs font-bold text-slate-700 cursor-pointer">
                                            <input type="checkbox" data-user-role-cb value="${r.id}" ${checked ? 'checked' : ''} class="rounded text-blue-600 w-4 h-4">
                                            <span>${escapeHtml(r.label)}</span>
                                        </label>
                                    `;
                                }).join('')}
                            </div>
                        </div>

                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                            <div>
                                <label class="block text-xs font-bold uppercase text-slate-500 mb-1">Restrict Branch (Optional)</label>
                                <select id="m-u-branch" class="w-full px-3 py-2 border rounded-xl text-sm font-bold">
                                    <option value="">-- Any Branch --</option>
                                    ${state.branches.map(b => `<option value="${b.id}" ${b.id === u.branchId ? 'selected' : ''}>${escapeHtml(b.name)}</option>`).join('')}
                                </select>
                            </div>
                            <div>
                                <label class="block text-xs font-bold uppercase text-slate-500 mb-1">Restrict Destination (Optional)</label>
                                <select id="m-u-dest" class="w-full px-3 py-2 border rounded-xl text-sm font-bold">
                                    <option value="">-- All Destinations --</option>
                                    ${state.destinations.map(d => `<option value="${d.id}" ${d.id === u.destinationId ? 'selected' : ''}>${escapeHtml(d.name)}</option>`).join('')}
                                </select>
                            </div>
                        </div>

                        <div class="space-y-2">
                            <label class="block text-xs font-bold uppercase text-slate-500">Menu &amp; Submenu Document Permissions (View vs. Edit / Save)</label>
                            ${renderPermissionMatrixHtml(u)}
                        </div>
                    </div>
                `,
                onConfirm: async () => {
                    const newUsername = document.getElementById('m-u-name').value.trim();
                    const rawPass = document.getElementById('m-u-pass').value;
                    if (!newUsername) return showToast('Username is required!', 'error');
                    if (!id && !rawPass) return showToast('Password is required for new users!', 'error');

                    let selectedRoles = Array.from(document.querySelectorAll('input[data-user-role-cb]:checked')).map(cb => cb.value);
                    if (u.username === 'admin' && !selectedRoles.includes('admin')) {
                        selectedRoles.unshift('admin');
                    }
                    if (selectedRoles.length === 0) {
                        return showToast('Please select at least one role for the user!', 'error');
                    }

                    const collectedPerms = {};
                    getAllScreenIds().forEach(screenId => {
                        const viewCb = document.querySelector(`input[data-perm-screen="${screenId}"][data-perm-action="view"]`);
                        const editCb = document.querySelector(`input[data-perm-screen="${screenId}"][data-perm-action="edit"]`);
                        const canView = Boolean(viewCb?.checked);
                        const canEdit = canView && Boolean(editCb?.checked);
                        collectedPerms[screenId] = { view: canView, edit: canEdit };
                    });

                    u.username = newUsername;
                    if (rawPass) {
                        u.passwordHash = await hashPassword(rawPass);
                        delete u.password;
                    }
                    u.fullName = document.getElementById('m-u-full').value.trim() || newUsername;
                    u.roles = selectedRoles;
                    u.role = selectedRoles[0];
                    u.branchId = document.getElementById('m-u-branch').value;
                    u.destinationId = document.getElementById('m-u-dest').value;
                    u.permissions = collectedPerms;

                    await dbSaveRecord('users', u);

                    if (currentUser && currentUser.id === u.id) {
                        currentUser = { ...u };
                        sessionStorage.setItem('kty_active_user', JSON.stringify(currentUser));
                        updateHeaderUserDisplay(currentUser);
                        renderSidebarMenu();
                    }

                    closeModal();
                    renderCurrentRoute();
                    showToast('User roles & document permissions saved successfully!');
                }
            });
        };

        // ==================== 8. COMPANY & SYSTEM SETTINGS ====================
        function renderSystemSettingsView(container) {
            const canEdit = canEditScreen('system-settings');
            const s = state.settings || DEFAULT_SETTINGS;

            container.innerHTML = `
                <div class="max-w-3xl mx-auto bg-white rounded-2xl p-6 md:p-8 shadow-sm border border-slate-200 space-y-6">
                    <div class="flex items-center justify-between border-b pb-4">
                        <div>
                            <h3 class="text-lg font-bold text-slate-900">Company Profile &amp; Software Branding</h3>
                            <p class="text-xs text-slate-500">Displayed on the Login Screen, Navigation Sidebar, and Delivery Challans</p>
                        </div>
                        <button onclick="saveSystemSettings()" ${!canEdit ? 'disabled' : ''} class="px-5 py-2.5 ${!canEdit ? 'bg-slate-200 text-slate-400 cursor-not-allowed' : 'bg-blue-600 hover:bg-blue-700 text-white shadow-md'} font-semibold rounded-xl text-sm flex items-center gap-2">
                            <i data-lucide="save" class="w-4 h-4"></i> Save Settings
                        </button>
                    </div>

                    <div class="flex flex-col sm:flex-row items-center gap-6 p-4 bg-slate-50 rounded-2xl border border-slate-200">
                        <div id="settings-logo-preview" class="w-24 h-24 bg-white border-2 border-dashed border-slate-300 rounded-2xl flex items-center justify-center overflow-hidden shrink-0 p-2">
                            ${s.logoDataUrl ? `<img src="${s.logoDataUrl}" class="max-w-full max-h-full object-contain">` : `<i data-lucide="image" class="w-8 h-8 text-slate-400"></i>`}
                        </div>
                        <div class="space-y-2 text-center sm:text-left">
                            <div class="font-bold text-sm text-slate-800">Company Logo</div>
                            <p class="text-xs text-slate-500">Upload a PNG, JPG, or SVG logo (max 500KB recommended for fast Firestore sync).</p>
                            <div class="flex flex-wrap justify-center sm:justify-start gap-2 pt-1">
                                <label class="px-4 py-2 ${!canEdit ? 'bg-slate-300 text-slate-500 cursor-not-allowed' : 'bg-blue-600 hover:bg-blue-700 text-white cursor-pointer'} font-semibold rounded-xl text-xs transition">
                                    Upload Logo <input type="file" accept="image/*" ${!canEdit ? 'disabled' : ''} class="hidden" onchange="handleLogoUpload(event)">
                                </label>
                                ${s.logoDataUrl && canEdit ? `<button type="button" onclick="removeCompanyLogo()" class="px-3 py-2 bg-rose-50 hover:bg-rose-100 text-rose-600 font-semibold rounded-xl text-xs">Remove Logo</button>` : ''}
                            </div>
                        </div>
                    </div>

                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-xs font-bold uppercase text-slate-500 mb-1">Software Title</label>
                            <input type="text" id="set-software-name" ${!canEdit ? 'disabled' : ''} value="${escapeHtml(s.softwareName)}" class="w-full px-3.5 py-2.5 bg-slate-50 border rounded-xl text-sm font-bold">
                        </div>
                        <div>
                            <label class="block text-xs font-bold uppercase text-slate-500 mb-1">Company Name</label>
                            <input type="text" id="set-company-name" ${!canEdit ? 'disabled' : ''} value="${escapeHtml(s.companyName)}" class="w-full px-3.5 py-2.5 bg-slate-50 border rounded-xl text-sm font-bold">
                        </div>
                        <div class="sm:col-span-2">
                            <label class="block text-xs font-bold uppercase text-slate-500 mb-1">Tagline / Subtitle</label>
                            <input type="text" id="set-tagline" ${!canEdit ? 'disabled' : ''} value="${escapeHtml(s.tagline)}" class="w-full px-3.5 py-2.5 bg-slate-50 border rounded-xl text-sm font-medium">
                        </div>
                        <div class="sm:col-span-2">
                            <label class="block text-xs font-bold uppercase text-slate-500 mb-1">Company Address</label>
                            <input type="text" id="set-address" ${!canEdit ? 'disabled' : ''} value="${escapeHtml(s.address)}" class="w-full px-3.5 py-2.5 bg-slate-50 border rounded-xl text-sm font-medium">
                        </div>
                        <div>
                            <label class="block text-xs font-bold uppercase text-slate-500 mb-1">Contact Phone</label>
                            <input type="text" id="set-phone" ${!canEdit ? 'disabled' : ''} value="${escapeHtml(s.phone)}" class="w-full px-3.5 py-2.5 bg-slate-50 border rounded-xl text-sm font-medium">
                        </div>
                        <div>
                            <label class="block text-xs font-bold uppercase text-slate-500 mb-1">Contact Email / Website</label>
                            <input type="text" id="set-email" ${!canEdit ? 'disabled' : ''} value="${escapeHtml(s.email)}" class="w-full px-3.5 py-2.5 bg-slate-50 border rounded-xl text-sm font-medium">
                        </div>
                        <div class="sm:col-span-2">
                            <label class="block text-xs font-bold uppercase text-slate-500 mb-1">CR / VAT / Registration Info (Optional)</label>
                            <input type="text" id="set-tax" ${!canEdit ? 'disabled' : ''} value="${escapeHtml(s.taxId)}" class="w-full px-3.5 py-2.5 bg-slate-50 border rounded-xl text-sm font-medium">
                        </div>
                    </div>
                </div>
            `;
        }

        window.handleLogoUpload = function(event) {
            if (!requireEditPermission('system-settings', 'upload company logo')) return;
            const file = event.target.files[0];
            if (!file) return;
            if (file.size > 800 * 1024) {
                return showToast('Logo file is too large (max 800KB). Please compress it first.', 'error');
            }
            const reader = new FileReader();
            reader.onload = function(e) {
                state.settings.logoDataUrl = e.target.result;
                renderSystemSettingsView(document.getElementById('main-content'));
                lucide.createIcons();
                showToast('Logo loaded! Click "Save Settings" to apply.', 'info');
            };
            reader.readAsDataURL(file);
        };

        window.removeCompanyLogo = function() {
            if (!requireEditPermission('system-settings', 'remove company logo')) return;
            state.settings.logoDataUrl = '';
            renderSystemSettingsView(document.getElementById('main-content'));
            lucide.createIcons();
        };

        window.saveSystemSettings = async function() {
            if (!requireEditPermission('system-settings', 'save company settings')) return;

            state.settings = {
                id: 'MAIN_SETTINGS',
                softwareName: document.getElementById('set-software-name').value.trim() || 'StockTransfer ERP',
                companyName: document.getElementById('set-company-name').value.trim() || 'Company Name',
                tagline: document.getElementById('set-tagline').value.trim(),
                address: document.getElementById('set-address').value.trim(),
                phone: document.getElementById('set-phone').value.trim(),
                email: document.getElementById('set-email').value.trim(),
                taxId: document.getElementById('set-tax').value.trim(),
                logoDataUrl: state.settings.logoDataUrl || ''
            };
            saveToLocalStorage();
            try {
                await setDoc(doc(firestoreDb, 'settings', 'MAIN_SETTINGS'), state.settings);
            } catch (e) {}
            applyCompanyBranding();
            showToast('Company & software information saved successfully!', 'success');
        };

        window.deleteRecord = async function(colName, id) {
            if (!requireEditPermission(currentRoute, `delete from ${colName}`)) return;
            openModal({
                title: 'Confirm Deletion',
                bodyHtml: '<p>Are you sure you want to delete this record?</p>',
                confirmText: 'Delete',
                onConfirm: async () => {
                    await dbDeleteRecord(colName, id);
                    closeModal();
                    renderCurrentRoute();
                    showToast('Record deleted successfully.', 'info');
                }
            });
        };

        // ==================== SMART EXCEL IMPORT ====================
        function isHeaderRow(cells) {
            const joined = cells.map(c => String(c || '').trim().toLowerCase()).join('|');
            return (
                joined.includes('item name') ||
                joined.includes('item code') ||
                joined.includes('category name') ||
                joined.includes('branch name') ||
                joined.includes('destination name') ||
                /^(sr|s\.no|sl|no|id|#)\|/.test(joined) ||
                /\|(code|name|unit|category|address|type)(\||$)/.test(joined)
            );
        }

        function isSerialNumber(val) {
            if (typeof val === 'number') return true;
            const str = String(val || '').trim();
            return /^\d+$/.test(str);
        }

        window.importExcelData = async function(event, colName) {
            if (!requireEditPermission(currentRoute, `import ${colName}`)) return;
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = async function(e) {
                try {
                    const data = new Uint8Array(e.target.result);
                    const workbook = XLSX.read(data, { type: 'array' });
                    const firstSheet = workbook.Sheets[workbook.SheetNames[0]];
                    const rows = XLSX.utils.sheet_to_json(firstSheet, { header: 1, defval: '' });

                    let count = 0;
                    const batchId = Date.now();

                    for (let i = 0; i < rows.length; i++) {
                        const rawRow = rows[i];
                        if (!rawRow || rawRow.every(cell => String(cell).trim() === '')) continue;
                        if (i === 0 && isHeaderRow(rawRow)) continue;

                        const cells = rawRow.map(c => String(c ?? '').trim());

                        if (colName === 'categories') {
                            const catName = (cells.length >= 2 && isSerialNumber(cells[0])) ? cells[1] : cells[0];
                            if (catName) {
                                const rec = { id: 'CAT-' + (batchId + i), name: catName };
                                await dbSaveRecord('categories', rec);
                                count++;
                            }
                        } else if (colName === 'items') {
                            if (!itemMasterFilterCatId) {
                                return showToast('Please select a Target Category first!', 'error');
                            }
                            let offset = (cells.length >= 3 && isSerialNumber(cells[0])) ? 1 : 0;
                            const code = cells[offset] || '';
                            const name = cells[offset + 1] || '';
                            const unit = (cells[offset + 2] || 'PCS').toUpperCase();

                            if (!code && !name) continue;

                            const rec = {
                                id: 'ITM-' + (batchId + i),
                                code: code || ('ITM-' + (i + 1)),
                                name: name || code,
                                unit: unit || 'PCS',
                                altUnit: '',
                                conversionFactor: 1,
                                conversionDirection: 'down',
                                status: 'Active',
                                categoryId: itemMasterFilterCatId
                            };
                            await dbSaveRecord('items', rec);
                            count++;
                        } else if (colName === 'branches') {
                            let offset = (cells.length >= 2 && isSerialNumber(cells[0])) ? 1 : 0;
                            let code = '', name = '', address = '';
                            if (cells.length - offset >= 2) {
                                code = cells[offset];
                                name = cells[offset + 1];
                                address = cells[offset + 2] || '';
                            } else {
                                name = cells[offset];
                                code = name.substring(0, 3).toUpperCase();
                            }
                            if (name) {
                                const rec = {
                                    id: 'BR-' + (batchId + i),
                                    code: code || 'BR',
                                    name: name,
                                    address: address
                                };
                                await dbSaveRecord('branches', rec);
                                count++;
                            }
                        } else if (colName === 'destinations') {
                            let offset = (cells.length >= 2 && isSerialNumber(cells[0])) ? 1 : 0;
                            const name = cells[offset] || '';
                            const type = cells[offset + 1] || 'Warehouse';
                            if (name) {
                                const rec = {
                                    id: 'DST-' + (batchId + i),
                                    name: name,
                                    type: type
                                };
                                await dbSaveRecord('destinations', rec);
                                count++;
                            }
                        }
                    }

                    event.target.value = '';
                    if (count > 0) {
                        if (colName === 'items') {
                            importCompletedForCategory = true;
                        }
                        showToast(`Successfully imported ${count} records into the selected category!`, 'success');
                    } else {
                        showToast('No valid rows found in the Excel file.', 'warning');
                    }
                    renderCurrentRoute();
                } catch (err) {
                    console.error(err);
                    showToast('Failed to parse Excel file.', 'error');
                }
            };
            reader.readAsArrayBuffer(file);
        };

        window.addEventListener('DOMContentLoaded', () => {
            lucide.createIcons();
            initHybridDatabase();
        });
    </script>
</body>
